     "Después de planificar: con pastillas, DIU o implante la fertilidad vuelve en pocas semanas. Con la inyección de cada 3 meses puede tardar varios meses más (a veces hasta un año); eso es esperado.",
     "La dificultad no siempre es de la mujer: en muchas parejas es del hombre o de los dos, así que también se valora a la pareja.",
     "Ayudan: peso adecuado, no fumar ni tomar alcohol, tratar las infecciones y empezar el ácido fólico desde ya.",
     "Si cumple el tiempo o tiene algún factor: remitir a medicina para estudio de la pareja."],
  r:"Se brinda educación sobre tiempo esperado para lograr el embarazo, días fértiles, retorno de la fertilidad según el método previo, factor masculino y criterios de consulta por infertilidad."},
 "Expectativas|Quiere embarazarse":{t:"Para responderle: cómo prepararse para el embarazo",
  p:["Empezar ácido fólico desde ahora, al menos 3 meses antes de quedar embarazada.",
     "Completar las vacunas antes del embarazo.",
     "Llegar con buen peso, sin tabaco ni alcohol (tampoco chicha fuerte), y tratar infecciones y anemia.",
     "Si tuvo un parto o cesárea, esperar al menos 18 meses antes del siguiente embarazo.",
     "Mientras se prepara, seguir planificando si aún no es el momento.",
     "Cuando le falte la regla, venir pronto al control prenatal (antes de la semana 10)."],
  r:"Se brinda educación sobre preparación para el embarazo: ácido fólico, vacunación, peso adecuado, evitar tabaco y alcohol, intervalo intergenésico y control prenatal temprano."},
 "Medicina tradicional|No":{t:"Para responderle: si no ha consultado la medicina tradicional",
  p:["Respetar su decisión, sin empujarla a consultar.",
     "Contarle que, si ella quiere, puede consultar también a su sabedor o partera: la atención tradicional y la del puesto de salud se pueden complementar.",
     "Pedirle que, si más adelante le dan algún remedio o curación, nos cuente, para revisar juntos que no afecte el embarazo."],
  r:"Se informa que la atención tradicional y la del servicio de salud pueden complementarse; se le pide informar cualquier remedio o curación que reciba."},
 "Medicina tradicional|Payé":{t:"Para responderle: si consultó al payé o sabedor",
  p:["Reconocer y valorar la consulta con el payé; no desautorizarlo.",
     "Preguntar qué le recomendó: curaciones, rezos, dietas o alimentos que debe evitar.",
     "Si la dieta le quita alimentos importantes (pescado, carne, huevo), buscar con ella alternativas que el payé acepte, sin contradecirlo de frente.",
     "Explicar que el ácido fólico, las vacunas y los controles no interfieren con sus curaciones; las dos atenciones pueden ir juntas.",
     "Si ella quiere, el payé o un familiar puede acompañarla a los controles.",
     "Acordar que nos cuente si le dan algo para tomar."],
  r:"Se respeta y reconoce la consulta con el médico tradicional; se indagan sus recomendaciones y se concerta la atención complementaria con el servicio de salud."},
 "Medicina tradicional|Partera":{t:"Para responderle: si consultó a la partera",
  p:["Reconocer el papel de la partera en la comunidad.",
     "Preguntar si la partera la va a acompañar en el embarazo y el parto.",
     "Invitar a la partera a los controles, si la usuaria lo desea.",
     "Explicar que cuando quede embarazada debe venir pronto al control (antes de la semana 10) y que el plan de parto se hace también con la partera.",
     "Repasar con ella, y si es posible con la partera, los signos de alarma del embarazo por los que deben venir de inmediato:",
     "• Sangrado por la vagina, aunque sea poco.",
     "• Salida de líquido por la vagina.",
     "• Dolor de cabeza fuerte, ver lucecitas o visión borrosa.",
     "• Hinchazón de la cara, las manos o los pies.",
     "• Fiebre o escalofríos.",
     "• Dolor fuerte de barriga o contracciones antes de tiempo.",
     "• El bebé se mueve menos o deja de moverse (después del 5.º mes).",
     "• Vómito que no deja comer ni beber, ardor al orinar, o convulsiones."],
  r:"Se reconoce el acompañamiento de la partera; se invita a vincularla a los controles y al plan de parto. Se explican los signos de alarma del embarazo: sangrado o salida de líquido por vagina, cefalea intensa o alteraciones visuales, edema de cara y manos, fiebre, dolor abdominal o contracciones antes de tiempo, disminución de movimientos fetales, vómito persistente, disuria y convulsiones."},
 "Medicina tradicional|Remedio de plantas":{t:"Para responderle: si toma remedios de plantas",
  p:["Preguntar el nombre de la planta, para qué la toma, cómo la prepara, cuánta y cada cuánto.",
     "No prohibir de entrada: si es para algo sencillo y no hay señales de riesgo, puede seguir y se registra.",
     "Explicar que algunas plantas pueden producir sangrado, contracciones o afectar al bebé, sobre todo las que se usan para \"bajar la regla\", para purgar o para abortar: si busca embarazo, es mejor no tomarlas.",
     "Si no se sabe qué efecto tiene la planta, anotarla y consultarla con medicina antes de que quede embarazada.",
     "Pedirle que nos cuente si empieza a tomar otra."],
  r:"Se indaga sobre el uso de plantas medicinales (nombre, uso, preparación y frecuencia); se orienta sobre plantas que pueden afectar la gestación y se le pide informar cualquier remedio nuevo."},
 "Enfermedades|Hipertensión":{t:"Hipertensión: qué hacer antes del embarazo",
  p:["Remitir a medicina antes de buscar el embarazo.",
     "Enalapril, losartán y los diuréticos no se usan en el embarazo: medicina los cambia (la 3280 menciona alfametildopa o nifedipino) y solicita los estudios que correspondan. No suspenderlos por su cuenta.",
     "Llegar al embarazo con la presión controlada.",
     "En el embarazo tendrá más riesgo de preeclampsia: control prenatal temprano y valoración por medicina (la aspirina la indica medicina)."],
  r:"Antecedente de hipertensión: se remite a medicina para valoración preconcepcional y ajuste de antihipertensivos antes del embarazo; se explica riesgo de preeclampsia y necesidad de control prenatal temprano."},
 "Enfermedades|Diabetes":{t:"Diabetes: qué hacer antes del embarazo",
  p:["Remitir a medicina antes de buscar el embarazo.",
     "Es muy importante llegar al embarazo con el azúcar bien controlada: el azúcar alta al inicio del embarazo aumenta el riesgo de malformaciones y de perder el bebé.",
     "Medicina solicita hemoglobina glicosilada: la meta antes del embarazo es menor de 6,5 %; ajusta el tratamiento y deriva a la ruta cardio-cerebro-vascular-metabólica. No suspender el tratamiento por su cuenta.",
     "Peso adecuado y ejercicio regular.",
     "Planificar hasta que el médico diga que el control es bueno."],
  r:"Antecedente de diabetes: se remite a medicina para optimizar control glucémico y ajustar tratamiento antes del embarazo; se recomienda anticoncepción hasta lograr control adecuado."},
 "Enfermedades|Epilepsia":{t:"Epilepsia: qué hacer antes del embarazo",
  p:["Remitir a medicina antes de buscar el embarazo.",
     "Enfermería: formular ácido fólico 4 mg/día (no 0,4 mg), desde al menos 3 meses antes del embarazo (Res. 3280).",
     "Medicina define el tratamiento: la 3280 recomienda un solo medicamento a la menor dosis, preferir carbamazepina, lamotrigina o levetiracetam (el ácido valproico aumenta el riesgo de malformaciones) y valorar suspenderlo 6 meses antes si lleva 2 años sin convulsiones.",
     "Nunca suspender el medicamento por su cuenta: una convulsión en el embarazo es peligrosa.",
     "Asesoría y provisión de anticoncepción hasta que medicina lo autorice."],
  r:"Antecedente de epilepsia: se formula ácido fólico 4 mg/día según Res. 3280, se remite a medicina para manejo del anticonvulsivante antes del embarazo, se explica no suspender el tratamiento y se brinda asesoría anticonceptiva."},
 "Enfermedades|Asma":{t:"Asma: qué hacer antes del embarazo",
  p:["Los inhaladores para el asma se pueden usar en el embarazo: debe seguir usándolos.",
     "Lo importante es llegar con el asma controlada; si tiene crisis frecuentes, remitir a medicina.",
     "Evitar el humo de leña y el tabaco."],
  r:"Antecedente de asma: se orienta continuar tratamiento inhalado y lograr control antes del embarazo."},
 "Enfermedades|Anemia":{t:"Anemia: qué hacer antes del embarazo",
  p:["Enfermería: solicitar hemograma y gota gruesa (están en los exámenes preconcepcionales).",
     "Si el hemograma confirma anemia, remitir a medicina para el tratamiento: es un paraclínico anormal.",
     "Alimentos con hierro: carne, pescado, hígado, huevo, fríjol y hojas verdes.",
     "Corregir la anemia antes del embarazo."],
  r:"Antecedente de anemia: se solicitan hemograma y gota gruesa; si se confirma anemia se remite a medicina para tratamiento; se orienta alimentación rica en hierro."},
 "Enfermedades|Tiroides":{t:"Tiroides: qué hacer antes del embarazo",
  p:["Remitir a medicina antes de buscar el embarazo: la tiroides debe estar controlada (TSH).",
     "Si toma levotiroxina, la dosis casi siempre se ajusta al quedar embarazada; no suspenderla."],
  r:"Antecedente de enfermedad tiroidea: se remite a medicina para control de TSH y ajuste del tratamiento antes del embarazo."},
 "Enfermedades|Corazón o riñón":{t:"Enfermedad del corazón o del riñón",
  p:["Remitir a medicina y, según el caso, al especialista antes de buscar el embarazo: algunas de estas enfermedades hacen el embarazo de alto riesgo.",
     "Revisar sus medicamentos con el médico.",
     "Planificar hasta tener esa valoración."],
  r:"Antecedente de enfermedad cardiaca o renal: se remite a medicina/especialista para valoración del riesgo preconcepcional; anticoncepción hasta la valoración."},
 "Enfermedades|Lupus":{t:"Lupus: qué hacer antes del embarazo",
  p:["Remitir a medicina y especialista: lo ideal es embarazarse cuando el lupus lleva varios meses sin actividad.",
     "Algunos medicamentos deben cambiarse antes del embarazo.",
     "Planificar hasta tener esa valoración."],
  r:"Antecedente de lupus: se remite a medicina/especialista para valoración preconcepcional; anticoncepción hasta la valoración."},
 "Enfermedades|Tuberculosis":{t:"Tuberculosis: qué hacer antes del embarazo",
  p:["Si está en tratamiento, terminarlo completo antes de buscar el embarazo.",
     "La rifampicina disminuye el efecto de las pastillas, el implante y las inyecciones: mientras la tome, usar condón o DIU.",
     "Remitir a medicina para valorar el momento del embarazo."],
  r:"Antecedente de tuberculosis: se orienta completar tratamiento, interacción de rifampicina con anticonceptivos hormonales y valoración médica antes del embarazo."},
 "Medicamentos y remedios|Hierro":{t:"Si toma hierro",
  p:["Puede seguir tomándolo; es útil antes y durante el embarazo.","Verificar con el hemograma si todavía lo necesita y por cuánto tiempo.","Tomarlo lejos de las comidas y del café; puede oscurecer las heces y dar estreñimiento."],
  r:"Toma hierro: se orienta continuar según hemograma y forma de administración."},
 "Medicamentos y remedios|Ácido fólico":{t:"Si ya toma ácido fólico",
  p:["Muy bien: debe seguir tomándolo todos los días hasta la semana 12 del embarazo.","La dosis habitual es 0,4 mg al día; la dosis alta (4 mg) solo si tuvo un hijo con defecto del tubo neural o si el médico la indica."],
  r:"Toma ácido fólico: se refuerza adherencia hasta la semana 12 de gestación y se verifica la dosis."},
 "Medicamentos y remedios|Antihipertensivo":{t:"Si toma medicamento para la presión",
  p:["Remitir a medicina antes de buscar el embarazo.","Enalapril, captopril, losartán y otros de ese grupo no se usan en el embarazo: el médico debe cambiarlos antes.","No suspenderlo por su cuenta."],
  r:"Toma antihipertensivo: se remite a medicina para ajuste a un medicamento compatible con la gestación antes del embarazo."},
 "Medicamentos y remedios|Anticonvulsivante":{t:"Si toma medicamento para las convulsiones",
  p:["Remitir a medicina antes de buscar el embarazo.","El ácido valproico y algunos otros aumentan el riesgo de malformaciones: el médico puede cambiarlos.","Nunca suspenderlo por su cuenta."],
  r:"Toma anticonvulsivante: se remite a medicina para revisión del tratamiento y dosis de ácido fólico antes del embarazo."},
 "Medicamentos y remedios|Plantas":{t:"Si toma remedios de plantas",
  p:["Preguntar el nombre, para qué, cómo la prepara y cada cuánto.","Las que se usan para bajar la regla, purgar o abortar pueden afectar el embarazo: mejor no tomarlas si busca embarazarse.","Si no se sabe su efecto, anotarla y consultarla con medicina."],
  r:"Toma plantas medicinales: se indaga nombre, uso y frecuencia y se orienta sobre las que pueden afectar la gestación."},
 "Medicamentos y remedios|Otro":{t:"Medicamentos que se deben revisar antes del embarazo",
  p:["Revisar con medicina si toma: isotretinoína (para el acné; esperar al menos un mes después de suspenderla), warfarina, metotrexato, medicamentos para el colesterol, tetraciclina o doxiciclina, misoprostol.","Ante la duda con cualquier medicamento, anotarlo y consultarlo antes de buscar el embarazo."],
  r:"Se revisan medicamentos de uso actual y se orienta sobre los que requieren ajuste antes del embarazo."},
 "Cirugías y alergias|Cesárea":{t:"Si tuvo cesárea",
  p:["Esperar al menos 18 meses desde la cesárea antes del próximo embarazo.","El próximo parto debe ser en hospital: el útero con cicatriz tiene riesgo de romperse durante el trabajo de parto.","Anotar cuántas cesáreas ha tenido; con dos o más, el riesgo es mayor.","Esto se tiene en cuenta en el plan de parto desde el inicio del embarazo."],
  r:"Antecedente de cesárea: se orienta intervalo intergenésico mínimo de 18 meses y atención institucional del próximo parto."},
 "Cirugías y alergias|Cirugía en el útero":{t:"Si tuvo cirugía en el útero",
  p:["Remitir a medicina: según la cirugía, el próximo embarazo puede ser de alto riesgo.","El parto debe ser en hospital.","Pedir, si tiene, el papel de la cirugía para saber qué le hicieron."],
  r:"Antecedente de cirugía uterina: se remite a medicina para valoración preconcepcional; se orienta atención institucional del parto."},
 "Cirugías y alergias|Alergia a penicilina":{t:"Si dice ser alérgica a la penicilina",
  p:["Preguntar qué le pasó exactamente: ronchas, hinchazón de la cara, dificultad para respirar o desmayo (alergia verdadera), o solo dolor, fiebre o malestar (no es alergia).","Es importante porque la penicilina benzatínica es el único tratamiento que protege al bebé de la sífilis en el embarazo.","Si es alergia verdadera, anotarlo claro en la historia y en el carné; en caso de sífilis necesitará tratamiento en hospital.","Hacer la prueba de sífilis antes del embarazo."],
  r:"Refiere alergia a penicilina: se caracteriza la reacción, se registra en historia y carné, y se explica su importancia para el tratamiento de sífilis gestacional."},
 "Cirugías y alergias|Alergia a otro medicamento":{t:"Si es alérgica a otro medicamento",
  p:["Preguntar qué reacción tuvo y anotarla.","Registrarla en la historia y en el carné."],
  r:"Se registra alergia medicamentosa y tipo de reacción en historia y carné."},
 "Trombosis|Refiere":{t:"Si tuvo trombosis",
  p:["La Res. 3280 indica que en trombofilia están contraindicados los métodos hormonales: ofrecer DIU de cobre o condón mientras la valora medicina.","Si usa inyección, pastillas o implante, remitir a medicina para definir el cambio de método.","Remitir a medicina antes del embarazo: el embarazo aumenta el riesgo de una nueva trombosis; si toma warfarina, medicina la cambia por heparina antes del embarazo."],
  r:"Antecedente de trombosis: se orienta método no hormonal (DIU de cobre o condón) según Res. 3280 y se remite a medicina para valoración del riesgo trombótico y del método antes del embarazo."},
 "Complicaciones obstétricas previas|Preeclampsia":{t:"Si tuvo preeclampsia",
  p:["Tiene más riesgo de que se repita: el próximo embarazo es de riesgo.","Remitir a medicina antes del embarazo o apenas quede embarazada: la aspirina desde la semana 12 la indica medicina.","Control prenatal antes de la semana 10.","Repasar signos de alarma: dolor de cabeza fuerte, visión borrosa, hinchazón."],
  r:"Antecedente de preeclampsia: se remite a medicina para valoración preconcepcional y del riesgo en la próxima gestación; se orienta control prenatal temprano y signos de alarma."},
 "Complicaciones obstétricas previas|Hemorragia posparto":{t:"Si tuvo hemorragia después del parto",
  p:["El próximo parto debe ser en hospital: dejarlo claro desde ahora en el plan de parto.","Enfermería: solicitar hemograma; si hay anemia, remitir a medicina para tratamiento.","Remitir a medicina para valoración preconcepcional del riesgo."],
  r:"Antecedente de hemorragia posparto: se orienta parto institucional, se solicita hemograma y se remite a medicina para valoración del riesgo."},
 "Complicaciones obstétricas previas|Muerte del bebé":{t:"Si un bebé murió antes o después de nacer",
  p:["Preguntar con cuidado cuándo fue, en qué semana o a los cuántos días, y si sabe la causa.","Reconocer su duelo; preguntar cómo se siente con la idea de un nuevo embarazo.","Remitir a medicina: puede haber causas que se previenen (presión alta, diabetes, sífilis, infecciones).","Si hay tristeza persistente, ofrecer apoyo de psicología."],
  r:"Antecedente de muerte perinatal: se indagan circunstancias, se brinda apoyo emocional y se remite a medicina para valoración preconcepcional."},
 "Complicaciones obstétricas previas|Bebé pequeño":{t:"Si tuvo un bebé de bajo peso",
  p:["Revisar su estado nutricional y alimentación; peso adecuado antes del embarazo.","Respetar el intervalo de 18 meses.","Descartar anemia, infecciones y consumo de tabaco o alcohol.","Si hubo causa médica (presión alta, otra), remitir a medicina."],
  r:"Antecedente de recién nacido de bajo peso: se valora estado nutricional, se orienta intervalo intergenésico y control prenatal temprano."},
 "Complicaciones obstétricas previas|Parto prematuro":{t:"Si tuvo un parto prematuro",
  p:["Tiene más riesgo de que se repita: remitir a medicina para valoración preconcepcional.","Tratar las infecciones urinarias y vaginales antes del embarazo (urocultivo en los exámenes; tratamiento por medicina si sale positivo).","Respetar el intervalo de 18 meses y entrar temprano al control prenatal."],
  r:"Antecedente de parto pretérmino: se remite a medicina para valoración preconcepcional; se orienta intervalo intergenésico y control prenatal temprano."},
 "Complicaciones obstétricas previas|Abortos repetidos":{t:"Si ha tenido abortos repetidos",
  p:["Dos o más pérdidas seguidas ameritan estudio: remitir a medicina.","Iniciar ácido fólico y planificar hasta tener la valoración, si ella lo desea.","Reconocer el duelo y preguntar cómo se siente."],
  r:"Antecedente de pérdidas gestacionales repetidas: se remite a medicina para estudio preconcepcional."},
 "Complicaciones obstétricas previas|Mola":{t:"Si tuvo embarazo molar",
  p:["Preguntar si terminó el seguimiento con las pruebas de sangre (hormona del embarazo) hasta que salieron normales.","No debe embarazarse hasta que medicina dé el alta del seguimiento: mientras tanto, usar un método anticonceptivo.","Si no terminó el seguimiento, remitir a medicina."],
  r:"Antecedente de enfermedad trofoblástica: se verifica seguimiento con hCG, se orienta anticoncepción hasta el alta médica y se remite a medicina."},
 "Grupo sanguíneo y Rh|O-":{t:"Si es Rh negativo",
  p:["Preguntar si ha tenido embarazos, partos o abortos antes y si después le pusieron una inyección (inmunoglobulina anti-D).",
     "Preguntar el grupo y Rh de la pareja: si él también es Rh negativo, no hay riesgo para el bebé por esta causa.",
     "Enfermería: solicitar la hemoclasificación si no hay un resultado confiable.",
     "Remitir a medicina para valorar el riesgo; la inmunoglobulina anti-D y el Coombs indirecto los indica medicina.",
     "Explicarle que en cada embarazo, aborto o sangrado debe avisar que es Rh negativo."],
  r:"Usuaria Rh negativo: se indagan gestaciones previas, aplicación de anti-D y Rh de la pareja; se remite a medicina para valoración del riesgo de aloinmunización."},
 "Grupo sanguíneo y Rh|A-":{t:"Si es Rh negativo",
  p:["Preguntar si ha tenido embarazos, partos o abortos antes y si después le pusieron una inyección (inmunoglobulina anti-D).",
     "Preguntar el grupo y Rh de la pareja: si él también es Rh negativo, no hay riesgo para el bebé por esta causa.",
     "Enfermería: solicitar la hemoclasificación si no hay un resultado confiable.",
     "Remitir a medicina para valorar el riesgo; la inmunoglobulina anti-D y el Coombs indirecto los indica medicina.",
     "Explicarle que en cada embarazo, aborto o sangrado debe avisar que es Rh negativo."],
  r:"Usuaria Rh negativo: se indagan gestaciones previas, aplicación de anti-D y Rh de la pareja; se remite a medicina para valoración del riesgo de aloinmunización."},
 "Grupo sanguíneo y Rh|B-":{t:"Si es Rh negativo",
  p:["Preguntar si ha tenido embarazos, partos o abortos antes y si después le pusieron una inyección (inmunoglobulina anti-D).",
     "Preguntar el grupo y Rh de la pareja: si él también es Rh negativo, no hay riesgo para el bebé por esta causa.",
     "Enfermería: solicitar la hemoclasificación si no hay un resultado confiable.",
     "Remitir a medicina para valorar el riesgo; la inmunoglobulina anti-D y el Coombs indirecto los indica medicina.",
     "Explicarle que en cada embarazo, aborto o sangrado debe avisar que es Rh negativo."],
  r:"Usuaria Rh negativo: se indagan gestaciones previas, aplicación de anti-D y Rh de la pareja; se remite a medicina para valoración del riesgo de aloinmunización."},
 "Grupo sanguíneo y Rh|AB-":{t:"Si es Rh negativo",
  p:["Preguntar si ha tenido embarazos, partos o abortos antes y si después le pusieron una inyección (inmunoglobulina anti-D).",
     "Preguntar el grupo y Rh de la pareja: si él también es Rh negativo, no hay riesgo para el bebé por esta causa.",
     "Enfermería: solicitar la hemoclasificación si no hay un resultado confiable.",
     "Remitir a medicina para valorar el riesgo; la inmunoglobulina anti-D y el Coombs indirecto los indica medicina.",
     "Explicarle que en cada embarazo, aborto o sangrado debe avisar que es Rh negativo."],
  r:"Usuaria Rh negativo: se indagan gestaciones previas, aplicación de anti-D y Rh de la pareja; se remite a medicina para valoración del riesgo de aloinmunización."},
 "Alimentación|Variada":{t:"Alimentos de la región para recomendarle",
  p:["Combinar en cada comida: casabe, fariña, yuca o plátano (energía) + pescado, carne o huevo (proteína) + una fruta o verdura.",
     "Hierro y proteína: pescado (mejor el pequeño), carne de monte, hígado, huevo, fríjol; también mojojoy y bachaco, que se comen en la región y aportan proteína y grasa.",
     "Vitamina A (1 o 2 veces al día): chontaduro, moriche o canangucha, ahuyama, plátano maduro, mango, papaya, zapote, huevo.",
     "Ácido fólico: hojas verdes bien cocinadas, fríjol, aguacate, naranja e hígado. Aun así, el ácido fólico en tableta es necesario.",
     "Vitamina C, que ayuda a aprovechar el hierro: arazá, camu camu, copoazú, guayaba, naranja, limón, piña. Mejor junto con la comida que tiene hierro.",
     "Calcio y vitamina D: pescado pequeño comido con espinas (ahumado o molido), huevo, leche o queso si hay; tomar sol.",
     "Grasas buenas: asaí o manaca, seje (milpesos), aguacate, maní.",
     "Evitar: alcohol y chicha fuerte, gaseosas y mucha azúcar, carne poco cocida (toxoplasma); lavar bien frutas y verduras. Donde hay minería, preferir pescado pequeño a los bagres grandes."],
  r:"Se brinda educación alimentaria con alimentos de la región: combinación de energía, proteína (pescado, carne de monte, huevo, fríjol, mojojoy, bachaco) y frutas; fuentes de vitamina A (chontaduro, moriche, ahuyama, plátano maduro, mango), hierro con vitamina C (arazá, camu camu, guayaba), ácido fólico, calcio y grasas saludables (asaí, seje, aguacate); se recomienda evitar alcohol, exceso de azúcar y carne mal cocida."},
 "Alimentación|Poco variada":{t:"Alimentos de la región para recomendarle",
  p:["Combinar en cada comida: casabe, fariña, yuca o plátano (energía) + pescado, carne o huevo (proteína) + una fruta o verdura.",
     "Hierro y proteína: pescado (mejor el pequeño), carne de monte, hígado, huevo, fríjol; también mojojoy y bachaco, que se comen en la región y aportan proteína y grasa.",
     "Vitamina A (1 o 2 veces al día): chontaduro, moriche o canangucha, ahuyama, plátano maduro, mango, papaya, zapote, huevo.",
     "Ácido fólico: hojas verdes bien cocinadas, fríjol, aguacate, naranja e hígado. Aun así, el ácido fólico en tableta es necesario.",
     "Vitamina C, que ayuda a aprovechar el hierro: arazá, camu camu, copoazú, guayaba, naranja, limón, piña. Mejor junto con la comida que tiene hierro.",
     "Calcio y vitamina D: pescado pequeño comido con espinas (ahumado o molido), huevo, leche o queso si hay; tomar sol.",
     "Grasas buenas: asaí o manaca, seje (milpesos), aguacate, maní.",
     "Evitar: alcohol y chicha fuerte, gaseosas y mucha azúcar, carne poco cocida (toxoplasma); lavar bien frutas y verduras. Donde hay minería, preferir pescado pequeño a los bagres grandes."],
  r:"Se brinda educación alimentaria con alimentos de la región: combinación de energía, proteína (pescado, carne de monte, huevo, fríjol, mojojoy, bachaco) y frutas; fuentes de vitamina A (chontaduro, moriche, ahuyama, plátano maduro, mango), hierro con vitamina C (arazá, camu camu, guayaba), ácido fólico, calcio y grasas saludables (asaí, seje, aguacate); se recomienda evitar alcohol, exceso de azúcar y carne mal cocida."},

     "Calcio y vitamina D: pescado pequeño comido con espinas (ahumado o molido), huevo, leche o queso si hay; tomar sol.",

  r:"Se brinda educación alimentaria con alimentos de la región: combinación de energía, proteína (pescado, carne de monte, huevo, fríjol, mojojoy, bachaco) y frutas; fuentes de vitamina A (chontaduro, moriche, ahuyama, plátano maduro, mango), hierro con vitamina C (arazá, camu camu, guayaba), ácido fólico, calcio y grasas saludables (asaí, seje, aguacate); se recomienda evitar alcohol, exceso de azúcar y carne mal cocida."},
 "Tabaco, alcohol y sustancias|Chicha ocasional":{t:"Para responderle: si toma chicha",
  p:["Reconocer que la chicha hace parte de la cultura y de las celebraciones (dabucurí, fiestas); no juzgar.",
     "Explicar la diferencia: la chicha dulce o recién hecha y la manicuera no tienen alcohol; la chicha fermentada (la de varios días, la fuerte) sí lo tiene, como cualquier licor.",
     "Si está buscando embarazo, es mejor dejar la chicha fermentada desde ya: puede quedar embarazada sin saberlo, y en las primeras semanas el alcohol puede dañar el desarrollo del bebé. No hay una cantidad segura.",
     "Puede seguir compartiendo en las fiestas con chicha dulce, manicuera, jugo de asaí o de frutas.",
     "Preguntarle si cree que puede hacerlo y qué le ayudaría (por ejemplo, contarle a la pareja o a la familia para que la apoyen).",
     "Felicitarla por lo que ya hace bien y acordar revisarlo en el próximo control."],
  r:"Consumo ocasional de chicha fermentada: se realiza intervención breve con enfoque intercultural; se explica que no existe cantidad segura de alcohol al buscar o durante la gestación, se diferencia chicha fermentada de chicha dulce y manicuera, y se acuerda suspender el consumo de bebidas fermentadas."},
 "Tabaco, alcohol y sustancias|Chicha frecuente":{t:"Para responderle: si toma chicha o licor con frecuencia",
  p:["Hacer la intervención breve con respeto: preguntar cuánto toma, cada cuánto y si alguna vez se emborracha.",
     "Explicar el riesgo: el alcohol en el embarazo puede causar aborto, bajo peso y daño permanente en el desarrollo del bebé; tampoco hay cantidad segura antes de saber que está embarazada.",
     "Preguntar qué tan dispuesta está a dejarlo y acordar una meta concreta (dejar la chicha fermentada y el licor).",
     "Preguntar con tacto si en la casa hay peleas o violencia cuando se toma, y si la pareja también toma.",
     "Si no logra dejarlo o hay dependencia: remitir a medicina y a la ruta de salud mental y consumo de sustancias.",
     "Acordar control cercano para ver cómo le va."],
  r:"Consumo frecuente de alcohol: se realiza intervención breve, se explican los riesgos del alcohol en la gestación, se acuerda meta de suspensión, se indaga violencia asociada y se remite a medicina y ruta de salud mental y consumo de sustancias psicoactivas."},
 "Tabaco, alcohol y sustancias|Tabaco o mambe":{t:"Para responderle: si usa tabaco, rapé o mambe",
  p:["Reconocer el uso tradicional y ritual, sin juzgar.",
     "Explicar que la nicotina del tabaco y del rapé, y las sustancias de la hoja de coca del mambe, pasan al bebé: aumentan el riesgo de bajo peso, parto prematuro y aborto.",
     "Recomendar dejarlo desde que busca el embarazo; si es ritual, conversar con ella (y si quiere con el sabedor) cómo participar sin consumir.",
     "Evitar también el humo de otros fumadores y del fogón dentro de la casa."],
  r:"Consumo de tabaco, rapé o mambe: se realiza intervención breve con enfoque intercultural y se recomienda suspenderlo antes de la gestación."},
 "Tabaco, alcohol y sustancias|Otra sustancia":{t:"Para responderle: otras sustancias",
  p:["Preguntar cuál, cuánto y cada cuánto, sin juzgar.",
     "Explicar los riesgos para el embarazo y recomendar suspenderla antes de buscarlo.",
     "Remitir a medicina y a la ruta de salud mental y consumo de sustancias psicoactivas.",
     "Mientras tanto, asegurar un método anticonceptivo."],
  r:"Consumo de sustancias psicoactivas: se realiza intervención breve y se remite a medicina y a la ruta de salud mental y consumo de sustancias psicoactivas."},
 "Actividad física, sueño y estrés|Adecuado":{t:"Parámetros de actividad física y sueño",
  p:["Meta (OMS): al menos 150 minutos a la semana de actividad moderada, por ejemplo 30 minutos, 5 días. O 75 minutos de actividad intensa.",
     "Moderada es la que acelera la respiración pero deja hablar; intensa es la que no deja hablar seguido.",
     "Cuentan las labores diarias: trabajar la chagra, caminar al conuco, remar, cargar leña o agua, pescar, bailar.",
     "Ejercicios de fuerza 2 días a la semana (cargar, agacharse y pararse, subir pendientes).",
     "Evitar pasar muchas horas sentada; levantarse y moverse cada rato.",
     "Sueño: entre 7 y 9 horas por noche.",
     "Peso ideal para embarazarse: IMC menor de 25 (Res. 3280); la actividad física ayuda a lograrlo.",
     "Si siente dolor en el pecho, mareo o falta de aire anormal al hacer esfuerzo: parar y consultar."],
  r:"Se brinda educación en actividad física (meta de 150 minutos semanales de intensidad moderada, ejercicios de fuerza 2 días a la semana, reducir sedentarismo) y en higiene del sueño (7 a 9 horas)."},
 "Actividad física, sueño y estrés|Poca actividad":{t:"Parámetros de actividad física y sueño",
  p:["Meta (OMS): al menos 150 minutos a la semana de actividad moderada, por ejemplo 30 minutos, 5 días. O 75 minutos de actividad intensa.",
     "Moderada es la que acelera la respiración pero deja hablar; intensa es la que no deja hablar seguido.",
     "Cuentan las labores diarias: trabajar la chagra, caminar al conuco, remar, cargar leña o agua, pescar, bailar.",
     "Ejercicios de fuerza 2 días a la semana (cargar, agacharse y pararse, subir pendientes).",
     "Evitar pasar muchas horas sentada; levantarse y moverse cada rato.",
     "Sueño: entre 7 y 9 horas por noche.",
     "Peso ideal para embarazarse: IMC menor de 25 (Res. 3280); la actividad física ayuda a lograrlo.",
     "Si siente dolor en el pecho, mareo o falta de aire anormal al hacer esfuerzo: parar y consultar."],
  r:"Se brinda educación en actividad física (meta de 150 minutos semanales de intensidad moderada, ejercicios de fuerza 2 días a la semana, reducir sedentarismo) y en higiene del sueño (7 a 9 horas)."},
 "Actividad física, sueño y estrés|Duerme mal":{t:"Para responderle: si refiere estrés o duerme mal",
  p:["Escuchar qué le preocupa: trabajo, dinero, pareja, familia, salud.",
     "Higiene del sueño: horario fijo para dormir y levantarse, evitar café o bebidas con cafeína en la tarde, evitar el celular antes de dormir, buscar un lugar oscuro y tranquilo.",
     "Para el estrés: respirar lento varias veces, caminar, hablar con alguien de confianza, apoyarse en la familia, la comunidad o el sabedor.",
     "Si el estrés o el mal dormir le impiden hacer sus cosas, o si las preguntas de depresión salen positivas: remitir a psicología o a la ruta de salud mental."],
  r:"Refiere estrés o alteración del sueño: se indagan causas, se brindan recomendaciones de higiene del sueño y manejo del estrés, y se orienta sobre consulta a psicología si persiste o interfiere con sus actividades."},
 "Actividad física, sueño y estrés|Estrés":{t:"Para responderle: si refiere estrés o duerme mal",
  p:["Escuchar qué le preocupa: trabajo, dinero, pareja, familia, salud.",
     "Higiene del sueño: horario fijo para dormir y levantarse, evitar café o bebidas con cafeína en la tarde, evitar el celular antes de dormir, buscar un lugar oscuro y tranquilo.",
     "Para el estrés: respirar lento varias veces, caminar, hablar con alguien de confianza, apoyarse en la familia, la comunidad o el sabedor.",
     "Si el estrés o el mal dormir le impiden hacer sus cosas, o si las preguntas de depresión salen positivas: remitir a psicología o a la ruta de salud mental."],
  r:"Refiere estrés o alteración del sueño: se indagan causas, se brindan recomendaciones de higiene del sueño y manejo del estrés, y se orienta sobre consulta a psicología si persiste o interfiere con sus actividades."},
 "Violencias|Sí":{t:"Ruta de atención a víctimas de violencias: lo esencial",
  p:["1. Escuchar a solas, creerle y decirle que no es su culpa. No juzgar ni presionar.",
     "2. Seguridad primero: ¿está en peligro ahora?, ¿el agresor vive con ella?, ¿tiene a dónde ir y a quién avisar? Armar con ella un plan de seguridad.",
     "3. Tipo y tiempo: física, psicológica, sexual o económica; quién, desde cuándo, la última vez. Registrarlo con sus palabras.",
     "4. Si hubo violencia sexual en las últimas 72 horas, es una URGENCIA: ver la guía de violencia sexual.",
     "5. Lesiones o riesgo: remitir a medicina; la atención es prioritaria y gratuita.",
     "6. Notificar a SIVIGILA (evento 875, violencia de género e intrafamiliar): es obligatorio.",
     "7. Ruta intersectorial: informar a la Comisaría de Familia (medidas de protección, Ley 1257 de 2008). La denuncia ante Policía o Fiscalía es decisión de ella; no es requisito para atenderla.",
     "8. Si es menor de 18 años: informar al ICBF y a las autoridades es obligatorio. En menores de 14, toda relación sexual es delito.",
     "9. Autoridad tradicional: si ella lo desea, puede acudir también a la justicia propia del resguardo, sin que esto reemplace su protección.",
     "10. Salud mental: primeros auxilios psicológicos y remisión a psicología.",
     "11. Líneas: 155 (orientación a mujeres), 141 (ICBF), 123 (emergencias).",
     "12. Seguimiento cercano: acordar cómo y cuándo volver a verla."],
  r:"Usuaria refiere violencia: se brinda escucha sin juicio y primeros auxilios psicológicos, se valora riesgo y se elabora plan de seguridad, se notifica a SIVIGILA (evento 875), se informa a la Comisaría de Familia y sobre su derecho a denunciar y a medidas de protección (Ley 1257 de 2008), se remite a medicina y psicología, y se acuerda seguimiento."},
 "Violencias|Sexual en las últimas 72 h":{t:"Violencia sexual reciente: URGENCIA",
  p:["Remitir de inmediato a medicina o al servicio de urgencias, el mismo día: la atención es gratuita, prioritaria y no requiere denuncia.",
     "Dentro de las primeras 72 horas se pueden dar: profilaxis contra VIH, anticoncepción de emergencia, profilaxis de otras infecciones y vacuna de hepatitis B. Las indica medicina; entre más rápido, mejor.",
     "Si ella quiere denunciar: no bañarse ni cambiarse, guardar la ropa en bolsa de papel, para conservar las pruebas. La denuncia no es requisito para atenderla.",
     "Informarle su derecho a la IVE por esta causal, en cualquier momento del embarazo, si llegara a quedar embarazada.",
     "Notificar a SIVIGILA (evento 875) y avisar a las autoridades; si es menor de 18 años, también al ICBF.",
     "No dejarla sola: acompañarla o asegurar quién la acompaña en el traslado."],
  r:"Violencia sexual en las últimas 72 horas: se activa atención de urgencia, se remite de inmediato a medicina para profilaxis (VIH, anticoncepción de emergencia, ITS, hepatitis B), se orienta preservación de evidencia y derecho a la IVE, se notifica a SIVIGILA y se informa a las autoridades."},
 "Violencias|En peligro ahora":{t:"Riesgo inminente: protección inmediata",
  p:["No dejarla ir sola a la casa si el agresor está allí y hay amenaza.",
     "Buscar con ella un lugar seguro (familia, vecinos, puesto de salud) y avisar al 123 o a la Policía si hay peligro para su vida.",
     "Informar a la Comisaría de Familia para medidas de protección urgentes.",
     "Notificar a SIVIGILA y dejar registro claro en la historia.",
     "Acordar una forma segura de comunicarse con ella."],
  r:"Riesgo inminente por violencia: se activa ruta de protección, se busca lugar seguro, se informa a Comisaría de Familia y autoridades, se notifica a SIVIGILA y se acuerda canal de comunicación seguro."},
 "Valoración ginecológica|No: sin insumos":{t:"Si no puedes hacer la especuloscopia",
  p:["La Res. 3280 (4.1.6.2) la incluye en la consulta: si no se puede hacer, no se omite en silencio.",
     "Registrar el motivo (sin especuloscopio, sin privacidad, sin luz adecuada o no acepta).",
     "Programarla: en la próxima brigada, en la visita del equipo con insumos o por remisión a un punto que la tenga. Anotar la fecha o el compromiso.",
     "Mientras tanto, preguntar por síntomas que sí obligan a remitir pronto: sangrado después de las relaciones, sangrado entre reglas, flujo con mal olor, dolor pélvico, masas.",
     "Informar a tu coordinación la falta del insumo: la adaptación de la ruta en zonas dispersas la definen la Dirección Territorial, la EAPB y el prestador (Res. 3280, 7.1, p. 94 a 97)."],
  r:"Se registra el motivo por el cual no se realiza la valoración ginecológica, se indagan síntomas ginecológicos de alarma y se programa la valoración."},
 
 "Exámenes solicitados|Pendiente de toma":{t:"Exámenes obligatorios cuando no hay laboratorio",
  p:["La Res. 3280 (4.1.6.3, p. 247) dice que se deben solicitar y leer: se ordenan todos, aunque hoy no se puedan tomar.",
     "Haz hoy lo que tengas en el puesto: pruebas rápidas de VIH y sífilis (con asesoría) y gota gruesa si hay microscopista.",
     "Lo demás queda ordenado y se toma en la próxima brigada o en un traslado; anotar dónde y cuándo.",
     "Registrar en la nota cuáles se hicieron, cuáles quedan pendientes y por qué.",
     "En el control se leen los resultados (la Res. 3280 pide al menos un control para eso)."],
  r:"Se ordenan los exámenes preconcepcionales según Res. 3280; se realizan las pruebas disponibles en el puesto y los demás quedan pendientes de toma, con fecha programada."},
 "Información brindada|Planeación y espaciamiento":{t:"Qué decirle: planeación y espaciamiento",p:["Ella decide cuándo y cuántos hijos tener, sin presión de nadie.","Lo más sano es esperar al menos 18 meses entre un parto y el siguiente embarazo: la mamá recupera fuerzas y el bebé nace con mejor peso.","Mientras decide, puede planificar con el método que prefiera."],r:"Se informa sobre planeación de la familia y espaciamiento de los hijos (mínimo 18 meses)."},
 "Información brindada|Nutrición":{t:"Qué decirle: nutrición",p:["Comer variado en cada comida: casabe o yuca + pescado, carne o huevo + fruta o verdura.","Frutas y verduras amarillas (chontaduro, moriche, ahuyama, mango) y hojas verdes.","Seguir el ácido fólico todos los días."],r:"Se brindan recomendaciones nutricionales."},
 "Información brindada|Vacunas":{t:"Qué decirle: vacunas",p:["Las vacunas deben quedar completas al menos 3 meses antes del embarazo.","Algunas, como la triple viral, no se ponen durante el embarazo: por eso se completan antes."],r:"Se informa sobre la importancia de completar el esquema de vacunación antes del embarazo."},
 "Información brindada|Control prenatal temprano":{t:"Qué decirle: control prenatal temprano",p:["Apenas le falte la regla o sospeche que está embarazada, venir al puesto de salud.","Lo ideal es empezar el control antes de la semana 10 (antes de 2 meses y medio)."],r:"Se recomienda control prenatal antes de la semana 10."},
 "Información brindada|Riesgo cardiometabólico":{t:"Qué decirle: presión, azúcar y peso",p:["La presión alta, el azúcar alto y el sobrepeso aumentan los riesgos en el embarazo.","Por eso se revisan antes: tomar la presión, hacer la glicemia y cuidar el peso."],r:"Se informa sobre detección de factores de riesgo cardiometabólicos."},
 "Información brindada|Derechos e IVE":{t:"Qué decirle: derechos e IVE",p:["Tiene derecho a decidir libremente si quiere tener hijos, cuántos y cuándo, sin violencia ni presión.","Tiene derecho a recibir métodos para planificar.","Si queda embarazada sin quererlo, tiene derecho a la interrupción voluntaria del embarazo: hasta la semana 24 por su sola decisión; después, por las causales de la ley. Es confidencial."],r:"Se informa sobre derechos sexuales y reproductivos y el derecho a la IVE."},
 "Información brindada|Riesgo por edad":{t:"Qué decirle: riesgo por la edad",p:["Úsalo sobre todo si tiene 35 años o más.","Con la edad aumenta la probabilidad de que el bebé tenga alteraciones en los cromosomas (como el síndrome de Down).","En el embarazo hay exámenes (como la ecografía de las semanas 11 a 14) que ayudan a detectarlo; los ordena el control prenatal."],r:"Se informa sobre riesgo de cromosomopatías asociado a la edad y opciones de tamizaje en la gestación."},
 "Información brindada|Signos de alarma":{t:"Qué decirle: cuándo volver de inmediato",p:["Si queda embarazada: sangrado, salida de líquido, dolor de cabeza fuerte o ver lucecitas, hinchazón de cara y manos, fiebre, dolor fuerte de barriga.","Ahora: cualquier síntoma nuevo o que le preocupe."],r:"Se explican signos de alarma."},
 "Deseo de embarazo|No":{t:"La consulta pasa a asesoría anticonceptiva",
  p:["Respetar su decisión: la consulta se enfoca en planificación familiar y se omite la formulación de ácido fólico.",
     "Preguntar qué métodos conoce o ha usado, cómo le fue y cuál prefiere. La decisión es de ella; no necesita permiso de la pareja.",
     "Opciones: implante (3 a 5 años según el tipo) y DIU (hasta 10 años) son los más efectivos; luego la inyección trimestral o mensual y las pastillas; el condón.",
     "El condón además protege de infecciones de transmisión sexual: lo ideal es usarlo junto con otro método.",
     "Puede cambiar o retirar el método cuando quiera; si después desea un embarazo, vuelve a la consulta preconcepcional.",
     "Si tuvo relaciones sin protección en los últimos días, ofrecer anticoncepción de emergencia (mejor en las primeras 72 horas)."],
  r:"No desea embarazo: se brinda asesoría en anticoncepción (opciones disponibles, eficacia, doble protección con condón, derecho a elegir y cambiar de método, anticoncepción de emergencia)."},
 "Deseo de embarazo|Solo ella":{t:"Para responderle: si la pareja no ha decidido",
  p:["La decisión sobre su cuerpo es de ella; respetarla.",
     "Si ella quiere, invitar a la pareja a la próxima consulta para hablar del embarazo, de su salud (pruebas de infecciones, vacunas) y del apoyo que ella necesitará.",
     "Preguntar con tacto si se siente presionada para embarazarse o para no hacerlo, o si hay conflictos en casa por este tema."],
  r:"Se invita a vincular a la pareja en la próxima consulta, respetando la decisión de la usuaria; se indaga presión o conflicto relacionado con la reproducción."},
 "Deseo de embarazo|No sabe":{t:"Para responderle: si aún no ha decidido",
  p:["Es normal no estar segura; no tiene que decidir hoy.",
     "Mientras decide, seguir planificando con el método que prefiera.",
     "Si cree que lo querrá en el próximo año, puede empezar ya el ácido fólico: no le hace daño.",
     "Cuando decida, puede volver a esta consulta."],
  r:"Usuaria indecisa frente al embarazo: se orienta continuar anticoncepción hasta decidir y se ofrece retomar la consulta preconcepcional cuando lo desee."},
 "Método anticonceptivo actual|Ninguno":{t:"Para responderle: sin método",
  p:["Si quiere embarazarse: lo ideal es prepararse primero (ácido fólico 3 meses antes, vacunas, exámenes).",
     "Si no quiere embarazarse aún: ofrecer un método hoy mismo.",
     "Recordar el condón para prevenir infecciones de transmisión sexual."],
  r:"Sin método anticonceptivo: se orienta sobre preparación preconcepcional y se ofrece anticoncepción mientras decide."},
 "Método anticonceptivo actual|Inyectable mensual":{t:"Para responderle: inyección mensual",
  p:["Cuando decida buscar el embarazo, simplemente no se pone la siguiente inyección.",
     "La fertilidad vuelve en pocos meses (casi siempre de 1 a 3).",
     "Lo ideal es seguir con la inyección hasta completar 3 meses de ácido fólico."],
  r:"Se orienta sobre suspensión del inyectable mensual y retorno de la fertilidad en 1 a 3 meses."},
 "Método anticonceptivo actual|Inyectable trimestral":{t:"Para responderle: inyección de cada 3 meses",
  p:["Cuando decida buscar el embarazo, no se pone la siguiente inyección.",
     "Con este método la fertilidad tarda más en volver: en promedio unos 10 meses desde la última inyección, a veces hasta un año o más. Es esperado y no daña la fertilidad.",

  const p=nv(v.peso);let ta=nv(v.talla);if(ta&&ta>3)ta=ta/100;let imc=null,cat="";

    if(ini){const meta=metaGanancia(ini);r.m.ppre="IMC inicial "+coma(ini)+": meta de ganancia "+meta;if(ini<20)r.al.push("IMC inicial menor de 20: meta de ganancia de 12 a 18 kg; valoración por nutrición.");else if(ini>=30)r.al.push("IMC inicial de 30 o más: meta de ganancia de 6 a 7 kg; valoración por nutrición."+(ini>=35?" IMC ≥ 35 es criterio moderado de preeclampsia.":""))}

 "rn::Profilaxis umbilical: ligadura y clorhexidina o yodopovidona":{c:["Clorhexidina|Ligadura del muñón umbilical sin atrapar piel y limpieza con clorhexidina; se retira el exceso.","Yodopovidona|Ligadura del muñón umbilical sin atrapar piel y limpieza con yodopovidona; se retira el exceso."],
  pauta:{t:"Cómo hacerlo (p. 302-303)",p:["Entre los 60 y 90 minutos, a la vista de la mamá.","Ligadura con liga de caucho o equivalente, solo en el muñón, sin atrapar la piel.","Limpia el muñón con clorhexidina o yodopovidona y retira lo que caiga en la piel.","En casa: mantenerlo limpio y seco, sin fajero, botones ni ningún remedio encima."],r:"",b:""}},
 "rn::Profilaxis ocular: povidona yodada 2,5–5 %, 1 gota en cada ojo":{c:["Povidona yodada|Profilaxis ocular con povidona yodada oftálmica, 1 gota en cada ojo, dosis única.","Eritromicina|Profilaxis ocular con eritromicina oftálmica 0,5 % en cada ojo, dosis única.","Tetraciclina|Profilaxis ocular con tetraciclina oftálmica 1 % en cada ojo, dosis única."],
  pauta:{t:"Qué usar (p. 303)",p:["Povidona yodada oftálmica 2,5 % o 5 %: 1 gota en cada ojo, una sola vez.","Si no hay: eritromicina 0,5 %, tetraciclina 1 % o nitrato de plata 1 % (este irrita)."],r:"",b:""}},
 "rn::Vitamina K 1 mg IM en el muslo (0,5 mg si pesa < 1.500 g)":{c:["1 mg IM|Se aplica vitamina K 1 mg IM en cara anterolateral del muslo, dosis única.","0,5 mg IM|Se aplica vitamina K 0,5 mg IM en el muslo (peso menor de 1.500 g).","Oral|Se administra vitamina K oral equivalente (presentación disponible)."],
  pauta:{t:"Cómo aplicarla (p. 303)",p:["1 mg intramuscular en la parte de adelante y afuera del muslo, una sola vez.","0,5 mg si pesa menos de 1.500 g.","Previene la enfermedad hemorrágica del recién nacido."],r:"",b:""}},
 "rn::Examen físico inicial: permeabilidad esofágica y anal, temperatura":{c:["Normal|Examen físico inicial normal: esófago y ano permeables, sin anomalías congénitas visibles, temperatura dentro de lo normal.","Temperatura alterada|Temperatura fuera de 36,5 a 37,5 °C: señal de peligro; se corrige y se vigila.","Anomalía congénita|Se evidencia anomalía congénita; se notifica y se remite."],
  pauta:{t:"Qué revisar (p. 303)",p:["Esófago permeable: pasa la sonda sin resistencia y sin salivación excesiva.","Ano permeable: orificio en su sitio; vigila que bote meconio.","Temperatura de 36,5 a 37,5 °C. Fuera de ese rango es señal de peligro.","Sexo, paladar, extremidades, columna y defectos visibles.","Toda anomalía congénita se notifica (evento de interés en salud pública)."],r:"",b:""}},
 "rn::Antropometría":{campos:"antropoRN",c:[],
  pauta:{t:"Qué medir (p. 303)",p:["Peso, talla, perímetro cefálico y perímetro torácico.","La app compara con los patrones de la OMS al nacer (Res. 2465 de 2016) según el sexo: z entre −1 y +1 es lo esperado; menos de −2 o más de +2 se remite.","Solo vale para bebés a término (37 a 41 semanas); los prematuros se grafican en curvas de Fenton o INTERGROWTH.","Si las medidas no corresponden con la edad gestacional, anticipa riesgos (hipoglicemia, hipotermia)."],r:"",b:""}},
 "rn::Signos vitales cada 6 horas":{campos:"vitalesRN",c:[],
  pauta:{t:"Qué es normal en el recién nacido",p:["Temperatura 36,5 a 37,5 °C (p. 303).","Frecuencia cardiaca 120 a 160 por minuto (puede bajar a 100 dormido).","Respiración 40 a 60 por minuto, sin hundir el pecho ni quejarse.","Saturación de 95 % o más.","Cada 6 horas mientras esté contigo (p. 305)."],r:"",b:""}},
 "rn::Tamizaje de cardiopatía: pulsioximetría pre y postductal a las 24 h":{widget:"pulsox",c:[],
  pauta:{t:"Cómo hacerlo (p. 305)",p:["A las 24 horas de nacido (y a las 48 si sigue contigo).","Preductal: mano derecha. Postductal: cualquier pie.","Anormal: diferencia de más de 3 % entre las dos o cualquiera menor de 90 %.","Anormal: remitir a pediatría o cardiología pediátrica."],r:"",b:""}},
 "rn::TA en las 4 extremidades":{c:["Normal|TA en las cuatro extremidades sin diferencia significativa entre miembros superiores e inferiores.","Alterada|TA mayor en brazos que en piernas: sospecha de coartación aórtica; se remite a pediatría."],
  pauta:{t:"Para qué (p. 305)",p:["Busca coartación de aorta: la TA en los brazos es mayor que en las piernas.","Si no tienes brazalete neonatal, anótalo como pendiente y que se haga en el control."],r:"",b:""}},
 "rn::Tamizaje visual: reflejo rojo":{c:["Normal|Reflejo rojo presente y simétrico en ambos ojos.","Alterado|Reflejo rojo ausente, blanco o asimétrico; se remite a pediatría.","Pendiente|Tamizaje visual pendiente; se programa en el control."],
  pauta:{t:"Cómo hacerlo (p. 305)",p:["En un lugar oscuro, con el oftalmoscopio a unos 30 cm, mira los dos ojos a la vez.","Normal: brillo rojo-naranja igual en ambos.","Blanco, ausente o distinto: remitir (catarata o retinoblastoma)."],r:"",b:""}},
 "rn::Tamizaje auditivo":{c:["Pasa|Tamizaje auditivo realizado: pasa en ambos oídos.","No pasa|Tamizaje auditivo realizado: no pasa; se remite para confirmación diagnóstica.","Sin equipo: pendiente|No se cuenta con equipo de tamizaje auditivo (emisiones otoacústicas o RATEA) en el puesto. Sin factores de riesgo auditivo. Responde al sonido (sobresalto o parpadeo), observación que no reemplaza el tamizaje. Queda pendiente para la ruta de primera infancia; se orienta a la familia.","Sin equipo, con riesgo: remitir|No se cuenta con equipo de tamizaje auditivo en el puesto. Tiene factores de riesgo de pérdida auditiva; se gestiona remisión prioritaria para emisiones otoacústicas y RATEA."],
  pauta:{t:"Si no tienes el equipo (p. 305)",p:["No lo omitas en la historia: la norma lo hace obligatorio, pero si no se pudo en la primera semana se hace en la ruta de primera infancia. Déjalo como pendiente: la app lo guarda en la ficha.","Pregunta los factores de riesgo: sordera en la familia, prematuro o menos de 1.500 g, Apgar bajo, ictericia que necesitó tratamiento, infección en el embarazo (rubéola, toxoplasma, sífilis, citomegalovirus, zika), malformaciones de cara u oídos, antibióticos como gentamicina, más de 5 días en UCI.","Con algún factor de riesgo: remisión prioritaria; no esperes a la ruta.","Lo que sí puedes hacer: con el bebé tranquilo, aplaude o haz un ruido fuerte a unos 30 cm, fuera de su vista. Debe parpadear, sobresaltarse o despertarse. Esto solo orienta: un bebé que responde puede tener pérdida auditiva, así que no reemplaza el tamizaje.","Enséñale a la familia: a los 3 meses se calma o voltea con la voz de la mamá; a los 6 meses busca de dónde viene el sonido. Si no lo hace, que consulte."],r:"",b:""}}, "rn::TSH neonatal":{c:["Tomada de cordón|Se toma TSH neonatal de sangre de cordón (técnica de asa).","Tomada periférica|Se toma TSH neonatal por vena periférica.","Pendiente|TSH neonatal pendiente; se gestiona la toma."],
  pauta:{t:"Cómo tomarla (p. 303 y 306)",p:[CORDON_ASA,"La misma muestra sirve para la hemoclasificación del bebé y otros exámenes según los antecedentes de la mamá (por ejemplo, gota gruesa).","Dile a la familia que debe reclamar el resultado: el hipotiroidismo no tratado afecta el desarrollo."],r:"",b:""}},
 "rn::Vacunas BCG y hepatitis B":{c:["Aplicadas|Se aplican BCG y hepatitis B del recién nacido; se registran en el carné.","Pendiente BCG|Se aplica hepatitis B; BCG pendiente, se programa.","Madre con hepatitis B|Hijo de madre HBsAg positiva: vacuna de hepatitis B y gammaglobulina en las primeras 12 horas; se remite a pediatría."],
  pauta:{t:"Qué saber (p. 305)",p:["BCG antes del egreso, según el PAI.","Hepatitis B en las primeras horas de vida.","Si la mamá tiene hepatitis B: atención por pediatría (vacuna y gammaglobulina en las primeras 12 horas).","Anota todo en el carné de salud infantil."],r:"",b:""}},
 "rn::Hemoclasificación del RN; anti-D a la madre si aplica":{c:["Tomada|Se toma hemoclasificación del recién nacido de sangre de cordón (técnica de asa).","Madre Rh negativo|Madre Rh negativo: hemoclasificación y Coombs directo del recién nacido; si es Rh positivo, anti-D a la madre antes de 72 horas.","Pendiente|Hemoclasificación del recién nacido pendiente."],
  pauta:{t:"Cómo y para qué",p:[CORDON_ASA,"Si la mamá es Rh negativo y el bebé Rh positivo, la mamá necesita anti-D antes de 72 horas (p. 288).","Coombs directo positivo: vigilar ictericia y remitir a pediatría."],r:"",b:""}},
 "rn::Resultados maternos de VIH, sífilis, toxoplasma, hepatitis B, estreptococo B":{c:["Negativos|Resultados maternos de VIH, sífilis, toxoplasma, hepatitis B y estreptococo B negativos.","VIH positivo|Madre con VIH: no lactancia materna, fórmula, profilaxis y remisión inmediata a pediatría.","Sífilis positiva|Madre con sífilis gestacional: VDRL en sangre periférica del recién nacido y valoración por pediatría.","Hepatitis B positiva|Madre HBsAg positiva: vacuna y gammaglobulina en 12 horas; pediatría.","Sin resultados|Sin resultados maternos; se realizan pruebas rápidas a la madre."],
  pauta:{t:"Qué hacer con cada uno (p. 305 y 307)",p:["Son requisito para el egreso: deben conocerse antes de que el bebé se vaya.","VIH: no pecho, fórmula, profilaxis y remisión.","Sífilis: VDRL del bebé en sangre periférica (no de cordón) y pediatría.","Hepatitis B: vacuna y gammaglobulina en las primeras 12 horas.","Toxoplasma IgM positiva: pediatría.","Estreptococo B positivo sin antibiótico en el parto: vigilarlo 48 horas."],r:"",b:""}},
 "rn::¿Cómo y cada cuánto mama? ¿Se pega bien?":{c:["Adecuada|Lactancia materna exclusiva a libre demanda, 8 a 12 veces al día, con buen agarre.","Mama poco|Mama menos de 8 veces al día o se duerme al pecho; se observa una toma y se corrige.","Dolor al lactar|La madre refiere dolor o grietas; se corrige el agarre.","Otros líquidos|Recibe agua, aguas aromáticas o fórmula además del pecho; se educa en lactancia exclusiva."],
  pauta:{t:"Qué buscar",p:["Mama de 8 a 12 veces en 24 horas, de día y de noche.","Se oye tragar y queda tranquilo después.","Si la mamá siente dolor, el agarre está mal.","Nada de agua, aguas aromáticas, panela ni fórmula."],r:"",b:""}},
 "rn::Orina y deposiciones":{c:["Normal|Orina 6 o más veces al día; deposiciones de transición, amarillas.","Poca orina|Orina menos de 6 veces al día o muy concentrada; se valora lactancia y deshidratación.","Sin meconio|No ha eliminado meconio; se remite a medicina.","Deposiciones con sangre|Deposiciones con sangre o blancas; se remite."],
  pauta:{t:"Qué es normal",p:["Meconio (negro) en las primeras 24 a 48 horas; si no ha salido, remitir.","Día 3 a 5: deposiciones verdosas que se vuelven amarillas.","Desde el día 5: 6 o más pañales mojados al día.","Deposiciones blancas (acolia) o con sangre: remitir."],r:"",b:""}},
 "rn::Color amarillo de la piel, fiebre, frialdad":{c:["Niega|Sin ictericia, fiebre ni frialdad.","Ictericia|Refiere color amarillo de la piel; se valora extensión y momento de aparición.","Fiebre o frialdad|Refiere fiebre o frialdad; señal de peligro, se valora y remite."],
  pauta:{t:"Señales de peligro",p:["Amarillo en las primeras 24 horas: siempre es anormal, remitir.","Amarillo que baja del ombligo o llega a palmas y plantas: remitir.","Fiebre (más de 37,5 °C) o frío (menos de 36,5 °C): remitir; puede ser infección."],r:"",b:""}},
 "rn::Succión, llanto, actividad":{c:["Normal|Succión vigorosa, llanto fuerte y actividad normal.","Alterado|Succión débil, llanto débil o muy dormido; señal de peligro, se remite."],
  pauta:{t:"Señales de peligro",p:["No quiere mamar, succiona débil o vomita todo.","Muy dormido, flácido o no se despierta.","Convulsiones o llanto muy agudo e irritable.","Cualquiera: remitir hoy."],r:"",b:""}},
 "rn::Vacunas y tamizajes hechos":{c:["Completos|Tiene BCG, hepatitis B, TSH, tamizaje visual, auditivo y de cardiopatía.","Pendientes|Tiene vacunas o tamizajes pendientes; se programan y se registran en la ficha."],
  pauta:{t:"Qué revisar en el carné",p:["BCG y hepatitis B.","TSH neonatal (y su resultado).","Pulsioximetría, reflejo rojo y tamizaje auditivo.","Lo que falte, anótalo como pendiente: la app lo guarda en la ficha del bebé."],r:"",b:""}},
 "rn::Peso y pérdida desde el nacimiento":{widget:"pesorn",c:[],
  pauta:{t:"Qué es normal",p:["Pierde peso los primeros días: hasta 7 % es esperado.","Entre 7 y 10 %: revisa la lactancia.","Más de 10 %: remitir.","Debe recuperar el peso de nacimiento hacia los 10 a 14 días."],r:"",b:""}},
 "rn::Temperatura, FC, FR":{campos:"vitalesRN",c:[],
  pauta:{t:"Qué es normal",p:["Temperatura 36,5 a 37,5 °C.","Frecuencia cardiaca 120 a 160 por minuto.","Respiración 40 a 60 por minuto; más de 60 o con tiraje es dificultad respiratoria."],r:"",b:""}},
 "rn::Ictericia":{c:["Sin ictericia|Sin ictericia.","Leve|Ictericia en cara y tórax, por encima del ombligo, después de las 24 horas; se vigila y se fortalece la lactancia.","Para remitir|Ictericia que baja del ombligo, llega a palmas y plantas o apareció antes de las 24 horas; se remite hoy."],
  pauta:{t:"Cómo valorarla",p:["Mírala con luz natural, apretando suave la piel con un dedo.","Avanza de la cabeza a los pies: entre más abajo, más alta la bilirrubina.","Remitir si apareció antes de 24 horas, si pasa del ombligo, si llega a palmas y plantas, o si está decaído o no mama.","No se recomienda «asolearlo» como tratamiento."],r:"",b:""}},
 "rn::Ombligo":{c:["Normal|Muñón umbilical limpio y seco, sin eritema ni secreción.","Infectado|Ombligo con enrojecimiento de la piel alrededor, secreción o mal olor; se remite.","Sangrado|Sangrado del muñón; se revisa la ligadura y se remite si persiste."],
  pauta:{t:"Qué buscar",p:["Limpio y seco; se cae entre los 7 y 15 días.","Piel roja alrededor, pus o mal olor: onfalitis, remitir.","Nada encima: ni fajero, ni botón, ni remedios."],r:"",b:""}},
 "rn::Observar una toma (posición y agarre)":{c:["Adecuada|Se observa una toma: buena posición y agarre (boca bien abierta, labio inferior evertido, mentón tocando el pecho).","Se corrige|Se observa una toma con agarre inadecuado; se corrige posición y agarre."],
  pauta:{t:"Qué mirar (Anexo 9)",p:["Posición: cabeza y cuerpo en línea, de frente al pecho, pegado a la mamá, sostenido entero.","Agarre: boca bien abierta, labio de abajo hacia afuera, mentón tocando el pecho, más areola visible arriba que abajo.","Succiones lentas y profundas, se oye tragar.","La mamá no siente dolor."],r:"",b:""}},
 "rn::Consejería en lactancia materna exclusiva":{c:["Realizada|Se brinda consejería en lactancia materna exclusiva hasta los 6 meses, a libre demanda, y signos de alarma del recién nacido."],
  pauta:{t:"Qué decirle",p:["Solo pecho hasta los 6 meses: ni agua ni coladas.","A libre demanda, de día y de noche.","Sueño seguro: boca arriba, en su propia superficie firme, sin humo cerca.","Signos de alarma: no mama, fiebre o frío, respira rápido, amarillo, ombligo rojo, convulsiona, muy dormido.","Carné de salud infantil en cada consulta y reclamar el resultado de la TSH."],r:"Se brinda consejería en lactancia materna exclusiva, sueño seguro y signos de alarma del recién nacido.",b:"Registrar que se educó"}},
 "rn::Con VIH confirmado: fórmula, no leche materna":{c:["No aplica|Madre sin VIH: lactancia materna exclusiva.","Fórmula|Madre con VIH confirmado: se indica fórmula láctea, se suspende la lactancia y se remite."],
  pauta:{t:"Qué hacer",p:["Con VIH confirmado no se da pecho: fórmula (Res. 3280, p. 272).","Enseña a preparar la fórmula con agua hervida y utensilios limpios.","Profilaxis del bebé y control por pediatría."],r:"",b:""}}
});
/* casillas del recién nacido */
CAMPOS.vitalesRN=[{k:"t",l:"Temperatura",u:"°C",ph:"36,8",n:"Normal 36,5 a 37,5"},{k:"fc",l:"Frec. cardiaca",u:"lpm",ph:"140",n:"Normal 120 a 160"},{k:"fr",l:"Frec. respiratoria",u:"rpm",ph:"48",n:"Normal 40 a 60"},{k:"spo2",l:"Saturación O₂",u:"%",ph:"97",n:"Normal 95 o más"}];
CAMPOS.antropoRN=[{k:"eg",l:"Edad gestacional al nacer",u:"semanas",ph:"39",n:"Para saber si es a término"},{k:"peso",l:"Peso",u:"g",ph:"3200",n:"2.500 a 4.000 g"},{k:"talla",l:"Talla",u:"cm",ph:"50",n:""},{k:"pc",l:"Perímetro cefálico",u:"cm",ph:"34",n:""},{k:"pt",l:"Perímetro torácico",u:"cm",ph:"33",n:""}];
/* Patrones OMS al nacer (Res. 2465 de 2016): -3, -2, -1, mediana, +1, +2, +3 DE */
const OMS0={M:{peso:[2.1,2.5,2.9,3.3,3.9,4.4,5.0],talla:[44.2,46.1,48.0,49.9,51.8,53.7,55.6],pc:[30.7,31.9,33.2,34.5,35.7,37.0,38.3]},F:{peso:[2.0,2.4,2.8,3.2,3.7,4.2,4.8],talla:[43.6,45.4,47.3,49.1,51.0,52.9,54.7],pc:[30.3,31.5,32.7,33.9,35.1,36.2,37.4]}};
function zOMS(v,t){if(v<=t[0])return -3-(t[0]-v)/(t[1]-t[0]);if(v>=t[6])return 3+(v-t[6])/(t[6]-t[5]);for(let i=0;i<6;i++)if(v<=t[i+1])return i-3+(v-t[i])/(t[i+1]-t[i]);return 0}
function zTxt(z){const r=Math.round(z*10)/10;return (r<0?"−":r>0?"+":"")+coma(Math.abs(r).toFixed(1))}
const lc1=t=>t.charAt(0).toLowerCase()+t.slice(1);
const _cvBaseRN=cvCalc;
cvCalc=function(tipo,v){
  if(tipo==="vitalesRN"){const t=nv(v.t),fc=nv(v.fc),fr=nv(v.fr),s=nv(v.spo2),m={},flag={},al=[],P=[];
    if(t!=null){P.push("temperatura "+coma(t)+" °C");if(t<36.5){m.t="Baja: hipotermia";flag.t="alto";al.push("Temperatura menor de 36,5 °C: señal de peligro. Piel a piel, gorro, cobija seca; si no mejora o no mama, remitir.")}else if(t>37.5){m.t="Alta: fiebre";flag.t="alto";al.push("Temperatura mayor de 37,5 °C: señal de peligro (posible infección). Desabrigar y remitir.")}else m.t="Normal"}
    if(fc!=null){P.push("FC "+fc+" lpm");if(fc<100||fc>180){m.fc="Alterada";flag.fc="alto";al.push("Frecuencia cardiaca fuera de 100 a 180: remitir.")}else if(fc<120||fc>160){m.fc="Revisar en reposo";}else m.fc="Normal"}
    if(fr!=null){P.push("FR "+fr+" rpm");if(fr>60){m.fr="Rápida: dificultad respiratoria";flag.fr="alto";al.push("Respiración de más de 60 por minuto: dificultad respiratoria. Busca tiraje y quejido; remitir.")}else if(fr<30){m.fr="Lenta: pausas";flag.fr="alto";al.push("Respiración lenta o con pausas: remitir.")}else m.fr="Normal"}
    if(s!=null){P.push("saturación "+s+" %");if(s<90){m.spo2="Baja: remitir";flag.spo2="alto";al.push("Saturación menor de 90 %: remitir (cardiopatía o problema respiratorio).")}else if(s<95)m.spo2="Límite: repetir";else m.spo2="Normal"}
    return {txt:P.length?"Signos vitales del recién nacido: "+P.join(", ")+".":"",flag,al,m}}
  if(tipo==="antropoRN"){const eg=nv(v.eg),p=nv(v.peso),ta=nv(v.talla),pc=nv(v.pc),pt=nv(v.pt),m={},flag={},al=[],P=[],sx=pac()["GENERO"]==="M"?"M":pac()["GENERO"]==="F"?"F":null,T=sx?OMS0[sx]:null,term=eg==null||(eg>=37&&eg<42),sxT=sx==="M"?"niño":"niña";
    if(eg!=null){P.push("edad gestacional al nacer "+coma(eg)+" semanas");if(eg<37){m.eg="Pretérmino"+(eg<32?" (muy prematuro)":"");flag.eg="alto";al.push("Recién nacido pretérmino ("+coma(eg)+" semanas): riesgo de hipotermia, hipoglicemia y problemas para mamar; valoración por medicina"+(eg<34?" y remisión":"")+". Sus medidas se grafican en curvas para prematuros (Fenton o INTERGROWTH), no en las de la OMS.")}else if(eg>=42){m.eg="Postérmino";flag.eg="alto";al.push("Recién nacido postérmino (42 semanas o más): vigilar hipoglicemia y signos de sufrimiento.")}else m.eg="A término"}
    const cls=(k,val,lab,fmt)=>{if(!T||!term)return null;const z=zOMS(k==="peso"?val/1000:val,T[k]);let c,cl;
      if(k==="pc"){c=z<-2?"Menor de −2 DE: posible microcefalia":z>2?"Mayor de +2 DE: posible macrocefalia":"Adecuado";cl=Math.abs(z)>2}
      else if(k==="talla"){c=z<-2?"Talla baja para la edad":z<-1?"Riesgo de talla baja":"Adecuada";cl=z<-1}
      else{c=z<-2?"Peso bajo para la edad":z<-1?"Riesgo de peso bajo":z>2?"Peso alto: valorar":"Adecuado";cl=z<-1||z>2}
      return {z,c,cl,t:lab+" "+fmt+": z "+zTxt(z)+" ("+lc1(c)+", OMS "+sxT+")"}};
    if(p!=null){const g=p<20?Math.round(p*1000):p;let cat=g<1000?"Extremadamente bajo peso":g<1500?"Muy bajo peso":g<2500?"Bajo peso al nacer":g>4000?"Macrosomía":"";
      const r=cls("peso",g,"peso",g+" g");m.peso=[cat,r?"z "+zTxt(r.z)+": "+r.c:""].filter(Boolean).join(" · ")||"Peso adecuado al nacer";if(cat||(r&&r.cl))flag.peso="alto";
      P.push(r?r.t:"peso "+g+" g"+(cat?" ("+cat.toLowerCase()+")":""));
      if(g<2500)al.push(cat+" ("+g+" g): riesgo de hipotermia e hipoglicemia. Piel a piel, lactancia frecuente y valoración por medicina."+(g<2000?" Menor de 2.000 g: remitir.":""));
      else if(g>4000)al.push("Macrosomía (más de 4.000 g): riesgo de hipoglicemia y trauma del parto; vigilar alimentación y valoración por medicina.")}
