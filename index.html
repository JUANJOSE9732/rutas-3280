 "prenatal::Opciones frente al embarazo|Pide IVE":{t:"Si pide la IVE",p:["Es su derecho y no necesita justificar nada hasta la semana 24 (Sentencia C-055 de 2022). Después de la 24: riesgo para su vida o salud, malformación incompatible con la vida, o embarazo por violencia sexual, incesto o inseminación no consentida.","No la inscribas al control prenatal: pasa al módulo IVE y gestiona la remisión sin demoras ni exigencias adicionales.","Si es menor de 14 años: el embarazo es por violencia sexual; activa además la ruta de violencia y la denuncia.","Es confidencial; nadie más puede decidir por ella."],r:"Se activa la ruta de interrupción voluntaria del embarazo según la Sentencia C-055 de 2022 y la Resolución 051 de 2023."},
 "prenatal::Embarazo deseado|No deseado":{t:"Si el embarazo no es deseado",p:["Escúchala sin juzgar y pregúntale qué quiere hacer.","Recuérdale que puede decidir la IVE (sin causal hasta la semana 24) o continuar el embarazo con todo el apoyo.","Si continúa: ofrécele psicología y trabajo social; es un riesgo psicosocial que se vigila en cada control.","Pregunta con ella a solas si hay presión o violencia de alguien."],r:"Se brinda apoyo, información sobre opciones y se ofrece valoración por psicología."},
 "prenatal::Signos de alarma|Sangrado":{t:"Si tiene sangrado",p:["Pregunta cantidad (manchado o como regla), desde cuándo, si hay dolor o contracciones y si sale líquido.","No hagas tacto vaginal si está después de la semana 20 (puede ser placenta previa).","Toma TA, FC y frecuencia cardiaca fetal.","Remite hoy a medicina; si es abundante o con dolor fuerte, remisión urgente con canalización de vena si puedes."],r:"Gestante con sangrado genital: se remite hoy a valoración médica."},
 "prenatal::Signos de alarma|Salida de líquido":{t:"Si sale líquido por la vagina",p:["Puede ser ruptura de membranas: pregunta desde cuándo, color y olor del líquido, y si tiene fiebre.","No hagas tacto vaginal.","Escucha la frecuencia cardiaca fetal y toma temperatura.","Remite hoy a un servicio con atención de partos (riesgo de infección y de parto prematuro)."],r:"Sospecha de ruptura de membranas: se remite hoy a servicio con atención obstétrica."},
 "prenatal::Signos de alarma|Dolor de cabeza o ve luces":{t:"Cefalea o fosfenos: piensa en preeclampsia",p:["Toma la TA en reposo. Con ≥ 140/90 después de la semana 20, o ≥ 160/110 en una toma: llévala a un hospital hoy (Res. 3280, p. 271).","Pregunta por dolor en la boca del estómago, visión borrosa, zumbidos e hinchazón de cara y manos.","Si convulsiona: ponla de lado, protege la vía aérea y traslado urgente."],r:"Cefalea con síntomas visuales o auditivos en gestante: se valora TA y se remite según hallazgos."},
 "prenatal::Signos de alarma|Ardor al orinar o flujo":{t:"Si tiene síntomas urinarios o flujo",p:["La infección urinaria en el embarazo puede causar parto prematuro: urocultivo y remitir a medicina para tratamiento.","Si hay fiebre o dolor en la espalda (riñón): remisión el mismo día.","Flujo con mal olor o picor: remitir a medicina para tratamiento; ofrecer pruebas de ITS."],r:"Síntomas urinarios o flujo anormal: se solicita urocultivo y se remite a medicina."},
 "prenatal::Signos de alarma|Contracciones":{t:"Si tiene contracciones",p:["Antes de la semana 37 puede ser amenaza de parto prematuro: cuenta cuántas tiene en 10 minutos y cuánto duran.","Escucha la frecuencia cardiaca fetal; pregunta por sangrado o salida de líquido.","Remite hoy a medicina."],r:"Actividad uterina en gestante: se remite hoy para valoración médica."},
 "prenatal::Hemoclasificación|Rh negativo":{t:"Gestante Rh negativo",p:["Remite a medicina: debe pedirse Coombs indirecto y, si la pareja es Rh positivo o se desconoce, definir la profilaxis anti-D.","Pregunta si recibió inmunoglobulina anti-D en partos o abortos anteriores.","Ante sangrado o trauma en el embarazo, consulta inmediata."],r:"Gestante Rh negativo: se remite a medicina para estudio y profilaxis."},
 "prenatal::Alcohol, tabaco y sustancias|Chicha ocasional":{t:"Para responderle: chicha en el embarazo",p:["Reconoce que la chicha es parte de la cultura y las celebraciones; no juzgues.","La chicha dulce y la manicuera no tienen alcohol; la fermentada sí, como cualquier licor.","En el embarazo no hay cantidad segura: el alcohol pasa al bebé y puede causar aborto, bajo peso y daño en su desarrollo.","Puede seguir compartiendo en las fiestas con chicha dulce, manicuera o jugos.","Acuerda una meta y revísala en el próximo control. Si no logra dejarla, aplica el ASSIST (Res. 3280, p. 271)."],r:"Consumo de alcohol en la gestación: se realiza intervención breve con enfoque intercultural; se acuerda suspender bebidas fermentadas."},
 "prenatal::Alcohol, tabaco y sustancias|Chicha o licor frecuente":{t:"Consumo frecuente de alcohol en el embarazo",p:["Haz la intervención breve: cuánto, cada cuánto, si se emborracha; explica el riesgo para el bebé.","Pregunta con tacto por peleas o violencia cuando se toma.","Aplica el tamizaje ASSIST y remite a medicina y a la ruta de consumo de sustancias.","Control más cercano."],r:"Consumo frecuente de alcohol en la gestación: intervención breve, tamizaje ASSIST y remisión a medicina y ruta de consumo de sustancias."},
 "prenatal::Alcohol, tabaco y sustancias|Tabaco o mambe":{t:"Tabaco, rapé o mambe en el embarazo",p:["Reconoce el uso tradicional sin juzgar.","La nicotina y las sustancias de la coca pasan al bebé: bajo peso, parto prematuro y aborto.","Recomienda suspenderlo; si es ritual, conversa cómo participar sin consumir.","Evitar el humo de otros y del fogón dentro de la casa."],r:"Consumo de tabaco, rapé o mambe en la gestación: intervención breve con enfoque intercultural."},
 "prenatal::Exámenes de ingreso|Treponémica reactiva":{t:"Treponémica rápida REACTIVA: actúa hoy",p:["No hagas prueba de alergia a la penicilina (Res. 3280, p. 269).","Pregunta si ha recibido penicilina antes y si tuvo reacción grave.","Si NO hay antecedente de alergia: penicilina benzatínica 2.400.000 UI IM en este mismo momento, según el protocolo de tu institución.","Si hay alergia: remite para desensibilización.","Toma prueba no treponémica (VDRL o RPR), trata a la pareja, notifica sífilis gestacional (SIVIGILA) y remite a medicina para estadificar y completar el esquema."],r:"Prueba treponémica reactiva: se indaga alergia a penicilina, se aplica penicilina benzatínica 2.400.000 UI IM según protocolo, se solicita VDRL/RPR, se notifica y se remite a medicina; se cita a la pareja."},
 "prenatal::Exámenes de ingreso|VIH reactiva":{t:"Prueba rápida de VIH REACTIVA",p:["Haz de inmediato una segunda prueba de anticuerpos diferente a la primera (Res. 3280, p. 269).","Si la segunda también es reactiva: toma muestra para carga viral, remite el mismo día al prestador complementario para iniciar antirretroviral profiláctico.","Asesoría postest con calma y confidencialidad.","Notifica según el protocolo y planea el parto en institución."],r:"Prueba rápida de VIH reactiva: se realiza segunda prueba diferente, asesoría postest y remisión inmediata para carga viral e inicio de antirretrovirales."},
 "prenatal::Exámenes de ingreso|Pendiente de toma":{t:"Exámenes de ingreso cuando no hay laboratorio",p:["Haz hoy lo que se puede en el puesto: pruebas rápidas de VIH y sífilis con asesoría y gota gruesa.","Deja ordenados urocultivo, hemograma, hemoclasificación, glicemia, HBsAg, toxoplasma y rubéola para la brigada o el traslado.","La ecografía de 11 a 14 semanas tiene ventana corta: si está en esas semanas, gestiónala ya.","Anótalo como pendiente: la app lo deja en su ficha de paciente."],r:"Exámenes de ingreso ordenados y pendientes de toma; se realizan pruebas rápidas disponibles."},
 "prenatal::Resultados de exámenes|Alterados":{t:"Si un resultado salió alterado",p:["La enfermera no maneja el resultado alterado: remite de inmediato a medicina (Res. 3280, 4.3.2, p. 264).","Informa a la EAPB por un medio que quede registrado para que la reorienten (p. 271).","Ejemplos: Hb < 11 g/dl (anemia), urocultivo positivo (bacteriuria), glicemia alta, IgM toxoplasma positiva, HBsAg positivo."],r:"Paraclínico alterado: se remite a medicina y se informa a la EAPB."},
 "prenatal::Micronutrientes|Los tres":{t:"Cómo tomarlos",p:["Ácido fólico 0,4 mg al día hasta la semana 12.","Calcio 1.200 mg al día desde la semana 14: separado del hierro (por ejemplo, calcio en el almuerzo y hierro en ayunas o en la noche).","Hierro con jugo de fruta (arazá, guayaba, naranja), no con café ni leche; puede poner las heces negras y estreñir.","Si tiene hemoglobina mayor de 14 g/dl no necesita hierro de rutina."],r:"Se explica la forma correcta de tomar los micronutrientes."},
 "prenatal::Plan de parto|Partera":{t:"Si prefiere a la partera",p:["Respeta su decisión y reconoce el saber de la partera.","Explica los signos de alarma por los que debe salir de inmediato: sangrado, convulsión, dolor de cabeza fuerte, fiebre, salida de líquido verde o con mal olor, trabajo de parto de más de 12 horas, placenta que no sale.","Deja acordado con la partera y la familia cómo activar el transporte (lancha, avioneta) y a quién llamar.","Recomienda que el parto sea institucional si hay cualquier factor de riesgo."],r:"Se respeta la preferencia por partera; se informa la activación del sistema de referencia y transporte comunitario ante signos de alarma."},
 "prenatal::Información en salud|Signos de alarma":{t:"Qué decirle: cuándo venir de inmediato",p:["Sangrado por la vagina o salida de líquido.","Dolor de cabeza fuerte, ver luces, zumbidos, hinchazón de cara o manos, dolor en la boca del estómago.","El bebé se mueve menos o no se mueve.","Fiebre, ardor al orinar, flujo con mal olor, tos.","Contracciones antes de tiempo o dolor fuerte de barriga."],r:"Se explican los signos de alarma de la gestación."},
 "prenatal::Información en salud|Lactancia":{t:"Qué decirle: lactancia",p:["Pegar al bebé al pecho en la primera hora después del parto.","Solo leche materna hasta los 6 meses, sin agua ni coladas; luego con otros alimentos hasta los 2 años o más.","Si tiene VIH, no se da pecho: se reemplaza por fórmula (Res. 3280, p. 272)."],r:"Se brinda información sobre lactancia materna."}
});


Object.assign(GUIA,{
 "prenatal::Partera y medicina tradicional|No":{t:"Para responderle: si no la acompaña partera ni médico tradicional",p:["Respeta su decisión, sin empujarla a consultar.","Cuéntale que, si quiere, la atención tradicional y el control prenatal se pueden complementar.","Pídele que si le dan algún remedio, curación o la sobaban, te cuente, para revisar juntos que no afecte al bebé."],r:"Se informa que la atención tradicional y el control prenatal pueden complementarse; se le pide informar cualquier remedio o curación."},
 "prenatal::Partera y medicina tradicional|Partera":{t:"Para responderle: si la acompaña la partera",p:["Reconoce el papel de la partera; no la desautorices.","Invita a la partera a los controles si la gestante quiere: así conoce el carné y los signos de alarma.","El plan de parto se hace también con ella (Res. 3280, p. 272): dónde será el parto, cómo se activa el transporte y a quién llamar.","Repasen juntas los signos para salir de inmediato al hospital:","• Sangrado por la vagina, aunque sea poco.","• Salida de líquido, sobre todo verde o con mal olor.","• Dolor de cabeza fuerte, ver luces, convulsión, hinchazón de cara o manos.","• Fiebre, o el bebé se mueve menos.","• Trabajo de parto de más de 12 horas, o la placenta no sale a los 30 minutos.","Pídele que no le den bebidas para apurar el parto ni la soben con fuerza."],r:"Gestante acompañada por partera: se reconoce su papel, se invita a los controles y se repasan con ellas los signos de alarma y la activación del transporte."},
 "prenatal::Partera y medicina tradicional|Payé":{t:"Para responderle: si consultó al payé",p:["Reconoce y valora la consulta; no lo contradigas de frente.","Pregunta qué le recomendó: rezos, curaciones, dietas o alimentos que debe evitar.","Si la dieta le quita pescado, carne o huevo, busca con ella alternativas que el payé acepte: en el embarazo necesita más proteína y hierro.","Explica que los micronutrientes, las vacunas y los controles no interfieren con sus curaciones.","Acuerda que te cuente si le dan algo para tomar."],r:"Se respeta la consulta con el médico tradicional; se indagan sus recomendaciones y se concilian con el plan de cuidado prenatal."},
 "prenatal::Partera y medicina tradicional|Curación o rezo":{t:"Para responderle: curación o rezo",p:["Respétalo y regístralo; los rezos y curaciones sin sustancias no tienen riesgo para el bebé.","Pregunta si la curación incluyó algo para tomar, untar o humo (tabaco, rapé): eso sí se revisa.","Las dos atenciones pueden ir juntas."],r:"Se registra curación tradicional; se indaga si incluyó sustancias."},
 "prenatal::Partera y medicina tradicional|Sobada o acomodada":{t:"Si le sobaron o acomodaron el bebé",p:["Pregunta quién, cuántas veces y si después tuvo dolor, sangrado, contracciones o salida de líquido.","Explica con respeto que la sobada fuerte puede despegar la placenta o romper la fuente; si la hacen, que sea suave y nunca durante el trabajo de parto.","Escucha la frecuencia cardiaca fetal y revisa la altura uterina.","Si hubo dolor, sangrado o el bebé se mueve menos después de la sobada: remite hoy a medicina.","Desde la semana 36, si el bebé no está de cabeza, el plan de parto debe ser institucional; no se debe acomodar a la fuerza."],r:"Antecedente de sobada o maniobras externas: se indagan síntomas posteriores, se ausculta FCF y se orienta sobre sus riesgos."},
 "prenatal::Partera y medicina tradicional|Remedio de plantas":{t:"Si toma remedios de plantas en el embarazo",p:["Pregunta nombre de la planta, para qué, cómo la prepara, cuánta y cada cuánto.","Las plantas para bajar la regla, purgar, \"limpiar\" o apurar el parto pueden causar sangrado, contracciones, aborto o parto prematuro: recomiéndale no tomarlas.","Si no se sabe qué efecto tiene, anótala, suspéndela mientras tanto y consúltala con medicina.","Pídele que te cuente si empieza otra."],r:"Se indaga el uso de plantas medicinales en la gestación; se orienta sobre plantas con riesgo de sangrado, contracciones o aborto."}
});
Object.assign(GUIA,{
 "prenatal::Tipo de consulta|Primera consulta":{t:"Primera consulta: qué incluye",p:["Duración mínima 30 minutos si es antes de la semana 10 (Res. 3280, p. 265).","Antes de inscribirla: informar opciones y el derecho a la IVE.","Anamnesis completa, examen físico y ginecológico, exámenes de ingreso, Herrera y Hurtado, plan de cuidado y carné materno (CLAP).","Lo ideal es captarla antes de la semana 10."],r:"Se realiza primera consulta prenatal según Res. 3280."},
 "prenatal::Tipo de consulta|Primera consulta tardía":{t:"Primera consulta tardía",p:["Si llega después de la semana 16–18: registra el IMC pregestacional (peso que recuerde) para la meta de ganancia (p. 267).","Después de la semana 26: duración mínima 40 minutos y haz en esta consulta lo de los controles anteriores (p. 265).","Revisa qué exámenes ya se le pasaron de ventana (eco de 11–14) y cuáles le tocan ahora.","Pregunta por qué no vino antes (distancia, idioma, embarazo no deseado): eso orienta el plan."],r:"Primera consulta prenatal tardía: se realizan las actividades de los controles previos."},
 "prenatal::Tipo de consulta|Control de seguimiento":{t:"Control de seguimiento: qué incluye",p:["Duración mínima 20 minutos (p. 265).","Signos de alarma nuevos, TA, peso y curva, altura uterina, fetocardia, movimientos fetales; presentación desde la semana 36.","Exámenes del trimestre y lectura de resultados.","Herrera y Hurtado en cada trimestre; preguntas de depresión en la semana 28.","Si es nulípara: mínimo 10 controles; multípara: mínimo 7 (p. 265)."],r:"Control prenatal de seguimiento según Res. 3280."},
 "prenatal::Acompañante|Con su pareja":{t:"Si viene con la pareja",p:["Bienvenido: la norma pide informar también a la pareja o acompañante (p. 264).","Invítalo al curso de preparación para la maternidad y la paternidad.","Las preguntas de violencia hazlas con ella a solas; busca un momento (por ejemplo, al pesarla o examinarla)."],r:"Se involucra a la pareja en el control y se le invita al curso de preparación."},
 "prenatal::Acompañante|Con la partera":{t:"Si viene con la partera",p:["Reconoce su papel e invítala a participar.","Es la mejor oportunidad para repasar juntas los signos de alarma y el plan de parto.","Muéstrale el carné y explícale qué se mide en cada control."],r:"Se involucra a la partera en el control prenatal."},
 "prenatal::Opciones frente al embarazo|Continúa el embarazo":{t:"Si decide continuar",p:["Registra que se le informó y que decidió continuar.","Felicítala y explícale el calendario de controles: mensual hasta la semana 36 y luego cada 15 días.","Recuérdale que siempre puede volver a consultar si cambia su situación."],r:"Se informa sobre opciones y la gestante decide continuar la gestación."},
 "prenatal::Opciones frente al embarazo|Lo va a pensar":{t:"Si lo va a pensar",p:["Respeta su tiempo, pero explícale que hasta la semana 24 la IVE es por su sola decisión y que es mejor decidir pronto.","Dale una cita cercana (días, no semanas) y cómo contactarte.","Mientras decide, puedes tomar signos vitales y pruebas rápidas si acepta."],r:"La gestante solicita tiempo para decidir; se da cita cercana."},
 "prenatal::Embarazo deseado|Deseado, no planeado":{t:"Si no lo planeó pero lo desea",p:["Es frecuente: refuerza el apoyo y que empiece cuanto antes con los controles y micronutrientes.","Pregunta cómo se siente y si cuenta con apoyo de la pareja y la familia.","Aprovecha para hablar de anticoncepción después del parto."],r:"Gestación deseada no planeada: se refuerza el acompañamiento."},
 "prenatal::Signos de alarma|Niega":{t:"Aprovecha para repasar los signos de alarma",p:["Pídele que te diga cuáles recuerda y completa: sangrado, salida de líquido, dolor de cabeza fuerte o ver luces, hinchazón de cara o manos, dolor en la boca del estómago, fiebre, ardor al orinar, el bebé se mueve menos, contracciones antes de tiempo.","Acuerden qué hacer y a quién llamar si aparecen, sobre todo de noche."],r:"Niega signos de alarma; se refuerzan los signos de alarma y la ruta para consultar."},
 "prenatal::Signos de alarma|Hinchazón":{t:"Si tiene hinchazón",p:["Hinchazón leve de pies al final del día es común; la de cara y manos, o que aparece rápido, puede ser preeclampsia.","Toma la TA y pregunta por dolor de cabeza, visión y dolor en la boca del estómago.","Con TA ≥ 140/90 después de la semana 20: remisión hoy a hospital."],r:"Edema en gestante: se valora TA y síntomas de preeclampsia."},
 "prenatal::Signos de alarma|Dolor en la boca del estómago":{t:"Epigastralgia en el embarazo",p:["Puede ser solo acidez, pero después de la semana 20 también es signo de preeclampsia grave o HELLP.","Toma la TA y pregunta por cefalea, visión borrosa, náuseas y vómito.","Si la TA está alta o el dolor es fuerte: remisión hoy."],r:"Epigastralgia en gestante: se descarta preeclampsia con TA y síntomas."},
 "prenatal::Signos de alarma|Fiebre":{t:"Fiebre en el embarazo",p:["Busca la causa: orina (ardor), garganta, tos, flujo con mal olor, salida de líquido.","En zona de malaria: gota gruesa hoy.","Remite a medicina; la fiebre alta puede afectar al bebé."],r:"Fiebre en gestante: se busca foco, gota gruesa y se remite a medicina."},
 "prenatal::Movimientos fetales|Sí, normales":{t:"Qué decirle",p:["Desde la semana 28 puede contar los movimientos: debe sentir al menos 10 en 2 horas, estando acostada de lado después de comer.","Si nota que se mueve menos, que venga ese mismo día."],r:"Se educa sobre el conteo de movimientos fetales."},
 "prenatal::Movimientos fetales|Todavía no":{t:"Si aún no lo siente",p:["En el primer embarazo se empiezan a sentir hacia la semana 18–20; en otros, desde la 16.","Si pasa la semana 22 y no los siente, escucha la fetocardia y remite a medicina."],r:"Aún no percibe movimientos fetales, acorde a la edad gestacional."},
 "prenatal::Movimientos fetales|Disminuidos":{t:"Movimientos disminuidos: hoy",p:["Escucha la frecuencia cardiaca fetal ya.","Aunque esté normal, remite hoy a medicina para valoración del bienestar fetal.","No le digas que espere hasta el próximo control."],r:"Disminución de movimientos fetales: se ausculta FCF y se remite hoy a medicina."},
 "prenatal::Molestias del embarazo|Náuseas y vómito":{t:"Para responderle: náuseas y vómito",p:["Comer poco y seguido, algo seco al levantarse (casabe, galleta), evitar fritos y olores fuertes.","Tomar líquidos en pequeños sorbos entre comidas.","Si vomita todo lo que come o bebe, baja de peso u orina poco: remitir hoy (hiperémesis)."],r:"Se orienta manejo de náuseas y vómito; se explican signos de deshidratación."},
 "prenatal::Molestias del embarazo|Agrieras":{t:"Para responderle: agrieras",p:["Comer en pequeñas cantidades, no acostarse justo después de comer, evitar café, ají y fritos.","Si el dolor es en la boca del estómago y fuerte después de la semana 20, toma la TA (puede ser preeclampsia)."],r:"Se orienta manejo de la pirosis."},
 "prenatal::Molestias del embarazo|Estreñimiento o hemorroides":{t:"Para responderle: estreñimiento",p:["Más agua, frutas (papaya, arazá, guayaba), fríjol, caminar.","El hierro puede estreñir: no lo suspenda sin consultar.","Hemorroides con sangrado abundante o mucho dolor: medicina."],r:"Se orienta manejo del estreñimiento y las hemorroides."},
 "prenatal::Molestias del embarazo|Duerme mal":{t:"Para responderle: sueño",p:["Dormir de lado (mejor el izquierdo) desde la mitad del embarazo; almohada entre las piernas.","Siestas cortas si puede.","Si no duerme por preocupación o tristeza, haz las preguntas de depresión."],r:"Se orienta sobre higiene del sueño en la gestación."},
 "prenatal::Medicamentos en este embarazo|Ninguno":{t:"Si no ha tomado nada",p:["Pregunta también por remedios, pastillas para el dolor o la gripa que se haya tomado por su cuenta.","Si no ha recibido micronutrientes, se inician hoy según la semana: ácido fólico hasta la 12, calcio desde la 14 y hierro (p. 269). La app lo deja en el análisis.","Explícale que no tome medicamentos sin consultar mientras esté embarazada."],r:"No ha recibido medicamentos; se inicia suplementación según edad gestacional y se educa sobre automedicación."},
 "prenatal::Medicamentos en este embarazo|Micronutrientes":{t:"Si ya los toma",p:["Revisa que los tome bien: hierro separado del calcio, con jugo y no con café ni leche.","Ácido fólico solo hasta la semana 12; calcio desde la 14.","Pregunta si le sobran o le faltan para formular lo que necesite."],r:"Se verifica adherencia y forma de tomar los micronutrientes."},
 "prenatal::Medicamentos en este embarazo|Antibiótico":{t:"Si recibió antibiótico",p:["Pregunta cuál, por qué, quién lo formuló y si completó el tratamiento.","Si fue por infección urinaria, debe tener urocultivo de control (p. 271).","Algunos antibióticos no se usan en el embarazo: si no lo formuló medicina, consúltalo."],r:"Se indaga el antibiótico recibido y se programa urocultivo de control si fue por bacteriuria."},
 "prenatal::Medicamentos en este embarazo|Otro":{t:"Medicamentos que hay que revisar",p:["Anticonvulsivantes, antihipertensivos (enalapril y losartán no se usan en el embarazo), warfarina, isotretinoína, misoprostol, algunos antiparasitarios: remitir a medicina.","Analgésicos: el acetaminofén es el más seguro; evitar ibuprofeno y diclofenaco, sobre todo en el tercer trimestre."],r:"Se revisan los medicamentos recibidos en la gestación."},
 "prenatal::Fórmula obstétrica|Primigestante":{t:"Si es su primer embarazo",p:["Es criterio moderado de preeclampsia y suma 1 punto en Herrera (nulípara).","Necesita mínimo 10 controles (Res. 3280, p. 265).","Refuerza el curso de preparación para la maternidad."],r:"Primigestante: se programan mínimo 10 controles."},
 "prenatal::Fórmula obstétrica|Fórmula":{t:"Cómo escribirla y qué mirar",p:["G = gestaciones contando la actual; P = partos vaginales; C = cesáreas; A = abortos; E = ectópicos; V = hijos vivos.","5 o más partos suma 2 puntos en Herrera; 3 o más abortos, 1 punto.","Cesárea previa: suma 1 punto y el parto debe ser institucional."],r:"Se registra fórmula obstétrica."},
 "prenatal::Último parto|Menos de 18 meses":{t:"Intervalo corto",p:["Más riesgo de anemia, parto prematuro y bajo peso: revisa el hierro y la alimentación.","Si fue cesárea hace menos de 18 meses, riesgo de ruptura uterina: parto institucional y remisión a medicina.","Habla de anticoncepción después de este parto."],r:"Intervalo intergenésico corto: se refuerza suplementación y plan de parto institucional."},
 "prenatal::Último parto|Más de 10 años":{t:"Intervalo largo",p:["Es criterio moderado de preeclampsia (Res. 3280, p. 272): con otro criterio moderado cumple indicación de aspirina (la formula medicina).","Vigila la TA en cada control."],r:"Intervalo intergenésico mayor de 10 años: criterio moderado de preeclampsia."},
 "prenatal::Complicaciones en embarazos anteriores|Preeclampsia":{t:"Preeclampsia previa",p:["Es criterio ALTO de preeclampsia: remite a medicina para aspirina 75–100 mg desde la semana 12 hasta el parto (p. 272).","TA en cada contacto y educación en signos de alarma.","Parto institucional."],r:"Antecedente de preeclampsia: criterio alto; se remite a medicina para aspirina y control."},
 "prenatal::Complicaciones en embarazos anteriores|Hemorragia o placenta retenida":{t:"Hemorragia posparto previa",p:["Suma en Herrera y riesgo de que se repita.","El parto debe ser en institución con capacidad para manejar hemorragia (sangre, oxitocina).","Corrige la anemia durante el embarazo."],r:"Antecedente de hemorragia posparto: plan de parto institucional y corrección de anemia."},
 "prenatal::Complicaciones en embarazos anteriores|Prematuro o bajo peso":{t:"Parto prematuro o bajo peso previo",p:["Riesgo de que se repita: busca infección urinaria y vaginal y trátala (urocultivo).","Educa en signos de parto prematuro (contracciones, presión en la pelvis, salida de líquido).","Remite a medicina para valorar control de alto riesgo."],r:"Antecedente de parto pretérmino o bajo peso: se remite a medicina y se educa en signos de parto prematuro."},
 "prenatal::Complicaciones en embarazos anteriores|Muerte del bebé":{t:"Muerte perinatal previa",p:["Pregunta con calma: en qué semana, causa si la sabe. Puede ser un tema doloroso.","Remite a medicina y ginecobstetricia para buscar causas (diabetes, hipertensión, sífilis, malformaciones).","Ofrece apoyo de psicología."],r:"Antecedente de muerte perinatal: se remite a medicina y ginecobstetricia; se ofrece apoyo psicológico."},
 "prenatal::Complicaciones en embarazos anteriores|Malformaciones":{t:"Hijo con malformación",p:["Si fue defecto del tubo neural: ácido fólico 4 mg/día (p. 269).","Remite a ginecobstetricia para la ecografía de detalle y asesoría."],r:"Antecedente de malformación congénita: se remite a ginecobstetricia."},
 "prenatal::Complicaciones en embarazos anteriores|Bebé grande":{t:"Bebé de más de 4.000 g",p:["Puede ser diabetes no diagnosticada: asegura glicemia de ingreso y PTOG entre las semanas 24 y 28.","Parto institucional."],r:"Antecedente de macrosomía: tamizaje de diabetes gestacional."},
 "prenatal::Enfermedades crónicas|Hipertensión":{t:"Hipertensión crónica en el embarazo",p:["Criterio ALTO de preeclampsia: aspirina desde la semana 12 (la formula medicina).","Enalapril y losartán no se usan en el embarazo: remite a medicina hoy para cambiar el antihipertensivo.","Control de alto riesgo."],r:"Hipertensión crónica: se remite hoy a medicina para ajuste de tratamiento y prevención de preeclampsia."},
 "prenatal::Enfermedades crónicas|Diabetes":{t:"Diabetes en el embarazo",p:["Criterio ALTO de preeclampsia y 3 puntos en Herrera.","Remite a medicina y ginecobstetricia: control de glicemia estricto y ajuste de tratamiento.","Ácido fólico y ecografía de detalle."],r:"Diabetes pregestacional: se remite a medicina y ginecobstetricia."},
 "prenatal::Enfermedades crónicas|Epilepsia":{t:"Epilepsia en el embarazo",p:["Ácido fólico 4 mg/día hasta la semana 12 (Res. 3280, 4.3.6.1.4, p. 269). Si llega después de la 12, la norma ya no lo exige; si continuarlo durante todo el embarazo (algunos anticonvulsivantes bajan el folato) lo decide medicina.","Remítela hoy a medicina: la epilepsia es enfermedad asociada (4.3.2) y hay que revisar el anticonvulsivante (el ácido valproico causa malformaciones; la 3280 prefiere carbamazepina, lamotrigina o levetiracetam, p. 250).","No suspender el medicamento por su cuenta: las convulsiones también son peligrosas."],r:"Epilepsia: ácido fólico 4 mg y remisión a medicina."},
 "prenatal::Enfermedades crónicas|Trombosis":{t:"Trombosis o trombofilia",p:["Es factor de muy alto riesgo tromboembólico (Res. 3280, p. 269): remite a medicina para profilaxis.","Escala de riesgo tromboembólico (Anexo 11)."],r:"Antecedente tromboembólico: se remite a medicina para profilaxis."},
 "prenatal::Enfermedades crónicas|Enfermedad mental":{t:"Enfermedad mental",p:["Si tiene o se sospecha enfermedad mental grave, debe atenderse en servicio especializado de salud mental (p. 269).","Revisa sus medicamentos con medicina.","Vigila depresión y apoyo familiar."],r:"Trastorno mental: se remite a salud mental."},
 "prenatal::Cirugías y alergias|Cesárea":{t:"Cesárea previa",p:["Suma 1 punto en Herrera; el parto debe ser institucional.","Si fue hace menos de 18 meses o tuvo más de una cesárea: remite a medicina.","Pregunta por qué se la hicieron."],r:"Cesárea previa: plan de parto institucional."},
 "prenatal::Cirugías y alergias|Alergia a penicilina":{t:"Si dice ser alérgica a la penicilina",p:["Pregunta qué le pasó exactamente: ronchas, hinchazón de la cara o falta de aire (reacción grave) o solo malestar.","Anótalo en el carné: si la prueba de sífilis sale reactiva, necesitará desensibilización (p. 269)."],r:"Se caracteriza la alergia a penicilina y se registra en el carné."},
 "prenatal::Antecedentes ginecológicos|Sin tamizaje":{t:"Tamizaje de cuello uterino en la gestante",p:["Si no está al día, se hace en el embarazo según la técnica y frecuencia de la RPMS (p. 268).","Con espéculo, con suavidad; un poco de sangrado después es normal en el embarazo."],r:"Se programa tamizaje de cuello uterino según RPMS."},
 "prenatal::Antecedentes ginecológicos|ITS previa":{t:"ITS previa",p:["Asegura pruebas rápidas de VIH y sífilis y HBsAg.","Pregunta si la pareja recibió tratamiento.","Entrega condones (p. 272)."],r:"Antecedente de ITS: se aseguran pruebas y se entregan condones."},
 "prenatal::Antecedentes familiares|Preeclampsia":{t:"Preeclampsia en la familia",p:["Es criterio moderado de preeclampsia: con otro criterio moderado, aspirina (la formula medicina).","Vigila la TA en cada control."],r:"Antecedente familiar de preeclampsia: criterio moderado."},
 "prenatal::Antecedentes familiares|Gemelos":{t:"Gemelos en la familia",p:["Más probabilidad de embarazo múltiple: confírmalo con la ecografía.","Si hay dos fetos: alto riesgo, remite a ginecobstetricia."],r:"Antecedente familiar de gestación múltiple."},
 "prenatal::Hemoclasificación|No sabe":{t:"Si no sabe su grupo",p:["Se ordena hemoclasificación en los exámenes de ingreso.","Si sale Rh negativo: remite a medicina para Coombs indirecto y anti-D."],r:"Se solicita hemoclasificación."},
 "prenatal::Alcohol, tabaco y sustancias|Niega":{t:"Refuerza",p:["Felicítala.","En el embarazo no hay cantidad segura de alcohol; la chicha dulce y la manicuera sí puede tomarlas.","Evitar el humo del tabaco y del fogón dentro de la casa."],r:"Niega consumo; se refuerza la abstinencia de alcohol y tabaco en la gestación."},
 "prenatal::Alcohol, tabaco y sustancias|Otra sustancia":{t:"Otras sustancias en el embarazo",p:["Intervención breve sin juzgar: cuál, cuánto, cada cuánto.","Aplica el ASSIST y remite a medicina y a la ruta de consumo de sustancias (p. 271).","Vigila crecimiento fetal y violencia."],r:"Consumo de sustancias en la gestación: intervención breve, ASSIST y remisión."},
 "prenatal::Familia y apoyo|Poco apoyo":{t:"Si tiene poco apoyo",p:["Suma en Herrera (soporte familiar inadecuado).","Pregunta quién la puede acompañar en el embarazo y el parto.","Remite a trabajo social o psicología e invítala al curso de preparación.","Pregunta con tacto por violencia."],r:"Soporte familiar inadecuado: se remite a trabajo social o psicología."},
 "prenatal::Familia y apoyo|Madre cabeza de familia":{t:"Madre cabeza de familia",p:["Es riesgo psicosocial (p. 266): planea con ella quién cuidará a sus hijos durante el parto y el posparto.","Ofrece trabajo social y los programas de apoyo de su comunidad."],r:"Madre cabeza de familia: se planea red de apoyo para el parto."},
 "prenatal::Acceso al servicio|Lejos":{t:"Si vive lejos",p:["Planea desde ya el albergue u hogar materno o la casa de paso para las semanas finales (p. 270).","Acuerda el transporte (lancha, avioneta) y quién la acompaña.","Explica que ante signos de alarma debe salir de inmediato, sin esperar."],r:"Barrera geográfica: se planea hogar materno y transporte para el parto."},
 "prenatal::Acceso al servicio|Idioma":{t:"Si necesita intérprete",p:["Gestiona un facilitador intercultural o intérprete para los controles (p. 270).","Usa dibujos o el carné con imágenes para los signos de alarma.","Confirma que entendió pidiéndole que te explique lo que hará."],r:"Barrera de idioma: se gestiona intérprete o facilitador intercultural."},
 "prenatal::Depresión: necesita ayuda|Sí":{t:"Tamizaje de depresión positivo",p:["Escúchala y dile que es frecuente en el embarazo y que tiene ayuda.","Pregunta si ha pensado en hacerse daño: si sí, remisión urgente.","Remite a la ruta de salud mental (psicología o medicina) y haz seguimiento."],r:"Tamizaje de depresión positivo: se remite a la ruta de salud mental."},
 "prenatal::Vacunas del embarazo|Td pendiente":{t:"Td en el embarazo",p:["Si no tiene esquema previo: 2 dosis con 4 semanas de intervalo, la segunda al menos 2 semanas antes del parto (confirma con el PAI).","Si tiene esquema: refuerzo según antecedente."],r:"Se aplica o remite a vacunación con Td según antecedente."},
 "prenatal::Vacunas del embarazo|Influenza pendiente":{t:"Influenza",p:["Desde la semana 14, una dosis en la temporada (Res. 3280, p. 269).","Protege a la mamá y al bebé en sus primeros meses."],r:"Se remite a vacunación de influenza."},
 "prenatal::Vacunas del embarazo|Tdap pendiente":{t:"Tdap (tos ferina)",p:["Desde la semana 26 (Res. 3280, p. 269): protege al bebé contra la tos ferina antes de que él pueda vacunarse."],r:"Se remite a vacunación con Tdap."},
 "prenatal::Vacunas del embarazo|Sin carné":{t:"Sin carné",p:["Pregunta si recuerda vacunas; si no hay registro, se considera no vacunada.","Remite a vacunación para iniciar Td y las del embarazo según la semana."],r:"Sin carné de vacunación: se remite a vacunación."},
 "prenatal::Valoración obstétrica|Podálica":{t:"Si el bebé viene de nalgas",p:["Antes de la semana 36 es normal; puede voltearse solo.","Desde la semana 36: plan de parto institucional y remisión a medicina (Herrera: mala presentación, 3 puntos).","No se debe sobar ni acomodar a la fuerza."],r:"Presentación podálica: vigilancia; desde la semana 36, plan de parto institucional."},
 "prenatal::Valoración obstétrica|Transversa":{t:"Si el bebé está atravesado",p:["Desde la semana 36: no puede nacer por parto vaginal. Remite a medicina y plan de parto institucional.","Si empieza el trabajo de parto con el bebé atravesado: traslado urgente."],r:"Situación transversa: remisión y plan de parto institucional."},
 "prenatal::Valoración obstétrica|Dos fetos":{t:"Sospecha de gemelos",p:["Confírmalo con ecografía.","Es alto riesgo (3 puntos en Herrera y criterio moderado de preeclampsia): remite a ginecobstetricia.","Parto institucional."],r:"Sospecha de gestación múltiple: ecografía y remisión a ginecobstetricia."},
 "prenatal::Exámenes de ingreso|Pruebas rápidas hoy":{t:"Pruebas rápidas: asesoría",p:["Antes: explica para qué son, que son voluntarias y confidenciales, y pide su consentimiento.","Después: si son no reactivas, recuerda que se repiten cada trimestre y en el parto.","Si alguna es reactiva, toca la opción correspondiente para ver qué hacer."],r:"Se realiza asesoría pre y postest para VIH y sífilis."},
 "prenatal::Exámenes de ingreso|Ecografía 11 a 14 semanas":{t:"Ecografía de 11 a 14 semanas",p:["Ventana: 10+6 a 13+6 semanas (p. 268). Si se pasa, ya no sirve para tamizaje de aneuploidías.","La hace ginecología o radiología entrenada; gestiona la cita ya si está en esas semanas.","Si el tamizaje sale positivo, se remite a ginecobstetricia."],r:"Se ordena ecografía de tamizaje de aneuploidías."},
 "prenatal::Exámenes de seguimiento|PTOG":{t:"Curva de glucosa (PTOG 75 g)",p:["Entre las semanas 24 y 28 (p. 271).","En ayunas de 8 horas; se toma glicemia en ayunas, a la hora y a las 2 horas.","Si sale alterada: remite a medicina (diabetes gestacional)."],r:"Se ordena PTOG 75 g."},
 "prenatal::Exámenes de seguimiento|Estreptococo B":{t:"Cultivo de estreptococo B",p:["Entre las semanas 35 y 37 (p. 271); muestra vaginal y rectal.","Si es positivo, en el parto se le pone antibiótico: anótalo en el carné."],r:"Se ordena cultivo para estreptococo del grupo B."},
 "prenatal::Resultados de exámenes|No trae":{t:"Si no trae resultados",p:["Averigua si se tomaron; si no, déjalos como pendientes y gestiona la toma.","Recuerda que la EAPB debe reorientarla si no asiste o si hay resultados anormales (p. 264)."],r:"Resultados pendientes; se gestiona la toma."},
 "prenatal::Riesgo de preeclampsia|1 criterio alto":{t:"Indicación de aspirina",p:["Ácido acetilsalicílico 75–100 mg cada noche desde la semana 12 hasta el parto (p. 272).","La formula medicina: remite con la indicación clara.","TA en cada contacto y signos de alarma."],r:"Criterio alto de preeclampsia: se remite a medicina para aspirina."},
 "prenatal::Riesgo de preeclampsia|2 o más moderados":{t:"Indicación de aspirina",p:["Con 2 o más criterios moderados está indicada la aspirina 75–100 mg desde la semana 12 hasta el parto (p. 272).","Remite a medicina para que la formule."],r:"Dos o más criterios moderados de preeclampsia: se remite a medicina para aspirina."},
 "prenatal::Micronutrientes|Calcio":{t:"Cómo tomar el calcio",p:["1.200 mg al día desde la semana 14 (p. 269).","No tomarlo junto con el hierro: separados por al menos 2 horas."],r:"Se formula y explica la toma de calcio."},
 "prenatal::Micronutrientes|Hierro":{t:"Cómo tomar el hierro",p:["En ayunas o en la noche, con jugo de fruta; no con café, leche ni el calcio.","Las heces se ponen negras y puede estreñir: es normal.","No se da de rutina si la hemoglobina es mayor de 14 g/dl."],r:"Se formula y explica la toma de hierro."},
 "prenatal::Desparasitación|Se entrega":{t:"Albendazol en el embarazo",p:["400 mg en una sola dosis, solo en segundo o tercer trimestre, una vez en el embarazo (p. 270).","Indicada en zonas sin acueducto ni alcantarillado, agricultoras o grupos étnicos.","Refuerza lavado de manos, hervir el agua y usar calzado."],r:"Se suministra albendazol 400 mg dosis única y se educa en prevención de parasitosis."},
 "prenatal::Remisiones|Curso de preparación":{t:"Curso de preparación",p:["Mínimo 7 sesiones; idealmente con la pareja o un acompañante.","Incluye signos de alarma, trabajo de parto, lactancia, cuidados del bebé y del posparto."],r:"Se inscribe en el curso de preparación para la maternidad y la paternidad."},
 "prenatal::Anticoncepción posparto|Implante":{t:"Asesoría: implante subdérmico",p:["Qué es: una varilla delgada bajo la piel del brazo; protege 3 años (Jadelle 5). Es de los métodos más seguros: menos de 1 embarazo por cada 100 mujeres.","Cuándo: se puede poner antes de salir del hospital después del parto, aunque esté lactando; no daña la leche ni al bebé.","Qué esperar: la regla cambia (manchados irregulares, a veces no baja); no es peligroso. Puede dar dolor de cabeza o sensibilidad en los senos al inicio.","Consultar si: dolor, pus o enrojecimiento donde está la varilla, o sangrado muy abundante.","No protege de ITS: condón si hay riesgo.","Si el parto es en la comunidad con partera: que use lactancia exclusiva y condón y venga al puesto o a la brigada para ponerlo.","Controles: al mes, a los 3 meses y luego cada año (Res. 3280, cuadro 2)."],r:"Se brinda asesoría en implante subdérmico: eficacia, duración, cambios en el sangrado, compatibilidad con la lactancia, signos de alarma y controles."},
 "prenatal::Anticoncepción posparto|DIU":{t:"Asesoría: DIU (T de cobre)",p:["Qué es: un dispositivo pequeño dentro del útero; protege hasta 10 años sin hormonas y no afecta la lactancia.","Cuándo: se pone en las primeras 48 horas del parto (o durante la cesárea). Si no alcanza, hay que esperar 4 semanas o más (Res. 3280, ruta de anticoncepción).","Por eso: si lo elige, el parto debe ser institucional; si pare en la comunidad, se coloca después de las 4 semanas.","Qué esperar: reglas más abundantes y con más cólico los primeros meses.","Consultar si: fiebre, dolor fuerte en la parte baja de la barriga, flujo con mal olor, o si siente que se salió.","No protege de ITS: condón si hay riesgo.","Controles: en la consulta de puerperio, a los 3 meses y luego cada año (cuadro 2)."],r:"Se brinda asesoría en DIU posparto: momento de inserción (primeras 48 horas o después de 4 semanas), duración, efectos esperados, signos de alarma y controles."},
 "prenatal::Anticoncepción posparto|Inyectable trimestral":{t:"Asesoría: inyección cada 3 meses",p:["Qué es: inyección de progestágeno (medroxiprogesterona) cada 3 meses; no afecta la lactancia.","Cuándo: si no lacta, se puede aplicar antes de salir (primeros 21 días). Si lacta, lo ideal es desde las 6 semanas, pero la Res. 3280 permite aplicarla antes del alta si es difícil que vuelva a consulta (p. 184-185), como pasa en la comunidad.","Qué esperar: la regla se vuelve irregular o deja de bajar; puede subir de peso. Al suspenderla, la fertilidad puede tardar varios meses en volver.","Lo más importante: no dejar pasar la fecha. Anótale en el carné la fecha de cada dosis; si se atrasa más de 2 semanas, condón y consultar.","Si vive lejos o la brigada no llega a tiempo, recuérdale que el implante o el DIU no dependen de volver cada 3 meses.","No protege de ITS: condón si hay riesgo.","Controles: a los 3 meses y luego cada año, además de cada aplicación (cuadro 2)."],r:"Se brinda asesoría en inyectable trimestral: inicio, puntualidad de las dosis, cambios en el sangrado, retorno de la fertilidad y controles."},
 "prenatal::Anticoncepción posparto|Ligadura":{t:"Asesoría: ligadura de trompas",p:["Es definitiva: debe estar segura de no querer más hijos. Pregúntale qué pasaría si un hijo muere o cambia de pareja.","Es su decisión: no necesita permiso del esposo ni de nadie más (Ley 1412 de 2010); debe ser mayor de edad.","Se puede hacer durante la cesárea o en los días después del parto; por eso el parto debe ser en el hospital y el consentimiento firmado con tiempo.","Deja la solicitud en la historia y en el carné y gestiona con la EAPB desde ahora.","No cambia la regla ni el deseo sexual; no protege de ITS.","Mientras se hace: lactancia exclusiva y condón.","Controles: a la semana de la cirugía y al año (cuadro 2)."],r:"Se brinda asesoría en esterilización quirúrgica femenina: carácter definitivo, decisión autónoma, consentimiento informado anticipado y parto institucional; se registra la solicitud en historia y carné."},
 "prenatal::Anticoncepción posparto|Lactancia (MELA) y condón":{t:"Asesoría: método de la lactancia (MELA)",p:["Protege solo si se cumplen las 3 condiciones: el bebé tiene menos de 6 meses, toma solo pecho de día y de noche (sin agua, coladas ni fórmula), y a la mamá no le ha vuelto la regla.","Si falla cualquiera de las 3, ya no protege: debe pasar a otro método ese mismo día.","Sirve de puente mientras llega a la brigada o al puesto para el implante, DIU o inyección.","Usar condón también si hay riesgo de ITS.","Control a los 3 meses del parto para definir el siguiente método (cuadro 2)."],r:"Se brinda asesoría en método de amenorrea de la lactancia: tres condiciones, cambio de método al incumplir cualquiera y uso de condón."},
 "prenatal::Anticoncepción posparto|No ha decidido":{t:"Si no ha decidido",p:["Explica que los métodos se pueden iniciar antes de salir del hospital después del parto (implante, DIU).","El implante y el DIU no afectan la lactancia.","Retómalo en el próximo control y anótalo en el carné cuando decida."],r:"Se brinda asesoría anticonceptiva posparto; pendiente decisión."},
 "prenatal::Plan de parto|Hogar materno":{t:"Hogar materno o casa de paso",p:["Acuerda la fecha de traslado (por lo general 2 a 4 semanas antes de la fecha probable de parto) y quién la acompaña.","Qué llevar: carné, documento, ropa para ella y el bebé.","Organiza con la familia el cuidado de la casa y los hijos."],r:"Se planea el traslado al hogar materno."},
 "prenatal::Información en salud|Curso de preparación":{t:"Qué decirle: el curso",p:["Le enseña qué pasa en el parto, cómo respirar, cómo dar pecho y cuidar al bebé.","Puede ir con su pareja o un familiar."],r:"Se explica la importancia del curso de preparación."},
 "prenatal::Información en salud|Derechos":{t:"Qué decirle: sus derechos",p:["Tiene derecho a sus controles, exámenes, vacunas y micronutrientes gratis, y a que no la devuelvan si llega tarde (p. 264).","A estar acompañada en el parto y a que respeten su cultura.","Si le niegan un servicio, puede reclamar en la EPS o la Superintendencia de Salud."],r:"Se informa sobre los servicios a los que tiene derecho y cómo exigirlos."},
 "prenatal::Próximo control|1 mes":{t:"Periodicidad del control prenatal",p:["Mensual hasta la semana 36; luego cada 15 días hasta la 40 (Res. 3280, 4.3.5, p. 265).","Mínimo 10 controles si es su primer parto; 7 si ya ha tenido partos.","Los controles de las semanas 36, 38 y 40 los hace medicina (p. 264).","Recuérdale traer el carné y los resultados."],r:"Se programa el próximo control prenatal."}
});
