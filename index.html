<style>
/* Layout: panel de rutas (inicio) → módulo con Guía / Herramientas / Nota, una columna pensada para el celular */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#13241E; --muted:#56685F; --line:#D5DFD9;
  --accent:#1D6B52; --accent-ink:#FFFFFF; --accent-soft:#E1EFE8;
  --rose:#9C3D5B; --rose-soft:#F8E6EC; --sky:#2B5F8A; --sky-soft:#E3EEF7;
  --warn:#8A5A00; --warn-bg:#FFF3D6; --warn-line:#EBCB82;
  --miss:#7A2E3A; --miss-bg:#FBE9EC; --miss-line:#E9B8C1;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1714; --surface:#16221E; --ink:#E4EEE9; --muted:#9DB0A7; --line:#2A3A34;
  --accent:#5CC39A; --accent-ink:#06140F; --accent-soft:#1B3229;
  --rose:#F0A3BC; --rose-soft:#33202A; --sky:#8FC1EA; --sky-soft:#1A2A38;
  --warn:#F2C46B; --warn-bg:#2E2512; --warn-line:#5E4A1C;
  --miss:#F2A3B0; --miss-bg:#2E1A1E; --miss-line:#5C2C35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714; --surface:#16221E; --ink:#E4EEE9; --muted:#9DB0A7; --line:#2A3A34;
  --accent:#5CC39A; --accent-ink:#06140F; --accent-soft:#1B3229;
  --rose:#F0A3BC; --rose-soft:#33202A; --sky:#8FC1EA; --sky-soft:#1A2A38;
  --warn:#F2C46B; --warn-bg:#2E2512; --warn-line:#5E4A1C;
  --miss:#F2A3B0; --miss-bg:#2E1A1E; --miss-line:#5C2C35; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:18px 72px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-weight:800;font-size:1.7rem;line-height:1.1;letter-spacing:-.01em}
h2{font-weight:800;font-size:1.25rem}
h3{font-weight:600;font-size:1.02rem}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.lab{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
button{font:inherit;cursor:pointer}
textarea:focus,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* panel */
.finder{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);flex:1 1 120px;min-width:0}
input,select{font:inherit;font-size:1rem;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.92rem}
.sugg p{margin:0;color:var(--muted);font-size:.9rem}
.route{display:flex;flex-direction:column;gap:10px}
.route-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.route-head span{font-size:.85rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:74px;position:relative}
.tile b{font-size:.98rem;line-height:1.25}
.tile small{color:var(--muted);font-size:.8rem;line-height:1.3}
.tile.rm{border-left:5px solid var(--rose)}
.tile.rp{border-left:5px solid var(--sky)}
.tile.pc{border-left:5px solid var(--accent)}
.tile .dot{position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.tile.hl{box-shadow:0 0 0 3px var(--accent)}
/* módulo */
.top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
.back{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:700}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.tag.rm{background:var(--rose-soft);color:var(--rose)} .tag.rp{background:var(--sky-soft);color:var(--sky)} .tag.pc{background:var(--accent-soft);color:var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-data);font-size:.8rem;padding:5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.chip b{font-family:var(--f-body);font-weight:700;margin-right:4px;font-size:.78rem;color:var(--muted)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;border-bottom:1.5px solid var(--line)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 10px!important;font-size:.82rem;min-width:0}
.stepn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--f-data);font-size:.8rem;background:var(--surface);color:var(--muted)}
.tabs button[aria-selected="true"] .stepn{border-color:var(--accent);color:var(--accent);font-weight:700}
.stepn.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)!important}
.facts .chip{font-size:.74rem}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 12px;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.box{border-radius:10px;padding:12px 14px;border:1px solid}
.box h3{margin:0 0 6px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-body);font-weight:700}
.box ul{margin:0;padding-left:20px}
.box.warn{background:var(--warn-bg);border-color:var(--warn-line)} .box.warn h3{color:var(--warn)}
.box.miss{background:var(--miss-bg);border-color:var(--miss-line)} .box.miss h3{color:var(--miss)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.sec summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .cnt{font-family:var(--f-data);font-size:.8rem;color:var(--muted);font-weight:500}
details.sec[open] summary{border-bottom:1px solid var(--line)}
.items{list-style:none;margin:0;padding:6px 8px 10px}
.items li{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;border-radius:6px}
.items li:has(input:checked) span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.items input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.items .q{font-style:italic}
.note-src{font-size:.82rem;color:var(--muted);margin:0}
.notes-pick{display:flex;flex-wrap:wrap;gap:8px}
.notes-pick button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.92rem}
.notes-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
textarea{width:100%;font:inherit;font-size:1.05rem;line-height:1.55;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
#dict{min-height:220px} #nota{min-height:340px;font-size:.97rem}
.hint{font-size:.86rem;color:var(--muted);margin:6px 0 0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-weight:700;font-size:1rem;padding:12px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1 1 200px}
.btn:disabled{opacity:.55;cursor:default}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em;margin:0}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.out{display:flex;flex-wrap:wrap;gap:8px}
.risk{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.score{font-family:var(--f-data);font-size:1.6rem;font-variant-numeric:tabular-nums}
.pill{padding:5px 12px;border-radius:999px;font-weight:700;font-size:.88rem}
.pill.mid{background:var(--warn-bg);color:var(--warn)}
.an-sec{display:flex;flex-direction:column;gap:6px}
.an-sec h4{margin:6px 0 0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.an-dev{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:1.02rem;line-height:1.55;white-space:pre-wrap}
.an-ruta{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.an-ruta b{font-size:.98rem}.an-ruta small{color:var(--muted)}
.an-when{align-self:flex-start;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 10px;text-transform:uppercase;letter-spacing:.05em}
.an-when.hoy{background:var(--miss-bg);color:var(--miss)}.an-when.pronto{background:var(--warn-bg);color:var(--warn)}.an-when.programado{background:var(--accent-soft);color:var(--accent)}
.pill.low{background:var(--accent-soft);color:var(--accent)} .pill.high{background:var(--miss-bg);color:var(--miss)}
.hh{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hh li{display:flex;gap:10px;align-items:center;padding:5px 2px}
.hh input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.hh .pts{margin-left:auto;font-family:var(--f-data);font-size:.82rem;color:var(--muted)}
.hh .grp{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.foot{font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.micwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mic.on{background:var(--miss-bg);border-color:var(--miss);color:var(--miss)}
.mic-st{font-size:.88rem;color:var(--muted);min-width:0;flex:1 1 160px}
.bform{display:flex;flex-direction:column;gap:12px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:12px 14px 14px}
.bfl{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);min-width:0}
.bfl textarea{font-size:.95rem}
.bgrid .bfl:has(textarea),.bgrid .bfl:has([data-multi]){grid-column:1/-1}
.sugg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sugg button[aria-pressed="false"]{background:var(--surface);border-color:var(--line);font-weight:400}
.falta input,.falta select,.falta textarea,.falta [data-multi]{border-color:var(--miss)!important;box-shadow:0 0 0 2px var(--miss-bg)}
.falta>span:first-child{color:var(--miss);font-weight:700}
.lleno input,.lleno select,.lleno [data-multi]{border-color:var(--accent)!important;box-shadow:0 0 0 2px var(--accent-soft)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px 10px}
.pgrid input,.pgrid select{width:100%;min-width:0}.pgrid .bfl>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgrid .bfl{font-size:.74rem;gap:2px}
.pgrid input,.pgrid select{padding:6px 8px!important;font-size:.92rem!important;min-height:36px!important}
.pgrid .na{padding:0 6px;font-size:.68rem}
.pdet{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pdet>summary{cursor:pointer;font-size:.86rem;font-weight:700;color:var(--muted)}
.pdet[open]>summary{margin-bottom:8px}
.pdrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.pdrow .micwrap{margin:0}
.pac{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:.9rem;color:var(--muted)}
.pac b{color:var(--ink);font-size:1rem}
.pacbar{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:.88rem;color:var(--muted);margin-bottom:10px}
.pacbar b{color:var(--ink)}
.gx{border:2px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);margin-bottom:10px}
.gx-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gx-lab{font-size:1.3rem;font-weight:700;line-height:1.2}
.gx-hint{font-size:.85rem;color:var(--muted)}
.gx-val{font-size:1.15rem;font-weight:700;background:var(--accent-soft);border-radius:8px;padding:8px 10px;min-height:44px}
.gx-heard{font-size:.85rem;color:var(--muted);min-height:1.2em;font-style:italic}
.gx-msg{font-size:.9rem;font-weight:700;min-height:1.2em}
.gx-msg.err{color:var(--miss)} .gx-msg.ok{color:var(--accent)}
.gx-mic{font-size:.8rem;font-weight:700;color:var(--accent)}
.gx .btns .btn{flex:1 1 auto;padding:10px 12px;font-size:.92rem}
.pgrid .gx-on{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.popts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--accent-soft);border-radius:10px}
.popts button{border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem}
.popts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.popts .ph{width:100%;font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.guia{border:1.5px solid var(--accent);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.guia h3{margin:0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.guia ul{margin:0;padding-left:20px}.guia li{margin:2px 0}
.narow{display:flex;gap:6px;min-width:0}.narow input{flex:1 1 auto;min-width:0}
.na{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:0 10px;font-size:.8rem;font-weight:700}
.na[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.navrow{display:grid;grid-template-columns:64px 1fr;gap:10px}
.linkrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lnk{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
#pane{display:flex;flex-direction:column;gap:16px}
.sem{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 4px 0 8px;vertical-align:-1px;background:#bbb}.sem.r{background:#c0392b}.sem.a{background:#e0a100}.sem.v{background:#2e8b57}
.agl{display:flex;flex-direction:column;gap:6px;margin-top:8px}.agi{display:flex;gap:8px;align-items:center;border:1px solid var(--line,#ddd);border-radius:8px;padding:8px 10px}.agi .sem{margin:0;flex:none;width:14px;height:14px}.agi small{display:block;color:var(--muted)}
.drafts{display:flex;flex-direction:column;gap:6px}
.drafts button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.tile,.btn,.notes-pick button{transition:background .15s,border-color .15s,box-shadow .15s}}
</style>

 precon:{route:"rm",title:"Preconcepcional",who:"Mujer que quiere embarazarse en el próximo año",

  {b:"Plan",t:"do",si:A=>!/^no desea|^no:/i.test(A("Deseo de embarazo")),ref:"Res. 3280 · 4.1.6.4, p. 247 (0,4 mg; 4 mg si hijo con defecto del tubo neural) y p. 250 (4 mg en epilepsia).",l:"Ácido fólico",q:"Formulación de ácido fólico.",c:["0,4 mg/día|Se formula ácido fólico 0,4 mg/día vía oral desde ahora y al menos 3 meses antes del embarazo.","4 mg/día por epilepsia|Se formula ácido fólico 4 mg/día vía oral por antecedente de epilepsia (Res. 3280), desde al menos 3 meses antes del embarazo; se remite a medicina para manejo de la epilepsia.","4 mg/día por defecto del tubo neural|Se formula ácido fólico 4 mg/día vía oral por antecedente de hijo con defecto del tubo neural (Res. 3280), desde al menos 3 meses antes del embarazo."],h:"Al menos 3 meses antes del embarazo. Dosis habitual 0,4 mg/día; 4 mg/día si tiene epilepsia o tuvo un hijo con defecto del tubo neural (Res. 3280, 4.1).",dyn:A=>{const t=(A("Enfermedades")+" "+A("Medicamentos y remedios")+" "+A("Antecedentes genéticos y familiares")+" "+A("Complicaciones obstétricas previas")).toLowerCase();const r=[];if(/epilepsia|anticonvulsivante/.test(t))r.push("epilepsia");if(/tubo neural/.test(t))r.push("hijo con defecto del tubo neural");return r.length?"Esta usuaria necesita dosis alta: ácido fólico 4 mg/día por "+r.join(" y ")+" (Res. 3280).":""}},
  {b:"Plan",t:"do",ref:"Res. 3280 · 4.1, p. 245 y 4.1.4: asesoría y provisión de método anticonceptivo.",l:"Anticoncepción hasta decidir",q:"Método anticonceptivo mientras se prepara.",c:["Continúa|Continúa con su método anticonceptivo actual hasta decidir el embarazo.", "Inicia|Inicia método anticonceptivo ____ hasta decidir el embarazo.", "Busca embarazo|Suspende anticoncepción para buscar el embarazo."]},
  {b:"Plan",t:"do",ref:"Res. 3280 · 4.1.6.4–4.1.6.5, p. 248: odontología, nutrición, psicología, trabajo social, especialistas.",conducta:1,l:"Remisiones",q:"¿A dónde remitiste?",c:["Vacunación|Se remite a vacunación.", "Odontología|Se remite a odontología.", "Nutrición|Se remite a nutrición.", "Psicología|Se remite a psicología.", "Medicina|Se remite a medicina.", "Ginecobstetricia|Se remite a ginecobstetricia.", "Ninguna|No requiere remisiones."]},
  {b:"Plan",t:"do",ref:"Res. 3280 · 4.1.6.6, p. 249: información en salud, derechos reproductivos e IVE.",l:"Información brindada",q:"Antes de cerrar, explícale estos temas (Res. 3280, 4.1.6.6). Toca los que hablaste.",h:"Toca cada tema para ver qué decirle. «Todos los temas» registra los de la norma en una sola frase.",c:["Todos los temas|Se brinda información en salud según Res. 3280: planeación de la familia y espaciamiento de los hijos (intervalo mínimo de 18 meses), prevención de la gestación no deseada, recomendaciones nutricionales, estado de vacunación, importancia del control prenatal temprano, detección de factores de riesgo cardiometabólicos, derechos sexuales y reproductivos, derecho a la IVE y signos de alarma.","Planeación y espaciamiento|Se informa sobre planeación de la familia y espaciamiento de los hijos, con intervalo intergenésico mínimo de 18 meses.","Nutrición|Se brindan recomendaciones nutricionales.","Vacunas|Se informa sobre el estado de vacunación y la importancia de completar el esquema antes del embarazo.","Control prenatal temprano|Se recomienda acudir a control prenatal antes de la semana 10 al confirmar el embarazo.","Riesgo cardiometabólico|Se informa sobre detección temprana de factores de riesgo cardiometabólicos.","Derechos e IVE|Se informa sobre derechos sexuales y reproductivos y el derecho a la IVE (Sentencia C-055 de 2022).","Riesgo por edad|Se informa sobre el riesgo de aneuploidías y cromosomopatías asociado a la edad materna y las opciones de tamizaje en caso de gestación.","Signos de alarma|Se explican signos de alarma."]},
  {b:"Plan",t:"do",ref:"Res. 3280 · 4.1.5, p. 246 (mínimo una consulta inicial y un control) y 4.1.6.5, p. 249 (el control lee los exámenes).",l:"Próximo control",q:"¿Cuándo es el control para leer los exámenes?",h:"Viene puesto el estándar: 1 mes después de la consulta, para dar margen a los resultados. Cámbialo solo si hace falta; con «Próxima brigada» u «Otra fecha» escríbela así: 15/11/2026. Esa fecha pasa a la base y al semáforo de controles.",def:"Control el {+30} para lectura e interpretación de exámenes.",c:["1 mes (estándar)|Control el {+30} para lectura e interpretación de exámenes.","2 semanas|Control el {+14} para lectura e interpretación de exámenes.","Próxima brigada|Control en la próxima brigada, el ____, para lectura e interpretación de exámenes.","Otra fecha|Control el ____ para lectura e interpretación de exámenes."]}

 prenatal:[
  {b:"Primer abordaje",t:"do",ref:"Res. 3280 · 4.3.3, p. 265 (primera consulta: 30 min; tardía después de la semana 26: 40 min; seguimiento: 20 min) y 4.3.6.1, p. 265.",l:"Tipo de consulta",q:"¿Es la primera consulta de este embarazo o un control?",c:["Primera consulta|Primera consulta prenatal (inscripción al control prenatal).","Primera consulta tardía|Primera consulta prenatal tardía (inscripción después de la semana 16); se realizan en esta consulta las actividades de los controles previos.","Control de seguimiento|Control prenatal de seguimiento número ____."],h:"Según lo que escojas, la app hace solo las preguntas de esa consulta: en la primera, todos los antecedentes; en los controles, lo nuevo y el seguimiento."},
  {b:"Primer abordaje",t:"do",ref:"No está en la 3280: buena práctica de atención (trato digno y marco de derechos).",l:"Presentación",q:"Salúdala, preséntate y explícale para qué es el control.",c:["Presentación realizada|Se realiza presentación del profesional de enfermería y se explica el objetivo del control prenatal, su duración y las actividades a realizar. La gestante comprende y acepta.","Con intérprete|Se realiza presentación del profesional y se explica el objetivo del control con apoyo de intérprete en lengua propia. La gestante comprende y acepta."],h:"Ejemplo: «Buenos días, soy el enfermero del puesto. Vamos a revisar cómo van usted y su bebé: le haré unas preguntas, le tomo la presión, la peso, le mido la barriga y escuchamos el corazón del bebé. Al final le explico todo.»"},
  {b:"Primer abordaje",t:"ask",ref:"Res. 3280 · 4.3.1, p. 264: información a la gestante, su pareja o su acompañante.",l:"Acompañante",q:"¿Viene con alguien? ¿Quiere que esté en la consulta?",c:["Viene sola|Asiste sola al control.","Con su pareja|Asiste acompañada por su pareja; desea que permanezca en la consulta.","Con un familiar|Asiste acompañada por un familiar; desea que permanezca en la consulta.","Con la partera|Asiste acompañada por la partera de la comunidad.","Con intérprete|Asiste con intérprete en lengua propia."],h:"Las preguntas de violencia se hacen con ella a solas."},
  {b:"Primer abordaje",t:"do",si:PRIM,ref:"Res. 3280 · 4.3.6.1.1, p. 265: antes de inscribirla, informar el derecho a la IVE (hoy según la Sentencia C-055 de 2022).",l:"Opciones frente al embarazo",q:"Antes de inscribirla, explícale sus opciones frente al embarazo, incluido el derecho a la IVE.",c:["Continúa el embarazo|Se brinda información sobre las opciones frente al embarazo y el derecho a la IVE (Sentencia C-055 de 2022). La gestante decide continuar la gestación.","Pide IVE|Se brinda información sobre las opciones frente al embarazo y el derecho a la IVE. La gestante manifiesta su decisión de interrumpir la gestación; se activa la ruta de IVE.","Lo va a pensar|Se brinda información sobre las opciones y el derecho a la IVE; la gestante solicita tiempo para decidir; se programa nueva cita en ____."],al:/pide ive|interrumpir|tiempo para decidir/i,am:"Si pide la IVE: pasa al módulo IVE. Hasta la semana 24 es por su sola decisión; después, por las causales (C-055 de 2022). No se demora la atención."},
  {b:"Primer abordaje",t:"ask",si:PRIM,ref:"Res. 3280 · 4.3.6.1.2, p. 266: gestación deseada y programada.",l:"Embarazo deseado",q:"¿Este embarazo lo buscaron? ¿Cómo se siente con él?",c:["Deseado y planeado|Gestación deseada y planeada.","Deseado, no planeado|Gestación deseada, no planeada.","No deseado|Gestación no deseada; se brinda apoyo y se informa nuevamente sobre sus opciones."],al:/no deseada/i,am:"Embarazo no deseado: es un riesgo psicosocial (Res. 3280, p. 266). Ofrece información de opciones y apoyo de psicología."},
  {b:"Primer abordaje",t:"ask",ref:"Res. 3280 · 4.3.6.1.8, p. 272: en contextos rurales y étnicos, respetar el uso de médicos tradicionales y parteras.",l:"Partera y medicina tradicional",q:"¿La está acompañando la partera o el payé? ¿Le han hecho alguna curación o le han dado algún remedio en este embarazo?",c:["No|No la acompaña partera ni médico tradicional; no usa remedios tradicionales.","Partera|Es acompañada por la partera ____ de la comunidad.","Payé|Ha consultado con el payé (médico tradicional); se respeta y se registra la práctica.","Curación o rezo|Ha recibido curación o rezo tradicional (____) por el payé o sabedor en esta gestación.","Sobada o acomodada|Refiere que le han sobado o acomodado el bebé (____ veces, última ____).","Remedio de plantas|Refiere uso de remedio de plantas: ____, para ____."]},
  {b:"Gestación actual",t:"ask",ref:"Res. 3280 · 4.3.6.1.2, p. 266: edad gestacional por FUM, altura uterina o ecografía.",l:"Edad gestacional",q:"¿Cuándo fue su última regla? ¿Tiene ecografía?",widget:"eg",h:"Escribe la FUM y, si la tiene, la ecografía: la edad gestacional y la fecha probable de parto se calculan solas y sirven para el resto de la consulta."},
  {b:"Gestación actual",t:"ask",ref:"Res. 3280 · 4.3.6.1.2, p. 266 (primera) y 4.3.6.1.5, p. 270 (controles): síntomas y signos de alarma.",l:"Signos de alarma",q:"¿Ha tenido sangrado, salida de líquido, dolor de cabeza fuerte, ver luces o zumbidos, hinchazón de cara o manos, dolor en la boca del estómago, fiebre, ardor al orinar o contracciones?",c:["Niega|Niega sangrado genital, amniorrea, cefalea, alteraciones visuales o auditivas, edemas, epigastralgia, fiebre, síntomas urinarios y actividad uterina.","Sangrado|Refiere sangrado genital desde ____, cantidad ____.","Salida de líquido|Refiere salida de líquido por la vagina desde ____.","Dolor de cabeza o ve luces|Refiere cefalea ____ con alteraciones visuales o auditivas (fosfenos, tinnitus).","Hinchazón|Refiere edema de cara, manos o pies desde ____.","Dolor en la boca del estómago|Refiere epigastralgia desde ____.","Fiebre|Refiere fiebre desde ____.","Ardor al orinar o flujo|Refiere síntomas urinarios o flujo vaginal: ____.","Contracciones|Refiere actividad uterina (contracciones) ____ veces en una hora."],al:POS,am:"Signo de alarma: valora y remite a medicina; si hay sangrado abundante, salida de líquido, convulsión, cefalea con visión borrosa o TA alta, remisión urgente."},
  {b:"Gestación actual",t:"ask",ref:"Res. 3280 · 4.3.6.1.2, p. 266: presencia o ausencia de movimientos fetales.",l:"Movimientos fetales",q:"¿Siente que el bebé se mueve? ¿Igual que antes?",c:["Sí, normales|Percibe movimientos fetales activos.","Todavía no|Aún no percibe movimientos fetales (esperable antes de las 18 a 20 semanas).","Disminuidos|Refiere disminución de los movimientos fetales desde ____."],al:/disminu|no se mueve|ausencia/i,am:"Movimientos fetales disminuidos o ausentes: escucha la frecuencia cardiaca fetal y remite hoy a medicina."},
  {b:"Gestación actual",t:"ask",ref:"Res. 3280 · 4.3.6.1.2, p. 266 y 4.3.6.1.5, p. 270: náuseas, vómito, epigastralgia, hemorroides, sueño, tolerancia a la vía oral.",l:"Molestias del embarazo",q:"¿Tiene náuseas, vómito, agrieras, estreñimiento o hemorroides? ¿Cómo duerme?",c:["Ninguna|Niega náuseas, vómito, pirosis, estreñimiento o hemorroides; patrón de sueño adecuado.","Náuseas y vómito|Refiere náuseas y vómito ____ veces al día; ____ tolera la vía oral.","Agrieras|Refiere pirosis.","Estreñimiento o hemorroides|Refiere estreñimiento o hemorroides.","Duerme mal|Refiere alteración del sueño: ____."],al:/no tolera|vomito persistente|v[oó]mito.*(m[aá]s de|[5-9]|1\d) veces/i,am:"Vómito que no deja comer ni beber (intolerancia a la vía oral): remite a medicina hoy."},
  {b:"Gestación actual",t:"ask",ref:"Res. 3280 · 4.3.6.1.2, p. 265: tratamientos recibidos durante la gestación actual.",l:"Medicamentos en este embarazo",q:"¿Qué medicamentos, vitaminas o remedios ha tomado en este embarazo?",c:["Ninguno|No ha recibido medicamentos ni suplementos en la gestación actual.","Micronutrientes|Ha recibido ácido fólico ____, sulfato ferroso ____ y carbonato de calcio ____.","Antibiótico|Recibió antibiótico ____ por ____.","Otro|Ha recibido ____ por ____."]},
  {b:"Antecedentes",t:"ask",si:PRIM,ref:"Res. 3280 · 4.3.6.1.2, p. 266: total de gestaciones, partos, cesáreas, abortos, ectópicos, molas, vivos y muertos.",l:"Fórmula obstétrica",q:"Fórmula obstétrica.",campos:"formula",h:"Llena cada letra (contando este embarazo en G). La app revisa que cuadre y avisa lo que suma en Herrera.",c:["Primigestante|G1 P0 C0 A0 E0 M0 V0"]},
  {b:"Antecedentes",t:"ask",si:A=>PRIM(A)&&FO(A).partos!==0,ref:"Res. 3280 · 4.3.6.1.2, p. 266: intervalos intergenésicos, fecha del último parto, vía, término y peso.",l:"Último parto",q:"¿Cuándo fue su último parto? ¿Fue normal o por cesárea, a tiempo, y cuánto pesó el bebé?",c:["No aplica|No aplica: sin partos previos.","Más de 18 meses|Último parto hace más de 18 meses (____), vía ____, a término, peso al nacer ____ g.","Menos de 18 meses|Último parto hace menos de 18 meses (____): intervalo intergenésico corto.","Más de 10 años|Último parto hace más de 10 años (____): intervalo intergenésico largo."],al:/menos de 18|m[aá]s de 10 a/i,am:"Intervalo intergenésico menor de 18 meses o mayor de 10 años: factor de riesgo (el de más de 10 años es criterio moderado de preeclampsia)."},
  {b:"Antecedentes",t:"ask",si:A=>PRIM(A)&&FO(A).previos!==0,ref:"Res. 3280 · 4.3.6.1.2, p. 266: complicaciones de embarazos anteriores.",l:"Complicaciones en embarazos anteriores",q:"En otros embarazos, ¿tuvo presión alta o convulsiones, sangrado, placenta previa, ruptura de fuente antes de tiempo, bebé prematuro o muy pequeño o muy grande, placenta retenida, hemorragia o infección después del parto, o algún bebé que murió o nació con malformaciones?",c:["No aplica|No aplica: primera gestación.","Niega|Niega complicaciones en gestaciones previas.","Preeclampsia|Antecedente de preeclampsia, eclampsia o HELLP en gestación previa (____).","Hemorragia o placenta retenida|Antecedente de hemorragia posparto o retención placentaria (____).","Prematuro o bajo peso|Antecedente de parto pretérmino o recién nacido de bajo peso: ____.","Bebé grande|Antecedente de recién nacido de más de 4.000 g.","Muerte del bebé|Antecedente de muerte perinatal: ____.","Malformaciones|Antecedente de hijo con malformación congénita: ____.","Placenta o líquido|Antecedente de placenta previa, abruptio, RPM, polihidramnios u oligoamnios: ____.","Parto difícil|Antecedente de trabajo de parto prolongado o difícil.","Otra|Refiere en gestación previa: ____."],al:POS,am:"Complicación obstétrica previa: es factor de riesgo; remite a medicina para valorar control de alto riesgo."},

  {b:"Antecedentes ginecológicos",t:"ask",si:PRIM,ref:"Res. 3280 · 4.3.6.1.2, p. 265: edad de la menarquia y patrón de ciclos menstruales.",l:"Menarquia y ciclos",q:"¿A qué edad le llegó la primera regla? ¿Le venía cada mes?",c:["Regulares|Menarquia a los __ años; ciclos regulares cada __ días.","Irregulares|Menarquia a los __ años; ciclos irregulares (la FUM puede no ser confiable)."]},
  {b:"Antecedentes ginecológicos",t:"ask",si:PRIM,ref:"Res. 3280 · 4.3.6.1.2, p. 265: métodos anticonceptivos utilizados y hasta cuándo.",l:"Método antes del embarazo",q:"¿Qué método usaba para planificar y hasta cuándo?",c:["Ninguno|No usaba método anticonceptivo.","Inyectable mensual|Usaba inyectable mensual hasta ____.","Inyectable trimestral|Usaba inyectable trimestral hasta ____.","Pastillas|Usaba anticonceptivos orales hasta ____.","Implante|Tiene o tenía implante subdérmico (colocado en ____); ____ (retirado / aún lo tiene).","DIU|Tiene o tenía DIU (colocado en ____); ____ (retirado / aún lo tiene).","Condón|Usaba condón."],al:/aún lo tiene/i,am:"Gestación con DIU o implante aún puesto: remitir a medicina pronto (el DIU aumenta el riesgo de aborto e infección; el implante se retira)."},

 eg:{html:id=>{const v=k=>esc(S.get(key(id,"eg_"+k))||"");return `<div class="pgrid" id="egw">

   <div class="out" id="eg-out"></div><div class="box warn" id="eg-al" hidden></div>`},
  txt:id=>{const r=egPren(),g=k=>S.get(key(id,"eg_"+k))||"",L=[];if(g("fum"))L.push("FUM: "+g("fum").split("-").reverse().join("/")+(S.get(key(id,"eg_nofum"))?" (no confiable)":" (confiable)")+".");

   if(r.eg!=null)L.push("Edad gestacional: "+egT(r.eg)+" por "+r.metodo+". Fecha probable de parto: "+fmt(r.fpp)+".");return L.join(" ")},
  wire:(id,save)=>{const pinta=()=>{const r=egPren(),o=$("eg-out"),al=$("eg-al");o.innerHTML=r.eg!=null?chipsCalc({eg:r.eg,fpp:r.fpp,metodo:r.metodo})+`<span class="chip"><b>Trimestre</b>${r.eg<98?"primero":r.eg<196?"segundo":"tercero"}</span>`:'<span class="note-src">Escribe la FUM o la ecografía.</span>';
     const w=r.eg!=null?r.eg/7:null,m=[];if(w!=null&&w>=42)m.push("42 semanas o más: remitir hoy a medicina (embarazo prolongado).");else if(w!=null&&w>=36)m.push("Semana 36 o más: los controles de las semanas 36, 38 y 40 los hace medicina.");
     if(r.egFum!=null&&r.egEco!=null&&Math.abs(r.egFum-r.egEco)>(r.egEco<98?7:14))m.push("La FUM y la ecografía no coinciden por más de "+(r.egEco<98?"1 semana":"2 semanas")+": usa la ecografía (marca «FUM no confiable»).");
     al.hidden=!m.length;al.innerHTML=m.map(z=>`<p style="margin:0">${esc(z)}</p>`).join("")};
   document.querySelectorAll("[data-eg]").forEach(e=>e.addEventListener(e.type==="checkbox"?"change":"input",()=>{const k=e.dataset.eg;if(e.type==="checkbox"){if(e.checked)S.set(key(id,"eg_nofum"),"1");else S.del(key(id,"eg_nofum"))}else S.set(key(id,"eg_"+k),e.value);pinta();save()}));pinta()}},
 herrera:{html:id=>{const ef=hhEfectivo(id),sug=hhSugeridos();

};


const PE_ALTO=["Trastorno hipertensivo en embarazo previo","Enfermedad renal crónica","Lupus o síndrome antifosfolípido","Diabetes tipo 1 o 2","Hipertensión crónica"],PE_MOD=["Primer embarazo","40 años o más","Intervalo entre embarazos mayor de 10 años","IMC de 35 o más en la primera consulta","Preeclampsia en la familia","Embarazo múltiple"];
function peSugeridos(){const A=prenA,s=new Set(),pl=l=>plano(A(l)),co=pl("Complicaciones en embarazos anteriores"),en=pl("Enfermedades crónicas");
  if(/preeclampsia|eclampsia|hellp/.test(co))s.add("a0");if(/renal/.test(en))s.add("a1");if(/autoinmune|lupus|antifosfolip/.test(en))s.add("a2");if(/diabetes/.test(en))s.add("a3");if(/hipertension cronica/.test(en))s.add("a4");{const ta=peTA(),w=semPren();if(ta&&(ta[0]>=140||ta[1]>=90)&&w!=null&&w<20)s.add("a4")}
  if(/primigestante|g1 p0 c0 a0/.test(pl("Fórmula obstétrica")))s.add("m0");const P=pac(),e=edadDe(P["FECHA NACIMIENTO"]),ed=e?e.y:(P.__edad?+P.__edad:null);if(ed!=null&&ed>=40)s.add("m1");
  if(/mas de 10 anos/.test(pl("Último parto")))s.add("m2");const an=A("Antropometría y ganancia de peso"),im=(an.match(/IMC inicial (\d+)/)||an.match(/IMC (\d+)/)||[])[1];if(im&&+im>=35)s.add("m3");
  if(/familiar de preeclampsia/.test(pl("Antecedentes familiares")))s.add("m4");if(/dos polos|gestacion multiple/.test(pl("Valoración obstétrica")))s.add("m5");return s}

function peTA(){const t=prenA("Signos vitales"),m=t.match(/TA (\d{2,3})\/(\d{2,3})/);return m?[+m[1],+m[2]]:null}
function peEvidencia(){const A=prenA,pl=l=>plano(A(l)),e={},P=pac(),ed=edadDe(P["FECHA NACIMIENTO"]),edad=ed?ed.y:(P.__edad?+P.__edad:null),w=semPren(),ta=peTA(),cut=t=>t.length>70?t.slice(0,67)+"…":t;
  const co=A("Complicaciones en embarazos anteriores"),en=A("Enfermedades crónicas"),fo=A("Fórmula obstétrica"),up=A("Último parto"),fa=A("Antecedentes familiares"),an=A("Antropometría y ganancia de peso"),ob=A("Valoración obstétrica");
  e.a0=co?"Registrado: "+cut(co):FO(l=>A(l)).previos===0?"Primera gestación: no aplica":"Sin dato en «Complicaciones en embarazos anteriores»";
  const enT=en?"Registrado: "+cut(en):"Sin dato en «Enfermedades crónicas»";e.a1=e.a2=e.a3=enT;
  e.a4=en?"Registrado: "+cut(en):"Sin dato en «Enfermedades crónicas»";if(ta)e.a4+=" · TA de hoy "+ta[0]+"/"+ta[1]+(ta[0]>=140||ta[1]>=90?(w!=null&&w<20?" antes de la semana 20 (sugiere hipertensión crónica)":""):"");
  e.m0=fo?"Fórmula: "+fo.replace(/^Primigestante:\s*/,""):"Sin dato en «Fórmula obstétrica»";
  e.m1=edad!=null?"Tiene "+edad+" años (de los datos de la persona)":"Sin fecha de nacimiento ni edad";
  e.m2=up?"Registrado: "+cut(up):FO(l=>A(l)).partos===0?"Sin partos previos: no aplica":"Sin dato en «Último parto»";
  const im=(an.match(/IMC inicial (\d+[,.]?\d*)/)||an.match(/IMC (\d+[,.]?\d*)/)||[])[1];e.m3=im?"IMC "+im+(/IMC inicial/.test(an)?" (inicial)":""):"Sin peso y talla en «Antropometría»";
  e.m4=fa?"Registrado: "+cut(fa):"Sin dato en «Antecedentes familiares»";
  e.m5=ob?"Registrado: "+cut(ob):"Sin dato en «Valoración obstétrica»";return e}
function peCalc(o){const a=PE_ALTO.filter((_,i)=>o["a"+i]),m=PE_MOD.filter((_,i)=>o["m"+i]),ind=a.length>=1||m.length>=2;return {a,m,ind}}
function peEfectivo(id){let m={};try{m=JSON.parse(S.get(key(id,"pe"))||"{}")||{}}catch(e){}const sg=peSugeridos(),o={};PE_ALTO.forEach((_,i)=>{const k="a"+i;if(m[k]===1||(m[k]!==0&&sg.has(k)))o[k]=1});PE_MOD.forEach((_,i)=>{const k="m"+i;if(m[k]===1||(m[k]!==0&&sg.has(k)))o[k]=1});return o}
/* ---------- Parto y puerperio: opciones y pautas por paso (se aplican sobre la entrevista generada) ---------- */
const IVX={
 "parto::Pinzamiento del cordón cuando deje de latir (habitualmente 2–3 min)":{c:["Normal (2 a 3 min)|Pinzamiento tardío del cordón entre los 2 y 3 minutos, cuando dejó de latir, con recién nacido rosado y vigoroso; corte con material estéril. Cordón con dos arterias y una vena.","Inmediato: reanimación|Pinzamiento inmediato del cordón porque el recién nacido no respiró y requirió reanimación.","Inmediato: placenta|Pinzamiento inmediato del cordón por sospecha de desprendimiento de placenta o placenta previa (sangrado abundante antes de la salida del bebé).","Inmediato: cordón roto|Pinzamiento inmediato por desgarro del cordón umbilical.","Lo hizo la partera|Pinzamiento y corte del cordón realizado por la partera; se verifica ligadura firme y sin sangrado.","No aplica|No aplica: parto no atendido en comunidad."],
  pauta:{t:"Cómo hacerlo",p:["Pon al bebé sobre el abdomen de la mamá, sécalo y cúbrelo mientras esperas.","Pinza cuando el cordón deje de latir, la vena se vea menos llena y el bebé esté rosado: entre 2 y 3 minutos (Res. 3280, p. 284).","Pinza de inmediato si el bebé no respira y necesita reanimación, o si hay desprendimiento de placenta, ruptura uterina, desgarro del cordón o paro materno.","Dos pinzas o ligaduras a unos 3 y 5 cm del ombligo; corta entre ellas con tijera o cuchilla estéril. Si la familia usa un objeto tradicional, que esté hervido.","Dentro del primer minuto: palpa el abdomen (descarta otro bebé) y aplica oxitocina 10 UI IM; si no hay, misoprostol 600 mcg sublingual (manejo activo del alumbramiento, p. 285).","Revisa la placenta completa y el cordón: dos arterias y una vena."],r:"Se realiza pinzamiento tardío del cordón con material estéril y manejo activo del alumbramiento con oxitocina 10 UI IM.",b:"Registrar en la nota"}},
 "parto::Contacto piel a piel sin separar al RN de la madre los primeros 60 min":{c:["Realizado|Contacto piel a piel inmediato y continuo durante los primeros 60 minutos.","Interrumpido por reanimación|Contacto piel a piel interrumpido para reanimación del recién nacido; se reinicia al estabilizarse.","Con el papá o familiar|Contacto piel a piel con el padre o un familiar porque la madre no está estable.","No aplica|No aplica."],
  pauta:{t:"Cómo hacerlo",p:["El bebé desnudo boca abajo sobre el pecho de la mamá, secado, con gorro y cubierto con una manta seca y caliente.","La cara del bebé visible: vigila que respire bien y esté rosado.","No lo separes la primera hora: el peso, la talla y la vitamina K pueden esperar.","No bañarlo en las primeras 24 horas.","Si la mamá no está estable, que el papá o un familiar lo tenga piel a piel.","Si el bebé no respira o está flácido: sepáralo y reanima."],r:"Se realiza contacto piel a piel inmediato durante la primera hora.",b:"Registrar en la nota"}},
 "parto::Lactancia durante el contacto piel a piel":{c:["Inició|Inicia lactancia materna en la primera hora, con buen agarre.","Con ayuda|Inicia lactancia con ayuda; se corrige agarre.","No inició|No inicia lactancia en la primera hora por condición materna o del recién nacido; se apoya en cuanto sea posible.","Contraindicada|Lactancia contraindicada por VIH materno; se da fórmula.","No aplica|No aplica."],
  pauta:{t:"Cómo ayudarla",p:["Espera a que el bebé busque el pecho solo (abre la boca, mueve la cabeza); no lo fuerces.","Buen agarre: boca bien abierta, labio de abajo hacia afuera, toma más areola por debajo y la barbilla toca el pecho.","El calostro es suficiente: no dar agua, aguas aromáticas, panela ni fórmula.","Si la mamá tiene VIH, no se da pecho: fórmula."],r:"Se acompaña el inicio de la lactancia en la primera hora y se verifica el agarre.",b:"Registrar en la nota"}},
 "parto::Puerperio inmediato: signos vitales y sangrado cada 15 min durante 2 horas":{c:["Estable|Puerperio inmediato con controles cada 15 minutos durante 2 horas: signos vitales estables, útero contraído, sangrado escaso.","Sangrado que cede|Sangrado aumentado por útero blando; cede con masaje uterino y vaciamiento vesical. Se continúa vigilancia cada 15 minutos.","Sangrado que no cede|Sangrado aumentado que no cede con masaje uterino: hemorragia posparto; se activa código rojo.","TA alta|TA de 140/90 o más en el puerperio inmediato; se repite en reposo, se indagan cefalea, visión borrosa y epigastralgia y se remite.","Pulso alto o TA baja|Pulso mayor de 100 o TA sistólica menor de 90 (índice de choque de 0,9 o más): se sospecha sangrado; se activa código rojo.","Fiebre|Temperatura de 38 °C o más en el puerperio inmediato; se indaga misoprostol y se vigila."],
  pauta:{t:"Qué vigilar cada 15 minutos por 2 horas (p. 287)",p:["TA, pulso, frecuencia respiratoria, temperatura, conciencia y color de la piel.","Útero: duro como una pelota por debajo del ombligo. Si está blando, masajea.","Sangrado: cuenta y mira las toallas o paños. Si empapa uno en menos de 1 hora, o más de 500 ml, es hemorragia.","Índice de choque (pulso ÷ TA sistólica) de 0,9 o más: alarma aunque la TA esté normal.","Que orine en las primeras 6 horas; la vejiga llena no deja contraer el útero.","No la dejes sola; la familia avisa si se marea o sangra más."],r:"Se vigilan signos vitales, tono uterino y sangrado cada 15 minutos durante las 2 primeras horas.",b:"Registrar en la nota"}},
 "parto::Globo de seguridad, sangrado genital, suturas o episiotomía":{c:["Normal|Globo de seguridad de Pinard presente, sangrado genital escaso, periné íntegro.","Desgarro grado 1|Desgarro perineal grado 1 (piel y mucosa); se sutura, hemostasia adecuada.","Desgarro grado 2|Desgarro perineal grado 2 (compromete músculo del periné); se sutura, hemostasia adecuada.","Útero blando|Útero hipotónico; se realiza masaje uterino y vaciamiento vesical, con buena respuesta.","Desgarro grado 3 o 4|Desgarro perineal grado 3 o 4 (compromete esfínter o mucosa anal); se hace compresión y se remite."],
  pauta:{t:"Qué revisar",p:["Útero duro, redondeado y por debajo del ombligo: es el globo de seguridad.","Si está blando: masaje uterino continuo, vaciar la vejiga y uterotónico; si no cede, es hemorragia (código rojo).","Placenta completa y membranas íntegras; si falta un pedazo, remite.","Revisa el periné con buena luz: desgarros de grado 1 y 2 se suturan si tienes la competencia; grado 3 o 4 (llega al ano), compresión y remite.","La episiotomía no es de rutina (p. 284)."],r:"Se verifica globo de seguridad, sangrado genital e integridad perineal.",b:"Registrar en la nota"}},
 "parto::Escala de alerta temprana obstétrica":{widget:"eat",c:[],
  pauta:{t:"Cómo usar la escala (Anexo 5, p. 338)",p:["Llena los signos vitales: la app suma los puntos.","0: observación de rutina.","1 a 3: observar mínimo cada 4 horas; avisar a la enfermera a cargo.","Un parámetro con 3 o suma de 4 o más: observar cada hora y llamado urgente al médico.","Suma de 6 o más: monitoreo continuo y traslado a cuidado crítico.","En la comunidad, cualquier llamado urgente significa activar el transporte."],r:"",b:""}},
 "parto::Remitir si hay hemorragia, tras estabilizar":{c:["Sin hemorragia|Sin hemorragia posparto; no requiere remisión.","Código rojo y remisión|Hemorragia posparto: se activa código rojo, se estabiliza (2 accesos venosos, cristaloides tibios, uterotónicos, masaje uterino, ácido tranexámico) y se remite acompañada al hospital de referencia.","Remitida por otra causa|Se remite al hospital de referencia por otra complicación del parto o del puerperio."],
  pauta:{t:"Código rojo: qué hacer mientras llega el transporte (p. 291)",p:["Pide ayuda, anota la hora y avisa al hospital de referencia.","Oxígeno a 3 L/min por cánula; piernas elevadas 15 grados; mantenerla caliente.","Dos venas con catéter 14, 16 o 18; sonda vesical.","Cristaloides tibios (cerca de 39 °C) en bolos de 500 ml, revisando cada 5 minutos: conciencia, pulso radial, TA sistólica mayor de 90 y llenado capilar menor de 3 segundos.","Masaje uterino continuo; oxitocina 5 UI IV lenta y 30 UI en 500 ml en 4 horas; si no hay, misoprostol 800 mcg sublingual.","Ácido tranexámico 1 g IV en 10 minutos dentro de las primeras 3 horas; segunda dosis si sigue sangrando a los 30 minutos.","Traje antichoque no neumático si lo tienes.","Remite acompañada, con la nota de lo que se hizo y la hora."],r:"",b:""}},
 "parto::Involución uterina y aspecto de los loquios":{c:["Normal|Útero contraído e involucionando según los días posparto, loquios en cantidad normal, sin mal olor.","Subinvolución|Útero blando o más alto de lo esperado; se remite a medicina.","Loquios fétidos|Loquios con mal olor; se remite a medicina."],
  pauta:{t:"Qué es normal",p:["El primer día el útero está a la altura del ombligo y baja más o menos 1 cm por día.","Loquios rojos los primeros 3 a 4 días, luego rosados o cafés y al final blanco-amarillentos (hasta 4 a 6 semanas).","Alarma: útero blando o doloroso, sangrado que aumenta, coágulos grandes o mal olor."],r:"Se valora involución uterina y características de los loquios.",b:"Registrar en la nota"}},
 "parto::Fiebre, taquicardia, taquipnea, útero doloroso, loquios fétidos":{c:["Sin signos|Sin fiebre, taquicardia ni taquipnea; útero no doloroso; loquios sin mal olor.","Signos de infección|Presenta fiebre, taquicardia, útero doloroso o loquios fétidos; sospecha de infección puerperal; se remite hoy.","Fiebre primeras 24 h|Temperatura de 38 °C o más en las primeras 24 horas; se indaga misoprostol y se vigila."],
  pauta:{t:"Infección puerperal",p:["Fiebre es más de 38 °C después de las primeras 24 horas (p. 287).","Pregunta si recibió misoprostol: puede dar fiebre.","Busca el foco: útero doloroso y loquios con mal olor (endometritis), orina, mamas, herida o episiotomía, piernas.","Con fiebre y pulso o respiración rápidos: sospecha de sepsis, remisión el mismo día."],r:"Se buscan signos de infección puerperal.",b:"Registrar en la nota"}},
 "parto::Deambulación temprana y alimentación":{c:["Realizado|Deambulación temprana acompañada y alimentación sin restricción; micción espontánea.","No ha orinado|Sin micción espontánea a las 6 horas; se da analgesia y se estimula con agua tibia; si no orina, se remite para sondaje."],
  pauta:{t:"Qué decirle",p:["Levantarse pronto, la primera vez acompañada (puede marearse).","Comer y tomar líquidos sin restricción; respeta las comidas de la dieta tradicional del posparto si son nutritivas.","Debe orinar en las primeras 6 horas; si no, analgésico, ir al baño relajada o baño con agua tibia (p. 288)."],r:"Se promueve deambulación temprana, alimentación e hidratación.",b:"Registrar en la nota"}},
 "parto::Sangrado y olor de los loquios, fiebre, dolor":{c:["Niega|Loquios en disminución sin mal olor; niega fiebre y dolor.","Refiere|Refiere síntomas; se describen a continuación: ","Sin hallazgos|Sin hallazgos de alarma."],
  pauta:{t:"Qué preguntar",p:["¿El sangrado va disminuyendo o aumenta? ¿Bota coágulos grandes?","¿Huele mal?","¿Ha tenido fiebre o escalofríos?","¿Dolor en la barriga, los puntos o la herida?","Cualquier sí: examina y, si hay infección o sangrado, remite."],r:"",b:""}},
 "parto::Cefalea, visión, micción, mamas, piernas":{c:["Niega|Niega cefalea, alteraciones visuales, molestias urinarias, dolor mamario y dolor en piernas.","Refiere|Refiere síntomas; se describen a continuación: ","Sin hallazgos|Sin hallazgos."],
  pauta:{t:"Por qué se pregunta",p:["Dolor de cabeza, visión borrosa o luces: preeclampsia posparto (puede aparecer hasta 6 semanas después). Toma la TA.","Ardor al orinar o no poder orinar: infección urinaria o retención.","Senos rojos, calientes y dolorosos: mastitis; seguir dando pecho y remitir.","Pierna hinchada o dolorosa de un solo lado, falta de aire o dolor en el pecho: trombosis, remisión urgente."],r:"",b:""}},
 "parto::Lactancia y cuidado del recién nacido":{c:["Adecuada|Lactancia materna exclusiva a libre demanda con buen agarre; cuidados del RN adecuados.","Dificultad|Refiere dificultad con la lactancia; se observa una toma, se corrige el agarre y se educa.","Mixta|Da pecho y otros líquidos o fórmula; se educa en lactancia exclusiva."],
  pauta:{t:"Qué revisar",p:["Pecho de 8 a 12 veces en el día y la noche; moja 6 o más pañales al día desde el día 5.","Observa una toma: boca bien abierta, labio de abajo hacia afuera, sin dolor en el pezón.","Cordón limpio y seco; no ponerle nada.","Signos de peligro del bebé: no mama, fiebre o frío, piel amarilla, respira rápido, ombligo rojo o con pus, convulsiona: consulta ya."],r:"Se verifica la lactancia y se educa en cuidado del recién nacido y signos de peligro.",b:"Registrar que se educó"}},
 "parto::Sexualidad en el posparto":{c:["Informada|Se brinda información sobre sexualidad en el posparto.","Inquietudes|Refiere inquietudes sobre la sexualidad en el posparto; se resuelven dudas y se orienta."],
  pauta:{t:"Qué decirle",p:["Puede retomar las relaciones cuando se sienta lista, sin dolor y cuando haya cedido el sangrado.","Puede quedar embarazada antes de que le vuelva la regla: necesita un método desde antes.","La lactancia puede dar resequedad: lubricante a base de agua.","Nadie la puede obligar; pregunta con tacto si se siente segura en casa."],r:"Se brinda información sobre sexualidad en el posparto.",b:"Registrar que se educó"}},
 "parto::Intención reproductiva (próximo embarazo en no menos de 18 meses)":{c:["No desea más|No desea más hijos por ahora; se orienta en método.","Desea más|Desea otro hijo; se recomienda esperar mínimo 18 meses.","No sabe|Aún no decide; se orienta."],
  pauta:{t:"Qué decirle",p:["Esperar al menos 18 meses antes del próximo embarazo da tiempo al cuerpo y protege al bebé que nace (menos bajo peso y parto prematuro).","Con la respuesta, pasa a la asesoría del método."],r:"Se indaga intención reproductiva y se recomienda intervalo intergenésico mínimo de 18 meses.",b:"Registrar que se educó"}},
 "parto::Durante el último mes, ¿se ha preocupado porque con frecuencia se sentía triste, deprimida o sin esperanza?":{
  pauta:{t:"Cómo preguntar",p:["A solas y con calma; normaliza: «a muchas mamás les pasa».","Si responde sí a las dos preguntas: psicología y psiquiatría (p. 287). Aplica Edimburgo si la tienes: más de 12 puntos, seguimiento por salud mental.","Si menciona querer hacerse daño o hacerle daño al bebé: no la dejes sola y remite hoy."],r:"",b:""}},
 "parto::Durante el último mes, ¿se ha preocupado porque con frecuencia sentía poco interés por realizar actividades y además no sentía que le proporcionaran placer?":{pauta:{t:"Si responde sí a las dos",p:["Dos respuestas afirmativas: psicología y psiquiatría para confirmar el diagnóstico (Res. 3280, p. 287).","Aplica Edimburgo si la tienes: más de 12 puntos, seguimiento por salud mental después del alta.","Pregunta si ha pensado en hacerse daño o hacerle daño al bebé: si es así, no la dejes sola y remite hoy."],r:"",b:""}},
 "parto::Signos vitales y TA":{campos:"vitalesP",c:["Normal|Signos vitales dentro de lo normal.","TA alta|TA de 140/90 o más: posible preeclampsia posparto; se remite.","Fiebre|Temperatura de 38 °C o más: se buscan focos de infección y se remite.","Taquicardia|Pulso mayor de 100: se busca sangrado o infección y se remite."],
  pauta:{t:"Valores de alarma",p:["TA de 140/90 o más: preeclampsia posparto, remitir; 160/110 o más, urgente.","Temperatura de 38 °C o más después de las 24 horas: buscar infección.","Pulso mayor de 100 o TA sistólica menor de 90: sangrado o infección."],r:"",b:""}},
 "parto::Involución uterina y loquios":{c:["Normal|Útero involucionado acorde a los días posparto, no doloroso; loquios normales sin mal olor.","Alterado|Útero doloroso, subinvolucionado o loquios fétidos; se remite a medicina."],
  pauta:{t:"Qué es normal",p:["Al día 3 a 5 el útero está unos dedos por debajo del ombligo, firme y no duele.","Loquios rosados o cafés, en disminución, sin mal olor."],r:"",b:""}},
 "parto::Periné, episiotomía o herida de cesárea":{c:["Normal|Periné / herida limpia, sin signos de infección ni dehiscencia.","Alterado|Herida con signos de infección o dehiscencia; se remite a medicina."],
  pauta:{t:"Qué buscar",p:["Enrojecimiento, hinchazón, morado, salida de pus o que los puntos se abran.","Dolor que aumenta en vez de disminuir.","Higiene con agua limpia; no aplicar hierbas ni polvos en la herida."],r:"",b:""}},
 "parto::Mamas y pezones":{c:["Normal|Mamas blandas o llenas, sin enrojecimiento; pezones íntegros.","Grietas|Grietas en pezón; se corrige agarre y se indica aplicar leche materna en el pezón.","Congestión|Congestión mamaria; se orienta en extracción manual y tomas frecuentes.","Mastitis|Zona roja, caliente y dolorosa, con o sin fiebre; se indica no suspender la lactancia y se remite a medicina."],
  pauta:{t:"Qué hacer",p:["Grietas: casi siempre por mal agarre; corrígelo y que se ponga su misma leche en el pezón.","Congestión: dar pecho más seguido y sacar un poco de leche a mano antes de la toma.","Mastitis (rojo, caliente, fiebre): no suspender el pecho y remitir a medicina."],r:"",b:""}},
 "parto::Miembros inferiores":{c:["Normal|Miembros inferiores sin edema asimétrico ni dolor.","Edema de una pierna|Edema o dolor en una sola pierna: sospecha de trombosis; remisión urgente.","Edema de ambas|Edema de ambas piernas; se toma TA y se buscan signos de preeclampsia."],
  pauta:{t:"Qué buscar",p:["Una pierna más hinchada, dura, roja o dolorosa que la otra: trombosis, remisión urgente.","Edema de las dos piernas con TA alta: preeclampsia."],r:"",b:""}},
 "parto::Rh: anti-D en 72 h si es Rh negativo con RN Rh positivo":{c:["Rh positivo|Madre Rh positivo: no requiere inmunoglobulina anti-D.","Anti-D aplicada|Madre Rh negativo con RN Rh positivo: se aplica inmunoglobulina anti-D dentro de las 72 horas.","Gestionar|Madre Rh negativo: se gestiona inmunoglobulina anti-D antes de 72 horas posparto.","Desconocido|Hemoclasificación materna desconocida; se solicita."],
  pauta:{t:"Qué hacer",p:["Mamá: su hemoclasificación debe estar en el carné desde el control prenatal. Si es Rh negativo, también el Coombs indirecto (dice si ya está sensibilizada).","Bebé: sangre de cordón con técnica de «asa» (p. 303): después de que salga la placenta, pinza un segmento del cordón entre dos pinzas, córtalo y deja salir esa sangre al tubo. No la tomes del lado de la placenta. Si no fue posible, sangre de vena periférica del bebé. Hemoclasificación y Coombs directo.","Tubos: tapa lila (EDTA) de 2 a 4 ml para hemoclasificación y Coombs directo; tapa roja para el Coombs indirecto de la mamá. Usa los que pida tu laboratorio.","Marca el tubo con «sangre de cordón», nombre de la mamá, fecha y hora. Si no hay laboratorio, envíala refrigerada (2 a 8 °C, sin congelar) en el primer transporte.","Si la mamá es Rh negativo, no está sensibilizada y el bebé es Rh positivo (o no se sabe), necesita inmunoglobulina anti-D antes de las 72 horas (p. 288). La dosis usual es 300 mcg IM y la indica medicina.","Si no la tienes en el puesto, remítela a tiempo: pasadas las 72 horas pierde efecto.","Coombs directo positivo en el bebé: vigila ictericia y remite a pediatría.","Anota en el carné si la recibió."],r:"",b:""}},
 "parto::Resultados maternos de VIH, sífilis, hepatitis B, toxoplasma, estreptococo B":{c:["Negativos|Resultados maternos de VIH, sífilis, hepatitis B y toxoplasma negativos.","VIH positivo|Madre con VIH: no se da lactancia, profilaxis al recién nacido y remisión inmediata.","Sífilis positiva|Madre con sífilis: tratamiento materno y de la pareja; recién nacido a valoración con VDRL.","Hepatitis B positiva|Madre HBsAg positiva: vacuna y gammaglobulina al recién nacido en las primeras 12 horas.","Sin resultados|Sin resultados maternos del tercer trimestre; se realizan pruebas rápidas."],
  pauta:{t:"Qué hacer si alguno es positivo",p:["VIH: no dar pecho, profilaxis al bebé y remisión inmediata.","Sífilis: tratar a la mamá y su pareja; el bebé necesita valoración y VDRL.","Hepatitis B: vacuna y gammaglobulina al bebé en las primeras 12 horas.","Toxoplasma IgM positiva: pediatría.","Estreptococo B positivo sin antibiótico en el parto: vigilar al bebé 48 horas.","Si no hay resultados del tercer trimestre: pruebas rápidas de VIH y sífilis antes del alta."],r:"",b:""}},
 "parto::Vacunas pendientes de la gestación":{c:["Completas|Esquema de vacunación de la gestación completo.","Se aplica Td|Se aplica Td/Tdap pendiente de la gestación.","Se aplica influenza|Se aplica vacuna de influenza pendiente de la gestación.","Pendiente|Quedan vacunas pendientes de la gestación; se programan en el control posparto."],
  pauta:{t:"Qué revisar",p:["Td o Tdap e influenza: si faltaron en el embarazo, el posparto es el momento (p. 288).","Revisa el carné y el de vacunas del bebé en la misma visita."],r:"",b:""}},
 "parto::Riesgo tromboembólico":{c:["Bajo|Sin factores de riesgo tromboembólico; se promueve deambulación e hidratación.","Con factores|Tiene factores de riesgo tromboembólico; se remite a medicina para definir profilaxis."],
  pauta:{t:"Factores de riesgo",p:["Cesárea, edad mayor de 35, IMC de 30 o más, 3 o más partos, preeclampsia, hemorragia o transfusión, infección, várices grandes, fumar, inmovilidad o trombosis previa.","Con factores: medicina decide la profilaxis.","Para todas: caminar pronto y tomar líquidos.","Alarma: pierna hinchada de un lado, falta de aire, dolor en el pecho."],r:"",b:""}},
 "parto::Método anticonceptivo antes del alta: DIU posparto, implante, inyectable trimestral, oral de solo progestina, ligadura, condones":{c:["Implante|Se aplica implante subdérmico antes del alta.","DIU posparto|Se inserta DIU posparto en las primeras 48 horas.","Inyectable trimestral|Se aplica acetato de medroxiprogesterona.","Oral solo progestina|Se entrega anticonceptivo oral de solo progestina con indicaciones.","Ligadura|Se realiza / se gestiona oclusión tubárica bilateral.","Condones|Se entregan condones (doble protección).","No acepta|No acepta método; se brinda asesoría."],
  pauta:{t:"Qué hacer",p:["Parte del método que eligió en el control prenatal (está en el carné).","Primero los más efectivos: implante, DIU, ligadura.","DIU: solo en las primeras 48 horas o después de 4 semanas.","Consentimiento informado y registro en la historia.","Condones para doble protección contra ITS."],r:"",b:""}},
 "parto::Entrega del método con cobertura de 3 meses":{c:["Píldoras: 3 meses|Se entregan 3 ciclos (sobres) de anticonceptivo oral de solo progestina, uno por mes, con orden de control a los 3 meses.","Inyectable: aplicada|Se aplica acetato de medroxiprogesterona; cubre 3 meses. Se anota en el carné la fecha de la próxima dosis.","Condones: 3 meses|Se entregan condones suficientes para 3 meses, con instrucciones de uso.","Implante o DIU|No requiere entrega: implante o DIU de larga duración; se da orden de control según el método.","No aceptó método|No acepta método anticonceptivo; se brinda asesoría y se entregan condones."],
  pauta:{t:"Qué significa",p:["Que la mamá salga con el método en la mano para 3 meses, sin tener que volver pronto a buscarlo (p. 289).","Así no queda desprotegida en las semanas en que es más fácil un embarazo muy seguido.","Píldoras: 3 sobres (uno por mes).","Inyección trimestral: la aplicación de hoy ya cubre 3 meses; anota la fecha de la próxima.","Condones: los suficientes para 3 meses.","Implante y DIU duran años: no hay que entregar nada, solo la orden de control.","Siempre con la orden de control según el método y explicándole cuándo volver."],r:"",b:""}},
 "parto::Anticoncepción de emergencia: cuándo usarla":{c:["Informada|Se informa sobre anticoncepción de emergencia y cuándo usarla."],
  pauta:{t:"Cuándo usarla",p:["Relación sin método o con el método mal usado.","Condón roto o que se salió, DIU expulsado, olvido de pastillas.","Violencia sexual sin método.","Levonorgestrel 1,5 mg en una sola dosis, lo antes posible (mejor en las primeras 72 horas)."],r:"Se informa sobre anticoncepción de emergencia y sus indicaciones.",b:"Registrar que se educó"}},
 "parto::Analgesia: ibuprofeno 600 mg o acetaminofén sin pasar de 4.000 mg/día":{c:["Ibuprofeno|Se formula ibuprofeno 600 mg vía oral cada 8 horas por 3 días.","Acetaminofén|Se formula acetaminofén 1 g vía oral cada 8 horas por 3 días (máximo 4.000 mg al día).","No requiere|No requiere analgesia."],
  pauta:{t:"Qué decirle",p:["Los cólicos del útero son normales y ceden al final de la primera semana (p. 288).","Ibuprofeno 600 mg o acetaminofén sin pasar de 4 g al día; los dos son seguros con la lactancia.","Dolor que aumenta o con fiebre: consultar."],r:"",b:""}},
 "parto::Educación: lactancia exclusiva, alimentación, actividad física progresiva, sueño, violencias y cómo denunciarlas":{c:["Realizada|Se educa en lactancia exclusiva, alimentación, actividad física progresiva, sueño, signos de alarma, violencias y rutas de denuncia."],
  pauta:{t:"Qué decirle",p:["Solo pecho hasta los 6 meses, a libre demanda.","Comer variado y tomar suficiente agua.","Caminar un poco cada día y aumentar de a poco.","Dormir cuando duerma el bebé; que la familia ayude.","Nadie la puede golpear, humillar ni obligar: dónde denunciar (Comisaría, Policía, línea 155).","Signos de alarma: sangrado abundante o con mal olor, fiebre, dolor de cabeza o ver luces, convulsión, dolor en el pecho o falta de aire, pierna hinchada, senos rojos y dolorosos, tristeza que no la deja cuidar al bebé."],r:"Se brinda educación en lactancia exclusiva, alimentación, actividad física, sueño, signos de alarma, violencias y mecanismos de denuncia.",b:"Registrar que se educó"}},
 "parto::Registro de nacido vivo y registro civil":{c:["Realizado|Se diligencia certificado de nacido vivo y se orienta para registro civil.","Pendiente|Certificado de nacido vivo pendiente; se gestiona con la institución."],
  pauta:{t:"Qué hacer",p:["Diligencia el certificado de nacido vivo si atendiste el parto.","Si lo atendió la partera, gestiónalo con tu institución.","Orienta a la familia para el registro civil cuanto antes: lo necesita para la afiliación y las vacunas."],r:"",b:""}}

/* Escala obstétrica de alerta temprana (Res. 3280, Anexo 5, p. 338) */
function eatPuntos(v){const n=k=>{const x=parseFloat(String(v[k]||"").replace(",","."));return isNaN(x)?null:x},P={},s=n("pas"),d=n("pad"),fr=n("fr"),fc=n("fc"),t=n("t");
  if(s!=null)P.pas=s<80?3:s<90?2:s<140?0:s<150?1:s<160?2:3;if(d!=null)P.pad=d<90?0:d<100?1:d<110?2:3;
  if(fr!=null)P.fr=fr<10?3:fr<18?0:fr<25?1:fr<30?2:3;if(fc!=null)P.fc=fc<60?3:fc<=110?0:fc<150?2:3;
  if(v.o2)P.o2=v.o2==="aire"?0:v.o2==="24"?1:3;if(t!=null)P.t=t<34?3:t<=35?1:t<38?0:t<39?1:3;if(v.cc)P.cc=v.cc==="alerta"?0:3;
  const vals=Object.values(P),sum=vals.reduce((a,b)=>a+b,0),tres=vals.some(z=>z===3);
  const nivel=!vals.length?null:sum>=6?{c:"high",t:"Sumatoria ≥ 6: monitoreo continuo y llamado emergente a cuidado crítico. Activa el traslado ya."}:(tres||sum>=4)?{c:"high",t:(tres?"Un parámetro con 3":"Sumatoria ≥ 4")+": observar cada hora y llamado urgente al médico. En la comunidad: activa el transporte."}:sum>=1?{c:"low",t:"Sumatoria 1 a 3: observar mínimo cada 4 horas; avisar a la enfermera a cargo."}:{c:"low",t:"0: observación de rutina."};
  return {P,sum,nivel}}
WIDGET.eat={html:id=>{let v={};try{v=JSON.parse(S.get(key(id,"eat"))||"{}")||{}}catch(e){}const f=(k,l,ph)=>`<label class="bfl"><span>${l}</span><input data-eat="${k}" inputmode="decimal" placeholder="${ph}" value="${esc(v[k]||"")}"><small data-eatp="${k}" style="font-size:.74rem;color:var(--muted)"></small></label>`;
  return `<div class="pgrid">${f("pas","TA sistólica (mmHg)","110")}${f("pad","TA diastólica (mmHg)","70")}${f("fc","Frecuencia cardiaca (lpm)","82")}${f("fr","Frecuencia respiratoria (rpm)","16")}${f("t","Temperatura (°C)","36,8")}
   <label class="bfl"><span>Oxígeno para saturar > 95 %</span><select data-eat="o2"><option value="">—</option><option value="aire" ${v.o2==="aire"?"selected":""}>Aire ambiente</option><option value="24" ${v.o2==="24"?"selected":""}>24 a 39 %</option><option value="40" ${v.o2==="40"?"selected":""}>40 % o más</option></select><small data-eatp="o2" style="font-size:.74rem;color:var(--muted)"></small></label>
   <label class="bfl"><span>Estado de conciencia</span><select data-eat="cc"><option value="">—</option><option value="alerta" ${v.cc==="alerta"?"selected":""}>Alerta</option><option value="no" ${v.cc==="no"?"selected":""}>No alerta</option></select><small data-eatp="cc" style="font-size:.74rem;color:var(--muted)"></small></label></div>
   <div class="risk"><span class="score" id="eat-s">0</span><span class="pill low" id="eat-p">Llena los signos</span></div>`},
 txt:id=>{let v={};try{v=JSON.parse(S.get(key(id,"eat"))||"{}")||{}}catch(e){}const r=eatPuntos(v);if(!r.nivel)return"";const L={pas:"PAS",pad:"PAD",fc:"FC",fr:"FR",t:"T",o2:"O2",cc:"conciencia"},vv=k=>k==="o2"?(v.o2==="aire"?"aire ambiente":v.o2==="24"?"24-39 %":"≥ 40 %"):k==="cc"?(v.cc==="alerta"?"alerta":"no alerta"):v[k];
  return "Escala obstétrica de alerta temprana: "+Object.keys(r.P).map(k=>L[k]+" "+vv(k)+" ("+r.P[k]+")").join(", ")+". Total "+r.sum+" puntos. "+r.nivel.t},
 wire:(id,save)=>{const up=()=>{const v={};document.querySelectorAll("[data-eat]").forEach(e=>{if(e.value)v[e.dataset.eat]=e.value});S.set(key(id,"eat"),JSON.stringify(v));const r=eatPuntos(v);
   document.querySelectorAll("[data-eatp]").forEach(e=>{const p=r.P[e.dataset.eatp];e.textContent=p==null?"":p+" punto"+(p===1?"":"s");e.style.color=p>=3?"var(--miss)":p>0?"#9a6700":"var(--muted)"});
   $("eat-s").textContent=r.sum;$("eat-p").textContent=r.nivel?r.nivel.t:"Llena los signos";$("eat-p").className="pill "+(r.nivel?r.nivel.c:"low");save()};
  document.querySelectorAll("[data-eat]").forEach(e=>e.addEventListener(e.tagName==="SELECT"?"change":"input",up));up()}};
WIDGET.preecl={html:id=>{const o=peEfectivo(id),sg=peSugeridos();
   const ev=peEvidencia(),li=(k,t)=>`<li><input type="checkbox" id="pe${k}" data-pe="${k}" ${o[k]?"checked":""}><label for="pe${k}">${esc(t)}${sg.has(k)?' <small style="color:var(--accent);font-weight:700">sugerido</small>':""}<br><small class="note-src" style="font-weight:400">${esc(ev[k]||"")}</small></label></li>`;
   const ta=peTA(),w=semPren(),alta=ta&&(ta[0]>=140||ta[1]>=90);
   return `${alta&&(w==null||w>=20)?`<div class="box miss"><h3>Presión alta HOY: ${ta[0]}/${ta[1]}</h3><p style="margin:0">${w==null?"Sin edad gestacional registrada. ":"Con "+Math.floor(w)+" semanas, "}esto no es un criterio de riesgo: es sospecha de preeclampsia actual. ${ta[0]>=160||ta[1]>=110?"Con ≥ 160/110 llévala HOY a un servicio hospitalario.":"Repite la toma en reposo; si se confirma, remítela hoy a un servicio hospitalario (Res. 3280, p. 271)."} Pregunta por dolor de cabeza, ver luces, dolor en la boca del estómago e hinchazón.</p></div>`:""}<div class="risk"><span class="pill low" id="pe-p">Sin indicación</span></div><div class="btns" style="margin:0"><button type="button" class="btn" id="pe-sug" style="flex:none">Volver a marcar lo sugerido</button></div>
   <ul class="hh"><li class="grp">Criterios de ALTO riesgo (basta 1)</li>${PE_ALTO.map((t,i)=>li("a"+i,t)).join("")}<li class="grp">Criterios MODERADOS (se necesitan 2)</li>${PE_MOD.map((t,i)=>li("m"+i,t)).join("")}</ul><div class="box warn" id="pe-c"></div>`},
 txt:id=>{const o=peEfectivo(id);const r=peCalc(o),w=semPren();if(!r.a.length&&!r.m.length)return"Sin criterios de riesgo para preeclampsia.";
   return "Criterios de riesgo de preeclampsia: "+(r.a.length?"alto: "+r.a.join(", ").toLowerCase()+". ":"")+(r.m.length?"moderados: "+r.m.join(", ").toLowerCase()+". ":"")+(r.ind?"Cumple indicación de ácido acetilsalicílico 75–100 mg/día"+(w!=null&&w<12?" desde la semana 12":"")+" hasta el parto (Res. 3280); se remite a medicina para su formulación.":"No cumple indicación de ácido acetilsalicílico (1 criterio moderado); vigilancia de TA en cada control.")},
 wire:(id,save)=>{const up=()=>{const o={},m={},sg=peSugeridos();document.querySelectorAll("[data-pe]").forEach(c=>{const k=c.dataset.pe;if(c.checked)o[k]=1;if(c.checked!==sg.has(k))m[k]=c.checked?1:0});S.set(key(id,"pe"),JSON.stringify(m));const r=peCalc(o),w=semPren();
     $("pe-p").textContent=r.ind?"Indicación de aspirina: remitir a medicina":(r.a.length||r.m.length)?"1 moderado: sin indicación":"Sin criterios";$("pe-p").className="pill "+(r.ind?"high":"low");
     $("pe-c").innerHTML=r.ind?`<p style="margin:0"><b>Qué hacer:</b> ácido acetilsalicílico 75–100 mg cada noche ${w!=null&&w<12?"desde la semana 12 ":""}hasta el parto. Lo formula medicina: remítela con la indicación. Toma la TA en cada contacto y repasa con ella los signos de alarma (dolor de cabeza, ver luces, hinchazón, dolor en la boca del estómago).${w!=null&&w>=36?" Ya está cerca del término: confírmalo con medicina.":""}</p>`:`<p style="margin:0">${r.m.length?"Con 1 criterio moderado no está indicada la aspirina; vigila la TA en cada control.":"Sin criterios: control habitual de TA en cada consulta."}</p>`;save()};
   document.querySelectorAll("[data-pe]").forEach(c=>c.onchange=up);$("pe-sug").onclick=()=>{S.set(key(id,"pe"),"{}");const sg=peSugeridos();document.querySelectorAll("[data-pe]").forEach(c=>c.checked=sg.has(c.dataset.pe));up()};up()}};
/* ---------- Bloque fijo de educación PAMI (plantilla ESE) ---------- */
const EDU_PAMI = `EDUCACIÓN
Se brinda educación clara, comprensible y culturalmente respetuosa, explicada de manera verbal y reforzada con material educativo:
- Importancia del control prenatal: el control periódico y oportuno permite identificar riesgos, prevenir complicaciones maternas y fetales, detectar enfermedades de manera temprana y garantizar una atención segura durante la gestación, el parto y el puerperio.
- Atención del parto institucional: importancia de que el parto sea atendido en una institución de salud, con personal capacitado y acceso a atención oportuna ante complicaciones de la madre o el recién nacido.
- Signos y síntomas de alarma: consultar de inmediato por sangrado vaginal, salida de líquido por vagina, disminución o ausencia de movimientos fetales, cefalea persistente, visión borrosa, zumbidos en los oídos, dolor epigástrico, edemas progresivos, fiebre, síntomas urinarios, convulsiones o cualquier otro síntoma que genere alarma.
- Alimentación saludable: dieta balanceada, variada y suficiente, rica en proteínas, frutas, verduras, hierro, calcio y líquidos, acorde a su cultura y disponibilidad de alimentos.
- Actividad física y descanso: actividad física moderada según tolerancia, evitar esfuerzos excesivos, descanso adecuado.
- Preparación para el trabajo de parto: etapas del trabajo de parto, respiración, acompañamiento y señales de inicio.
- Lactancia materna: exclusiva durante los primeros seis (6) meses y complementaria hasta los dos (2) años o más.
- Prevención del consumo de sustancias: riesgos del alcohol, tabaco y sustancias psicoactivas en gestación y lactancia, y de la automedicación.
- Higiene y autocuidado, y prevención de infecciones respiratorias.

INFORMACIÓN SOBRE INTERRUPCIÓN VOLUNTARIA DEL EMBARAZO (IVE)
Se brinda información clara, completa y sin inducción sobre el derecho a la IVE, conforme a la Sentencia C-055 de 2022 y la Resolución 051 de 2023: es un derecho hasta la semana veinticuatro (24) por la sola voluntad de la mujer; después de la semana 24 procede cuando el embarazo represente riesgo para su vida o salud física o mental, sea resultado de violencia sexual, incesto o inseminación no consentida, o exista grave malformación fetal que haga inviable la vida extrauterina. El acceso debe ser oportuno, seguro, confidencial y sin barreras.

CONSEJERÍA EN PLANIFICACIÓN FAMILIAR PARA EL EGRESO
Se brinda consejería integral sobre los métodos anticonceptivos disponibles, su mecanismo de acción, efectividad, duración, efectos secundarios y contraindicaciones, y sobre la importancia de la planificación en el posparto. La elección es libre, voluntaria e informada.

INVITACIÓN AL CURSO DE PREPARACIÓN PARA LA MATERNIDAD Y LA PATERNIDAD
Se invita a la gestante y a su pareja o red de apoyo al curso. Se entrega volante con las fechas programadas.`;

function pD(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[a,b,c]=s.split("-").map(Number);return new Date(Date.UTC(a,b-1,c))}

function egT(n){return Math.floor(n/7)+" semanas y "+(n%7)+" días"}
function calcular(x,fechaStr){
  const r={},f=pD(fechaStr);if(!f||!x)return r;
  const fum=pD(x.fum);
  if(fum){const d=Math.round((f-fum)/DAY);if(d>=0&&d<320){r.egFum=d;r.fppFum=new Date(fum.getTime()+280*DAY)}}
  const fe=pD(x.eco_fecha);
  if(fe&&Number.isFinite(+x.eco_semanas)&&x.eco_semanas!==null&&x.eco_semanas!==""){const a=(+x.eco_semanas)*7+(Number.isFinite(+x.eco_dias)?+x.eco_dias:0);const d=a+Math.round((f-fe)/DAY);if(d>=0&&d<320){r.egEco=d;r.fppEco=new Date(f.getTime()+(280-d)*DAY)}}
  const eco=r.egEco!=null&&(x.fum_confiable===false||r.egFum==null);
  r.eg=eco?r.egEco:r.egFum;r.fpp=eco?r.fppEco:r.fppFum;r.metodo=r.eg==null?null:(eco?"ecografía":"FUM");
  const t=+x.talla_m;
  if(t>1&&t<2.2){if(+x.peso_kg>25)r.imc=(+x.peso_kg)/(t*t);if(+x.peso_pre_kg>25)r.imcPre=(+x.peso_pre_kg)/(t*t)}
  if(+x.peso_kg>25&&+x.peso_pre_kg>25)r.gan=(+x.peso_kg)-(+x.peso_pre_kg);
  return r;
}
function metaGanancia(imc){if(imc==null)return null;if(imc<20)return"12 a 18 kg";if(imc<25)return"10 a 13 kg";if(imc<30)return"7 a 10 kg";return"6 a 7 kg"}
function calcTexto(r){const L=[];
  if(r.egFum!=null)L.push("EG por FUM: "+egT(r.egFum)+"; FPP por FUM: "+fmt(r.fppFum));
  if(r.egEco!=null)L.push("EG por ecografía (actualizada): "+egT(r.egEco)+"; FPP por ecografía: "+fmt(r.fppEco));
  if(r.metodo)L.push("EG que se usa en la nota: "+egT(r.eg)+" por "+r.metodo);
  if(r.imcPre!=null)L.push("IMC pregestacional/primer control: "+r.imcPre.toFixed(1)+" kg/m² (meta de ganancia total: "+metaGanancia(r.imcPre)+")");
  if(r.imc!=null)L.push("IMC actual: "+r.imc.toFixed(1)+" kg/m²");
  if(r.gan!=null)L.push("Ganancia de peso acumulada: "+r.gan.toFixed(1)+" kg");
  return L.join("\n")}
function chipsCalc(r){const o=[];
  if(r.eg!=null)o.push(["EG",Math.floor(r.eg/7)+"+"+(r.eg%7)+" ("+r.metodo+")"]);
  if(r.fpp)o.push(["FPP",fmt(r.fpp)]);
  if(r.imcPre!=null)o.push(["IMC pre",r.imcPre.toFixed(1)]);
  if(r.imc!=null)o.push(["IMC actual",r.imc.toFixed(1)]);
  if(r.imcPre!=null)o.push(["Meta ganancia",metaGanancia(r.imcPre)]);
  if(r.gan!=null)o.push(["Ganancia",r.gan.toFixed(1)+" kg"]);
  return o.map(([k,v])=>`<span class="chip"><b>${esc(k)}</b>${esc(v)}</span>`).join("")}

}
