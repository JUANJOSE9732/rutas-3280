<style>
/* Layout: panel de rutas (inicio) → módulo con Guía / Herramientas / Nota, una columna pensada para el celular */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#13241E; --muted:#56685F; --line:#D5DFD9;
  --accent:#1D6B52; --accent-ink:#FFFFFF; --accent-soft:#E1EFE8;
  --rose:#9C3D5B; --rose-soft:#F8E6EC; --sky:#2B5F8A; --sky-soft:#E3EEF7;
  --warn:#8A5A00; --warn-bg:#FFF3D6; --warn-line:#EBCB82;
  --miss:#7A2E3A; --miss-bg:#FBE9EC; --miss-line:#E9B8C1;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1714; --surface:#16221E; --ink:#E4EEE9; --muted:#9DB0A7; --line:#2A3A34;
  --accent:#5CC39A; --accent-ink:#06140F; --accent-soft:#1B3229;
  --rose:#F0A3BC; --rose-soft:#33202A; --sky:#8FC1EA; --sky-soft:#1A2A38;
  --warn:#F2C46B; --warn-bg:#2E2512; --warn-line:#5E4A1C;
  --miss:#F2A3B0; --miss-bg:#2E1A1E; --miss-line:#5C2C35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714; --surface:#16221E; --ink:#E4EEE9; --muted:#9DB0A7; --line:#2A3A34;
  --accent:#5CC39A; --accent-ink:#06140F; --accent-soft:#1B3229;
  --rose:#F0A3BC; --rose-soft:#33202A; --sky:#8FC1EA; --sky-soft:#1A2A38;
  --warn:#F2C46B; --warn-bg:#2E2512; --warn-line:#5E4A1C;
  --miss:#F2A3B0; --miss-bg:#2E1A1E; --miss-line:#5C2C35; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:18px 72px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-weight:800;font-size:1.7rem;line-height:1.1;letter-spacing:-.01em}
h2{font-weight:800;font-size:1.25rem}
h3{font-weight:600;font-size:1.02rem}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.lab{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
button{font:inherit;cursor:pointer}
textarea:focus,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* panel */
.finder{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);flex:1 1 120px;min-width:0}
input,select{font:inherit;font-size:1rem;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.92rem}
.sugg p{margin:0;color:var(--muted);font-size:.9rem}
.route{display:flex;flex-direction:column;gap:10px}
.route-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.route-head span{font-size:.85rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:74px;position:relative}
.tile b{font-size:.98rem;line-height:1.25}
.tile small{color:var(--muted);font-size:.8rem;line-height:1.3}
.tile.rm{border-left:5px solid var(--rose)}
.tile.rp{border-left:5px solid var(--sky)}
.tile.pc{border-left:5px solid var(--accent)}
.tile .dot{position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.tile.hl{box-shadow:0 0 0 3px var(--accent)}
/* módulo */
.top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
.back{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:700}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.tag.rm{background:var(--rose-soft);color:var(--rose)} .tag.rp{background:var(--sky-soft);color:var(--sky)} .tag.pc{background:var(--accent-soft);color:var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-data);font-size:.8rem;padding:5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.chip b{font-family:var(--f-body);font-weight:700;margin-right:4px;font-size:.78rem;color:var(--muted)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;border-bottom:1.5px solid var(--line)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 10px!important;font-size:.82rem;min-width:0}
.stepn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--f-data);font-size:.8rem;background:var(--surface);color:var(--muted)}
.tabs button[aria-selected="true"] .stepn{border-color:var(--accent);color:var(--accent);font-weight:700}
.stepn.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)!important}
.facts .chip{font-size:.74rem}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 12px;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.box{border-radius:10px;padding:12px 14px;border:1px solid}
.box h3{margin:0 0 6px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-body);font-weight:700}
.box ul{margin:0;padding-left:20px}
.box.warn{background:var(--warn-bg);border-color:var(--warn-line)} .box.warn h3{color:var(--warn)}
.box.miss{background:var(--miss-bg);border-color:var(--miss-line)} .box.miss h3{color:var(--miss)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.sec summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .cnt{font-family:var(--f-data);font-size:.8rem;color:var(--muted);font-weight:500}
details.sec[open] summary{border-bottom:1px solid var(--line)}
.items{list-style:none;margin:0;padding:6px 8px 10px}
.items li{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;border-radius:6px}
.items li:has(input:checked) span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.items input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.items .q{font-style:italic}
.note-src{font-size:.82rem;color:var(--muted);margin:0}
.notes-pick{display:flex;flex-wrap:wrap;gap:8px}
.notes-pick button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.92rem}
.notes-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
textarea{width:100%;font:inherit;font-size:1.05rem;line-height:1.55;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
#dict{min-height:220px} #nota{min-height:340px;font-size:.97rem}
.hint{font-size:.86rem;color:var(--muted);margin:6px 0 0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-weight:700;font-size:1rem;padding:12px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1 1 200px}
.btn:disabled{opacity:.55;cursor:default}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em;margin:0}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.out{display:flex;flex-wrap:wrap;gap:8px}
.risk{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.score{font-family:var(--f-data);font-size:1.6rem;font-variant-numeric:tabular-nums}
.pill{padding:5px 12px;border-radius:999px;font-weight:700;font-size:.88rem}
.pill.mid{background:var(--warn-bg);color:var(--warn)}
.an-sec{display:flex;flex-direction:column;gap:6px}
.an-sec h4{margin:6px 0 0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.an-dev{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:1.02rem;line-height:1.55;white-space:pre-wrap}
.an-ruta{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.an-ruta b{font-size:.98rem}.an-ruta small{color:var(--muted)}
.an-when{align-self:flex-start;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 10px;text-transform:uppercase;letter-spacing:.05em}
.an-when.hoy{background:var(--miss-bg);color:var(--miss)}.an-when.pronto{background:var(--warn-bg);color:var(--warn)}.an-when.programado{background:var(--accent-soft);color:var(--accent)}
.pill.low{background:var(--accent-soft);color:var(--accent)} .pill.high{background:var(--miss-bg);color:var(--miss)}
.hh{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hh li{display:flex;gap:10px;align-items:center;padding:5px 2px}
.hh input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.hh .pts{margin-left:auto;font-family:var(--f-data);font-size:.82rem;color:var(--muted)}
.hh .grp{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.foot{font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.micwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mic.on{background:var(--miss-bg);border-color:var(--miss);color:var(--miss)}
.mic-st{font-size:.88rem;color:var(--muted);min-width:0;flex:1 1 160px}
.bform{display:flex;flex-direction:column;gap:12px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:12px 14px 14px}
.bfl{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);min-width:0}
.bfl textarea{font-size:.95rem}
.bgrid .bfl:has(textarea),.bgrid .bfl:has([data-multi]){grid-column:1/-1}
.sugg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sugg button[aria-pressed="false"]{background:var(--surface);border-color:var(--line);font-weight:400}
.falta input,.falta select,.falta textarea,.falta [data-multi]{border-color:var(--miss)!important;box-shadow:0 0 0 2px var(--miss-bg)}
.falta>span:first-child{color:var(--miss);font-weight:700}
.lleno input,.lleno select,.lleno [data-multi]{border-color:var(--accent)!important;box-shadow:0 0 0 2px var(--accent-soft)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px 10px}
.pgrid input,.pgrid select{width:100%;min-width:0}.pgrid .bfl>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgrid .bfl{font-size:.74rem;gap:2px}
.pgrid input,.pgrid select{padding:6px 8px!important;font-size:.92rem!important;min-height:36px!important}
.pgrid .na{padding:0 6px;font-size:.68rem}
.pdet{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pdet>summary{cursor:pointer;font-size:.86rem;font-weight:700;color:var(--muted)}
.pdet[open]>summary{margin-bottom:8px}
.pdrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.pdrow .micwrap{margin:0}
.pac{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:.9rem;color:var(--muted)}
.pac b{color:var(--ink);font-size:1rem}
.pacbar{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:.88rem;color:var(--muted);margin-bottom:10px}
.pacbar b{color:var(--ink)}
.gx{border:2px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);margin-bottom:10px}
.gx-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gx-lab{font-size:1.3rem;font-weight:700;line-height:1.2}
.gx-hint{font-size:.85rem;color:var(--muted)}
.gx-val{font-size:1.15rem;font-weight:700;background:var(--accent-soft);border-radius:8px;padding:8px 10px;min-height:44px}
.gx-heard{font-size:.85rem;color:var(--muted);min-height:1.2em;font-style:italic}
.gx-msg{font-size:.9rem;font-weight:700;min-height:1.2em}
.gx-msg.err{color:var(--miss)} .gx-msg.ok{color:var(--accent)}
.gx-mic{font-size:.8rem;font-weight:700;color:var(--accent)}
.gx .btns .btn{flex:1 1 auto;padding:10px 12px;font-size:.92rem}
.pgrid .gx-on{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.popts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--accent-soft);border-radius:10px}
.popts button{border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem}
.popts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.popts .ph{width:100%;font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.guia{border:1.5px solid var(--accent);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.guia h3{margin:0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.guia ul{margin:0;padding-left:20px}.guia li{margin:2px 0}
.narow{display:flex;gap:6px;min-width:0}.narow input{flex:1 1 auto;min-width:0}
.na{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:0 10px;font-size:.8rem;font-weight:700}
.na[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.navrow{display:grid;grid-template-columns:64px 1fr;gap:10px}
.linkrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lnk{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
#pane{display:flex;flex-direction:column;gap:16px}
.drafts{display:flex;flex-direction:column;gap:6px}
.drafts button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.tile,.btn,.notes-pick button{transition:background .15s,border-color .15s,box-shadow .15s}}
</style>

<script>
/* ======================= CONTENIDO NORMATIVO (Res. 3280 de 2018) ======================= */
const VIOL = ["¿DURANTE EL ÚLTIMO AÑO, ha sido humillada, menospreciada, insultada o amenazada por su pareja?","¿DURANTE EL ÚLTIMO AÑO, fue golpeada, bofeteada, pateada o lastimada físicamente de otra manera?","¿DESDE QUE ESTÁ EN GESTACIÓN, ha sido golpeada, bofeteada, pateada o lastimada físicamente de alguna manera?","¿DURANTE EL ÚLTIMO AÑO, fue forzada a tener relaciones sexuales?"];
const DEPR = ["Durante el mes pasado, ¿con frecuencia se ha sentido triste, deprimida o sin esperanza?","Durante el mes pasado, ¿ha permanecido preocupada por tener poco interés o placer para hacer las cosas cotidianas?","Si responde sí a alguna: ¿Siente que necesita ayuda?"];
const CERVIX = ["Cuello uterino (rural disperso, obligatorio): 25 a 29 años citología; 30 a 50 años Ver y Tratar (VIA/VILI + crioterapia inmediata; prueba rápida ADN-VPH como alternativa junto con Ver y Tratar); 51 a 65 años citología o ADN-VPH sin triage","Si en la especuloscopia hay signos de carcinoma invasor: informar, alertar y gestionar colposcopia + biopsia en máximo 1 semana"];

const M = {
 precon:{route:"rm",title:"Preconcepcional",who:"Mujer que quiere embarazarse en el próximo año",
  facts:[["Consultas","1 inicial (30 min) + 1 control (20 min)"],["Quién","Medicina o enfermería"],["Ácido fólico","≥ 3 meses antes"]],
  alerts:["Antecedente genético o familiar (madre > 35, alteraciones genéticas, hemofilia) → ginecobstetricia","Respuesta positiva a las preguntas de depresión → ruta de salud mental","Enfermedad crónica (diabetes, tiroides, epilepsia, HTA, lupus, ERC, cardiopatía, trombofilia, asma, TB, cáncer) → especialista y anticoncepción hasta que esté controlada"],
  sections:[
   {t:"Preguntar",items:["¿Quiere embarazarse en el próximo año? (si no: asesoría anticonceptiva de la RPMS)","Enfermedades: diabetes, tiroides, epilepsia, HTA, lupus, artritis, ERC, cardiopatía, trombofilia, anemia, asma, tuberculosis, cáncer, IMC > 35","Salud sexual: inicio de relaciones, ITS, patología cervical o VPH, último tamizaje de cuello uterino, compañeros, preservativo, anticonceptivo actual","Antecedentes genéticos o familiares: madre mayor de 35, alteraciones genéticas, hemofilia","Obstétricos: pretérmino, cesárea, abortos, muerte fetal, gran multiparidad, intervalo < 18 meses, Rh, preeclampsia, RN < 2.500 g o macrosómico, hemorragia posparto, mola, depresión posparto","Hábitos: alimentación, suplementos o medicamentos para bajar de peso, actividad física, sueño, estrés, medicamentos, tabaco, alcohol, sustancias","Psicosocial: familia, redes de apoyo, violencias de género o sexual, pobreza","Esquema de vacunación"]},
   {t:"Examinar",items:["Examen físico completo cefalocaudal, incluida la cavidad bucal","Peso, talla, IMC y estado nutricional","Valoración ginecológica completa con especuloscopia"]},
   {t:"Exámenes",items:["Antígeno de superficie de hepatitis B","Tamizaje de cuello uterino según edad y ámbito (rural disperso)","Glicemia en ayunas","Hemoclasificación y hemograma","Hemoparásitos: gota gruesa (zona endémica)","IgG para toxoplasma, rubéola y varicela","Prueba treponémica rápida","Urocultivo con CMI","Prueba rápida de VIH con asesoría pre y post"]},
   {t:"Plan",items:["Ácido fólico 0,4 mg/día (4 mg si tuvo hijo con defecto del tubo neural), desde al menos 3 meses antes","Método anticonceptivo formulado desde la primera consulta hasta que decida embarazarse","Completar vacunas al menos 3 meses antes del embarazo","Esperar al menos 18 meses desde el último parto o cesárea","IMC ideal para embarazarse: menos de 25","Informar el derecho a la IVE","Control para leer los exámenes","Remitir según hallazgos: odontología, nutrición, psicología, trabajo social, especialista"]}
  ],

const EDU_PAMI = `EDUCACIÓN
Se brinda educación clara, comprensible y culturalmente respetuosa, explicada de manera verbal y reforzada con material educativo:
- Importancia del control prenatal: el control periódico y oportuno permite identificar riesgos, prevenir complicaciones maternas y fetales, detectar enfermedades de manera temprana y garantizar una atención segura durante la gestación, el parto y el puerperio.
- Atención del parto institucional: importancia de que el parto sea atendido en una institución de salud, con personal capacitado y acceso a atención oportuna ante complicaciones de la madre o el recién nacido.
- Signos y síntomas de alarma: consultar de inmediato por sangrado vaginal, salida de líquido por vagina, disminución o ausencia de movimientos fetales, cefalea persistente, visión borrosa, zumbidos en los oídos, dolor epigástrico, edemas progresivos, fiebre, síntomas urinarios, convulsiones o cualquier otro síntoma que genere alarma.
- Alimentación saludable: dieta balanceada, variada y suficiente, rica en proteínas, frutas, verduras, hierro, calcio y líquidos, acorde a su cultura y disponibilidad de alimentos.
- Actividad física y descanso: actividad física moderada según tolerancia, evitar esfuerzos excesivos, descanso adecuado.
- Preparación para el trabajo de parto: etapas del trabajo de parto, respiración, acompañamiento y señales de inicio.
- Lactancia materna: exclusiva durante los primeros seis (6) meses y complementaria hasta los dos (2) años o más.
- Prevención del consumo de sustancias: riesgos del alcohol, tabaco y sustancias psicoactivas en gestación y lactancia, y de la automedicación.
- Higiene y autocuidado, y prevención de infecciones respiratorias.

INFORMACIÓN SOBRE INTERRUPCIÓN VOLUNTARIA DEL EMBARAZO (IVE)
Se brinda información clara, completa y sin inducción sobre el derecho a la IVE, conforme a la Sentencia C-055 de 2022 y la Resolución 051 de 2023: es un derecho hasta la semana veinticuatro (24) por la sola voluntad de la mujer; después de la semana 24 procede cuando el embarazo represente riesgo para su vida o salud física o mental, sea resultado de violencia sexual, incesto o inseminación no consentida, o exista grave malformación fetal que haga inviable la vida extrauterina. El acceso debe ser oportuno, seguro, confidencial y sin barreras.

CONSEJERÍA EN PLANIFICACIÓN FAMILIAR PARA EL EGRESO
Se brinda consejería integral sobre los métodos anticonceptivos disponibles, su mecanismo de acción, efectividad, duración, efectos secundarios y contraindicaciones, y sobre la importancia de la planificación en el posparto. La elección es libre, voluntaria e informada.

INVITACIÓN AL CURSO DE PREPARACIÓN PARA LA MATERNIDAD Y LA PATERNIDAD
Se invita a la gestante y a su pareja o red de apoyo al curso. Se entrega volante con las fechas programadas.`;

const DAY=86400000;
function pD(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[a,b,c]=s.split("-").map(Number);return new Date(Date.UTC(a,b-1,c))}
function fmt(d){return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear()}
function egT(n){return Math.floor(n/7)+" semanas y "+(n%7)+" días"}
function calcular(x,fechaStr){
  const r={},f=pD(fechaStr);if(!f||!x)return r;
  const fum=pD(x.fum);
  if(fum){const d=Math.round((f-fum)/DAY);if(d>=0&&d<320){r.egFum=d;r.fppFum=new Date(fum.getTime()+280*DAY)}}
  const fe=pD(x.eco_fecha);
  if(fe&&Number.isFinite(+x.eco_semanas)&&x.eco_semanas!==null&&x.eco_semanas!==""){const a=(+x.eco_semanas)*7+(Number.isFinite(+x.eco_dias)?+x.eco_dias:0);const d=a+Math.round((f-fe)/DAY);if(d>=0&&d<320){r.egEco=d;r.fppEco=new Date(f.getTime()+(280-d)*DAY)}}
  const eco=r.egEco!=null&&(x.fum_confiable===false||r.egFum==null);
  r.eg=eco?r.egEco:r.egFum;r.fpp=eco?r.fppEco:r.fppFum;r.metodo=r.eg==null?null:(eco?"ecografía":"FUM");
  const t=+x.talla_m;

}

function calcTexto(r){const L=[];
  if(r.egFum!=null)L.push("EG por FUM: "+egT(r.egFum)+"; FPP por FUM: "+fmt(r.fppFum));
  if(r.egEco!=null)L.push("EG por ecografía (actualizada): "+egT(r.egEco)+"; FPP por ecografía: "+fmt(r.fppEco));
  if(r.metodo)L.push("EG que se usa en la nota: "+egT(r.eg)+" por "+r.metodo);
  if(r.imcPre!=null)L.push("IMC pregestacional/primer control: "+r.imcPre.toFixed(1)+" kg/m² (meta de ganancia total: "+metaGanancia(r.imcPre)+")");
  if(r.imc!=null)L.push("IMC actual: "+r.imc.toFixed(1)+" kg/m²");
  if(r.gan!=null)L.push("Ganancia de peso acumulada: "+r.gan.toFixed(1)+" kg");
  return L.join("\n")}
function chipsCalc(r){const o=[];
  if(r.eg!=null)o.push(["EG",Math.floor(r.eg/7)+"+"+(r.eg%7)+" ("+r.metodo+")"]);
  if(r.fpp)o.push(["FPP",fmt(r.fpp)]);
  if(r.imcPre!=null)o.push(["IMC pre",r.imcPre.toFixed(1)]);
  if(r.imc!=null)o.push(["IMC actual",r.imc.toFixed(1)]);
  if(r.imcPre!=null)o.push(["Meta ganancia",metaGanancia(r.imcPre)]);
  if(r.gan!=null)o.push(["Ganancia",r.gan.toFixed(1)+" kg"]);
  return o.map(([k,v])=>`<span class="chip"><b>${esc(k)}</b>${esc(v)}</span>`).join("")}

function sugerir(){
  const v=parseFloat($("f-edad").value),u=$("f-uni").value,sx=$("f-sexo").value,es=$("f-est").value;
  document.querySelectorAll(".tile.hl").forEach(t=>t.classList.remove("hl"));
  if(!Number.isFinite(v)){$("sugg").innerHTML="<p>Escribe la edad para ver qué le corresponde.</p>";return}
  const anos=u==="a"?v:u==="m"?v/12:v/365;const out=[];
  if(u==="d"&&v<=7)out.push("rn");
  else if(anos<6)out.push("pinf");else if(anos<12)out.push("inf");else if(anos<18)out.push("adol");else if(anos<29)out.push("juv");else if(anos<60)out.push("adul");else out.push("vej");
  if(sx==="f"){if(es==="ges")out.unshift("prenatal");if(es==="pos")out.unshift("parto");if(es==="pre")out.unshift("precon");if(es==="ive")out.unshift("ive")}
  if(sx==="f"&&es==="pos")out.push("rn");
  const uniq=[...new Set(out)];
  uniq.forEach(id=>{const t=$("t-"+id);if(t)t.classList.add("hl")});
  let extra="";if(sx==="f"&&anos<14&&(es==="ges"||es==="ive"))extra=`<p style="width:100%;color:var(--miss);font-weight:700">Menor de 14 años: activa la ruta de violencia sexual y notifica.</p>`;
  $("sugg").innerHTML=uniq.map(id=>`<button data-mod="${id}">${esc(M[id].title)}</button>`).join("")+extra;
  $("sugg").querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>openMod(b.dataset.mod));
}

function openMod(id){st.view="mod";st.mod=id;st.tab=S.get(key(id,"tab"))||"entr";st.note=S.get(key(id,"note"))||M[id].notes[0];if(!M[id].notes.includes(st.note))st.note=M[id].notes[0];renderMod();window.scrollTo(0,0)}
function renderMod(){

  if(!tabs.some(t=>t[0]===st.tab))st.tab="guia";

  ${m.facts.length?`<div class="facts">${m.facts.map(([k,v])=>`<span class="chip"><b>${esc(k)}</b>${esc(v)}</span>`).join("")}</div>`:""}

}

  const start=()=>{stopRec();const r=new SR();REC=r;recOn=true;r.lang="es-CO";r.continuous=true;r.interimResults=true;
    let base=ta.value.trim();
    r.onresult=e=>{let fin="",tmp="";for(let k=e.resultIndex;k<e.results.length;k++){const t=e.results[k][0].transcript;if(e.results[k].isFinal)fin+=t;else tmp+=t}
      if(fin){base=(base?base+" ":"")+fin.trim();ta.value=base;onChange&&onChange()}s.textContent=tmp?"… "+tmp:"Escuchando"};
    r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){recOn=false;s.textContent="El micrófono no está permitido aquí. Usa la versión instalada desde GitHub y acepta el permiso del micrófono."}else if(e.error==="network"){recOn=false;s.textContent="Sin internet no se puede transcribir. Dicta con el teclado o toca una opción."}else if(e.error==="no-speech"){s.textContent="No se oye nada. Acerca el celular a quien habla."}};
    r.onend=()=>{if(recOn&&REC===r){try{base=ta.value.trim();r.start()}catch(e){}}else{b.textContent="Dictar por voz";b.classList.remove("on");if(!/permitido|internet/.test(s.textContent))s.textContent=""}};
    try{r.start();b.textContent="■ Detener";b.classList.add("on");s.textContent="Escuchando"}catch(e){s.textContent="No se pudo iniciar el micrófono."}};
  const self=root.querySelector(".micwrap")&&root.querySelector(".micwrap").dataset.self;
  b.onclick=()=>{if(recOn){stopRec();return}if(self||S.get(key(st.mod,"vozok"))){start();return}ok.hidden=false};
  root.querySelector(".mic-me").onclick=()=>{ok.hidden=true;start()};
  root.querySelector(".mic-yes").onclick=()=>{S.set(key(st.mod,"vozok"),"1");ok.hidden=true;start()};
  root.querySelector(".mic-no").onclick=()=>{ok.hidden=true;s.textContent="Sin permiso: dicta tú el resumen de su respuesta."};

     "Pedirle que, si más adelante le dan algún remedio o curación, nos cuente, para revisar juntos que no afecte el embarazo."],
  r:"Se informa que la atención tradicional y la del servicio de salud pueden complementarse; se le pide informar cualquier remedio o curación que reciba."},
 "Medicina tradicional|Payé":{t:"Para responderle: si consultó al payé o sabedor",
  p:["Reconocer y valorar la consulta con el payé; no desautorizarlo.",
     "Preguntar qué le recomendó: curaciones, rezos, dietas o alimentos que debe evitar.",
     "Si la dieta le quita alimentos importantes (pescado, carne, huevo), buscar con ella alternativas que el payé acepte, sin contradecirlo de frente.",
     "Explicar que el ácido fólico, las vacunas y los controles no interfieren con sus curaciones; las dos atenciones pueden ir juntas.",
     "Si ella quiere, el payé o un familiar puede acompañarla a los controles.",
     "Acordar que nos cuente si le dan algo para tomar."],
  r:"Se respeta y reconoce la consulta con el médico tradicional; se indagan sus recomendaciones y se concerta la atención complementaria con el servicio de salud."},
 "Medicina tradicional|Partera":{t:"Para responderle: si consultó a la partera",
  p:["Reconocer el papel de la partera en la comunidad.",
     "Preguntar si la partera la va a acompañar en el embarazo y el parto.",
     "Invitar a la partera a los controles, si la usuaria lo desea.",
     "Explicar que cuando quede embarazada debe venir pronto al control (antes de la semana 10) y que el plan de parto se hace también con la partera.",
     "Repasar con ella, y si es posible con la partera, los signos de alarma del embarazo por los que deben venir de inmediato:",
     "• Sangrado por la vagina, aunque sea poco.",
     "• Salida de líquido por la vagina.",
     "• Dolor de cabeza fuerte, ver lucecitas o visión borrosa.",
     "• Hinchazón de la cara, las manos o los pies.",
     "• Fiebre o escalofríos.",
     "• Dolor fuerte de barriga o contracciones antes de tiempo.",
     "• El bebé se mueve menos o deja de moverse (después del 5.º mes).",
     "• Vómito que no deja comer ni beber, ardor al orinar, o convulsiones."],
  r:"Se reconoce el acompañamiento de la partera; se invita a vincularla a los controles y al plan de parto. Se explican los signos de alarma del embarazo: sangrado o salida de líquido por vagina, cefalea intensa o alteraciones visuales, edema de cara y manos, fiebre, dolor abdominal o contracciones antes de tiempo, disminución de movimientos fetales, vómito persistente, disuria y convulsiones."},
 "Medicina tradicional|Remedio de plantas":{t:"Para responderle: si toma remedios de plantas",
  p:["Preguntar el nombre de la planta, para qué la toma, cómo la prepara, cuánta y cada cuánto.",
     "No prohibir de entrada: si es para algo sencillo y no hay señales de riesgo, puede seguir y se registra.",
     "Explicar que algunas plantas pueden producir sangrado, contracciones o afectar al bebé, sobre todo las que se usan para \"bajar la regla\", para purgar o para abortar: si busca embarazo, es mejor no tomarlas.",
     "Si no se sabe qué efecto tiene la planta, anotarla y consultarla con medicina antes de que quede embarazada.",
     "Pedirle que nos cuente si empieza a tomar otra."],
  r:"Se indaga sobre el uso de plantas medicinales (nombre, uso, preparación y frecuencia); se orienta sobre plantas que pueden afectar la gestación y se le pide informar cualquier remedio nuevo."},
 "Enfermedades|Hipertensión":{t:"Hipertensión: qué hacer antes del embarazo",
  p:["Remitir a medicina antes de buscar el embarazo.",
     "Enalapril, losartán y los diuréticos no se usan en el embarazo: medicina los cambia (la 3280 menciona alfametildopa o nifedipino) y solicita los estudios que correspondan. No suspenderlos por su cuenta.",
     "Llegar al embarazo con la presión controlada.",
     "En el embarazo tendrá más riesgo de preeclampsia: control prenatal temprano y valoración por medicina (la aspirina la indica medicina)."],
  r:"Antecedente de hipertensión: se remite a medicina para valoración preconcepcional y ajuste de antihipertensivos antes del embarazo; se explica riesgo de preeclampsia y necesidad de control prenatal temprano."},
 "Enfermedades|Diabetes":{t:"Diabetes: qué hacer antes del embarazo",
  p:["Remitir a medicina antes de buscar el embarazo.",
     "Es muy importante llegar al embarazo con el azúcar bien controlada: el azúcar alta al inicio del embarazo aumenta el riesgo de malformaciones y de perder el bebé.",
     "Medicina solicita hemoglobina glicosilada: la meta antes del embarazo es menor de 6,5 %; ajusta el tratamiento y deriva a la ruta cardio-cerebro-vascular-metabólica. No suspender el tratamiento por su cuenta.",
     "Peso adecuado y ejercicio regular.",
     "Planificar hasta que el médico diga que el control es bueno."],
  r:"Antecedente de diabetes: se remite a medicina para optimizar control glucémico y ajustar tratamiento antes del embarazo; se recomienda anticoncepción hasta lograr control adecuado."},
 "Enfermedades|Epilepsia":{t:"Epilepsia: qué hacer antes del embarazo",
  p:["Remitir a medicina antes de buscar el embarazo.",
     "Enfermería: formular ácido fólico 4 mg/día (no 0,4 mg), desde al menos 3 meses antes del embarazo (Res. 3280).",
     "Medicina define el tratamiento: la 3280 recomienda un solo medicamento a la menor dosis, preferir carbamazepina, lamotrigina o levetiracetam (el ácido valproico aumenta el riesgo de malformaciones) y valorar suspenderlo 6 meses antes si lleva 2 años sin convulsiones.",
     "Nunca suspender el medicamento por su cuenta: una convulsión en el embarazo es peligrosa.",
     "Asesoría y provisión de anticoncepción hasta que medicina lo autorice."],
  r:"Antecedente de epilepsia: se formula ácido fólico 4 mg/día según Res. 3280, se remite a medicina para manejo del anticonvulsivante antes del embarazo, se explica no suspender el tratamiento y se brinda asesoría anticonceptiva."},
 "Enfermedades|Asma":{t:"Asma: qué hacer antes del embarazo",
  p:["Los inhaladores para el asma se pueden usar en el embarazo: debe seguir usándolos.",
     "Lo importante es llegar con el asma controlada; si tiene crisis frecuentes, remitir a medicina.",
     "Evitar el humo de leña y el tabaco."],
  r:"Antecedente de asma: se orienta continuar tratamiento inhalado y lograr control antes del embarazo."},
 "Enfermedades|Anemia":{t:"Anemia: qué hacer antes del embarazo",
  p:["Enfermería: solicitar hemograma y gota gruesa (están en los exámenes preconcepcionales).",
     "Si el hemograma confirma anemia, remitir a medicina para el tratamiento: es un paraclínico anormal.",
     "Alimentos con hierro: carne, pescado, hígado, huevo, fríjol y hojas verdes.",
     "Corregir la anemia antes del embarazo."],
  r:"Antecedente de anemia: se solicitan hemograma y gota gruesa; si se confirma anemia se remite a medicina para tratamiento; se orienta alimentación rica en hierro."},
 "Enfermedades|Tiroides":{t:"Tiroides: qué hacer antes del embarazo",
  p:["Remitir a medicina antes de buscar el embarazo: la tiroides debe estar controlada (TSH).",
     "Si toma levotiroxina, la dosis casi siempre se ajusta al quedar embarazada; no suspenderla."],
  r:"Antecedente de enfermedad tiroidea: se remite a medicina para control de TSH y ajuste del tratamiento antes del embarazo."},
 "Enfermedades|Corazón o riñón":{t:"Enfermedad del corazón o del riñón",
  p:["Remitir a medicina y, según el caso, al especialista antes de buscar el embarazo: algunas de estas enfermedades hacen el embarazo de alto riesgo.",
     "Revisar sus medicamentos con el médico.",
     "Planificar hasta tener esa valoración."],
  r:"Antecedente de enfermedad cardiaca o renal: se remite a medicina/especialista para valoración del riesgo preconcepcional; anticoncepción hasta la valoración."},
 "Enfermedades|Lupus":{t:"Lupus: qué hacer antes del embarazo",
  p:["Remitir a medicina y especialista: lo ideal es embarazarse cuando el lupus lleva varios meses sin actividad.",
     "Algunos medicamentos deben cambiarse antes del embarazo.",
     "Planificar hasta tener esa valoración."],
  r:"Antecedente de lupus: se remite a medicina/especialista para valoración preconcepcional; anticoncepción hasta la valoración."},
 "Enfermedades|Tuberculosis":{t:"Tuberculosis: qué hacer antes del embarazo",
  p:["Si está en tratamiento, terminarlo completo antes de buscar el embarazo.",
     "La rifampicina disminuye el efecto de las pastillas, el implante y las inyecciones: mientras la tome, usar condón o DIU.",
     "Remitir a medicina para valorar el momento del embarazo."],
  r:"Antecedente de tuberculosis: se orienta completar tratamiento, interacción de rifampicina con anticonceptivos hormonales y valoración médica antes del embarazo."},
 "Medicamentos y remedios|Hierro":{t:"Si toma hierro",
  p:["Puede seguir tomándolo; es útil antes y durante el embarazo.","Verificar con el hemograma si todavía lo necesita y por cuánto tiempo.","Tomarlo lejos de las comidas y del café; puede oscurecer las heces y dar estreñimiento."],
  r:"Toma hierro: se orienta continuar según hemograma y forma de administración."},
 "Medicamentos y remedios|Ácido fólico":{t:"Si ya toma ácido fólico",
  p:["Muy bien: debe seguir tomándolo todos los días hasta la semana 12 del embarazo.","La dosis habitual es 0,4 mg al día; la dosis alta (4 mg) solo si tuvo un hijo con defecto del tubo neural o si el médico la indica."],
  r:"Toma ácido fólico: se refuerza adherencia hasta la semana 12 de gestación y se verifica la dosis."},
 "Medicamentos y remedios|Antihipertensivo":{t:"Si toma medicamento para la presión",
  p:["Remitir a medicina antes de buscar el embarazo.","Enalapril, captopril, losartán y otros de ese grupo no se usan en el embarazo: el médico debe cambiarlos antes.","No suspenderlo por su cuenta."],
  r:"Toma antihipertensivo: se remite a medicina para ajuste a un medicamento compatible con la gestación antes del embarazo."},
 "Medicamentos y remedios|Anticonvulsivante":{t:"Si toma medicamento para las convulsiones",
  p:["Remitir a medicina antes de buscar el embarazo.","El ácido valproico y algunos otros aumentan el riesgo de malformaciones: el médico puede cambiarlos.","Nunca suspenderlo por su cuenta."],
  r:"Toma anticonvulsivante: se remite a medicina para revisión del tratamiento y dosis de ácido fólico antes del embarazo."},
 "Medicamentos y remedios|Plantas":{t:"Si toma remedios de plantas",
  p:["Preguntar el nombre, para qué, cómo la prepara y cada cuánto.","Las que se usan para bajar la regla, purgar o abortar pueden afectar el embarazo: mejor no tomarlas si busca embarazarse.","Si no se sabe su efecto, anotarla y consultarla con medicina."],
  r:"Toma plantas medicinales: se indaga nombre, uso y frecuencia y se orienta sobre las que pueden afectar la gestación."},
 "Medicamentos y remedios|Otro":{t:"Medicamentos que se deben revisar antes del embarazo",
  p:["Revisar con medicina si toma: isotretinoína (para el acné; esperar al menos un mes después de suspenderla), warfarina, metotrexato, medicamentos para el colesterol, tetraciclina o doxiciclina, misoprostol.","Ante la duda con cualquier medicamento, anotarlo y consultarlo antes de buscar el embarazo."],
  r:"Se revisan medicamentos de uso actual y se orienta sobre los que requieren ajuste antes del embarazo."},
 "Cirugías y alergias|Cesárea":{t:"Si tuvo cesárea",
  p:["Esperar al menos 18 meses desde la cesárea antes del próximo embarazo.","El próximo parto debe ser en hospital: el útero con cicatriz tiene riesgo de romperse durante el trabajo de parto.","Anotar cuántas cesáreas ha tenido; con dos o más, el riesgo es mayor.","Esto se tiene en cuenta en el plan de parto desde el inicio del embarazo."],
  r:"Antecedente de cesárea: se orienta intervalo intergenésico mínimo de 18 meses y atención institucional del próximo parto."},
 "Cirugías y alergias|Cirugía en el útero":{t:"Si tuvo cirugía en el útero",
  p:["Remitir a medicina: según la cirugía, el próximo embarazo puede ser de alto riesgo.","El parto debe ser en hospital.","Pedir, si tiene, el papel de la cirugía para saber qué le hicieron."],
  r:"Antecedente de cirugía uterina: se remite a medicina para valoración preconcepcional; se orienta atención institucional del parto."},
 "Cirugías y alergias|Alergia a penicilina":{t:"Si dice ser alérgica a la penicilina",
  p:["Preguntar qué le pasó exactamente: ronchas, hinchazón de la cara, dificultad para respirar o desmayo (alergia verdadera), o solo dolor, fiebre o malestar (no es alergia).","Es importante porque la penicilina benzatínica es el único tratamiento que protege al bebé de la sífilis en el embarazo.","Si es alergia verdadera, anotarlo claro en la historia y en el carné; en caso de sífilis necesitará tratamiento en hospital.","Hacer la prueba de sífilis antes del embarazo."],
  r:"Refiere alergia a penicilina: se caracteriza la reacción, se registra en historia y carné, y se explica su importancia para el tratamiento de sífilis gestacional."},
 "Cirugías y alergias|Alergia a otro medicamento":{t:"Si es alérgica a otro medicamento",
  p:["Preguntar qué reacción tuvo y anotarla.","Registrarla en la historia y en el carné."],
  r:"Se registra alergia medicamentosa y tipo de reacción en historia y carné."},
 "Trombosis|Refiere":{t:"Si tuvo trombosis",
  p:["La Res. 3280 indica que en trombofilia están contraindicados los métodos hormonales: ofrecer DIU de cobre o condón mientras la valora medicina.","Si usa inyección, pastillas o implante, remitir a medicina para definir el cambio de método.","Remitir a medicina antes del embarazo: el embarazo aumenta el riesgo de una nueva trombosis; si toma warfarina, medicina la cambia por heparina antes del embarazo."],
  r:"Antecedente de trombosis: se orienta método no hormonal (DIU de cobre o condón) según Res. 3280 y se remite a medicina para valoración del riesgo trombótico y del método antes del embarazo."},
 "Complicaciones obstétricas previas|Preeclampsia":{t:"Si tuvo preeclampsia",
  p:["Tiene más riesgo de que se repita: el próximo embarazo es de riesgo.","Remitir a medicina antes del embarazo o apenas quede embarazada: la aspirina desde la semana 12 la indica medicina.","Control prenatal antes de la semana 10.","Repasar signos de alarma: dolor de cabeza fuerte, visión borrosa, hinchazón."],
  r:"Antecedente de preeclampsia: se remite a medicina para valoración preconcepcional y del riesgo en la próxima gestación; se orienta control prenatal temprano y signos de alarma."},
 "Complicaciones obstétricas previas|Hemorragia posparto":{t:"Si tuvo hemorragia después del parto",
  p:["El próximo parto debe ser en hospital: dejarlo claro desde ahora en el plan de parto.","Enfermería: solicitar hemograma; si hay anemia, remitir a medicina para tratamiento.","Remitir a medicina para valoración preconcepcional del riesgo."],
  r:"Antecedente de hemorragia posparto: se orienta parto institucional, se solicita hemograma y se remite a medicina para valoración del riesgo."},
 "Complicaciones obstétricas previas|Muerte del bebé":{t:"Si un bebé murió antes o después de nacer",
  p:["Preguntar con cuidado cuándo fue, en qué semana o a los cuántos días, y si sabe la causa.","Reconocer su duelo; preguntar cómo se siente con la idea de un nuevo embarazo.","Remitir a medicina: puede haber causas que se previenen (presión alta, diabetes, sífilis, infecciones).","Si hay tristeza persistente, ofrecer apoyo de psicología."],
  r:"Antecedente de muerte perinatal: se indagan circunstancias, se brinda apoyo emocional y se remite a medicina para valoración preconcepcional."},
 "Complicaciones obstétricas previas|Bebé pequeño":{t:"Si tuvo un bebé de bajo peso",
  p:["Revisar su estado nutricional y alimentación; peso adecuado antes del embarazo.","Respetar el intervalo de 18 meses.","Descartar anemia, infecciones y consumo de tabaco o alcohol.","Si hubo causa médica (presión alta, otra), remitir a medicina."],
  r:"Antecedente de recién nacido de bajo peso: se valora estado nutricional, se orienta intervalo intergenésico y control prenatal temprano."},
 "Complicaciones obstétricas previas|Parto prematuro":{t:"Si tuvo un parto prematuro",
  p:["Tiene más riesgo de que se repita: remitir a medicina para valoración preconcepcional.","Tratar las infecciones urinarias y vaginales antes del embarazo (urocultivo en los exámenes; tratamiento por medicina si sale positivo).","Respetar el intervalo de 18 meses y entrar temprano al control prenatal."],
  r:"Antecedente de parto pretérmino: se remite a medicina para valoración preconcepcional; se orienta intervalo intergenésico y control prenatal temprano."},
 "Complicaciones obstétricas previas|Abortos repetidos":{t:"Si ha tenido abortos repetidos",
  p:["Dos o más pérdidas seguidas ameritan estudio: remitir a medicina.","Iniciar ácido fólico y planificar hasta tener la valoración, si ella lo desea.","Reconocer el duelo y preguntar cómo se siente."],
  r:"Antecedente de pérdidas gestacionales repetidas: se remite a medicina para estudio preconcepcional."},
 "Complicaciones obstétricas previas|Mola":{t:"Si tuvo embarazo molar",
  p:["Preguntar si terminó el seguimiento con las pruebas de sangre (hormona del embarazo) hasta que salieron normales.","No debe embarazarse hasta que medicina dé el alta del seguimiento: mientras tanto, usar un método anticonceptivo.","Si no terminó el seguimiento, remitir a medicina."],
  r:"Antecedente de enfermedad trofoblástica: se verifica seguimiento con hCG, se orienta anticoncepción hasta el alta médica y se remite a medicina."},
 "Grupo sanguíneo y Rh|O-":{t:"Si es Rh negativo",
  p:["Preguntar si ha tenido embarazos, partos o abortos antes y si después le pusieron una inyección (inmunoglobulina anti-D).",
     "Preguntar el grupo y Rh de la pareja: si él también es Rh negativo, no hay riesgo para el bebé por esta causa.",
     "Enfermería: solicitar la hemoclasificación si no hay un resultado confiable.",
     "Remitir a medicina para valorar el riesgo; la inmunoglobulina anti-D y el Coombs indirecto los indica medicina.",
     "Explicarle que en cada embarazo, aborto o sangrado debe avisar que es Rh negativo."],
  r:"Usuaria Rh negativo: se indagan gestaciones previas, aplicación de anti-D y Rh de la pareja; se remite a medicina para valoración del riesgo de aloinmunización."},
 "Grupo sanguíneo y Rh|A-":{t:"Si es Rh negativo",
  p:["Preguntar si ha tenido embarazos, partos o abortos antes y si después le pusieron una inyección (inmunoglobulina anti-D).",
     "Preguntar el grupo y Rh de la pareja: si él también es Rh negativo, no hay riesgo para el bebé por esta causa.",
     "Enfermería: solicitar la hemoclasificación si no hay un resultado confiable.",
     "Remitir a medicina para valorar el riesgo; la inmunoglobulina anti-D y el Coombs indirecto los indica medicina.",
     "Explicarle que en cada embarazo, aborto o sangrado debe avisar que es Rh negativo."],
  r:"Usuaria Rh negativo: se indagan gestaciones previas, aplicación de anti-D y Rh de la pareja; se remite a medicina para valoración del riesgo de aloinmunización."},
 "Grupo sanguíneo y Rh|B-":{t:"Si es Rh negativo",
  p:["Preguntar si ha tenido embarazos, partos o abortos antes y si después le pusieron una inyección (inmunoglobulina anti-D).",
     "Preguntar el grupo y Rh de la pareja: si él también es Rh negativo, no hay riesgo para el bebé por esta causa.",
     "Enfermería: solicitar la hemoclasificación si no hay un resultado confiable.",
     "Remitir a medicina para valorar el riesgo; la inmunoglobulina anti-D y el Coombs indirecto los indica medicina.",
     "Explicarle que en cada embarazo, aborto o sangrado debe avisar que es Rh negativo."],
  r:"Usuaria Rh negativo: se indagan gestaciones previas, aplicación de anti-D y Rh de la pareja; se remite a medicina para valoración del riesgo de aloinmunización."},
 "Grupo sanguíneo y Rh|AB-":{t:"Si es Rh negativo",
  p:["Preguntar si ha tenido embarazos, partos o abortos antes y si después le pusieron una inyección (inmunoglobulina anti-D).",
     "Preguntar el grupo y Rh de la pareja: si él también es Rh negativo, no hay riesgo para el bebé por esta causa.",
     "Enfermería: solicitar la hemoclasificación si no hay un resultado confiable.",
     "Remitir a medicina para valorar el riesgo; la inmunoglobulina anti-D y el Coombs indirecto los indica medicina.",
     "Explicarle que en cada embarazo, aborto o sangrado debe avisar que es Rh negativo."],
  r:"Usuaria Rh negativo: se indagan gestaciones previas, aplicación de anti-D y Rh de la pareja; se remite a medicina para valoración del riesgo de aloinmunización."},
 "Deseo de embarazo|No":{t:"La consulta pasa a asesoría anticonceptiva",
  p:["Respetar su decisión: la consulta se enfoca en planificación familiar y se omite la formulación de ácido fólico.",
     "Preguntar qué métodos conoce o ha usado, cómo le fue y cuál prefiere. La decisión es de ella; no necesita permiso de la pareja.",
     "Opciones: implante (3 a 5 años según el tipo) y DIU (hasta 10 años) son los más efectivos; luego la inyección trimestral o mensual y las pastillas; el condón.",
     "El condón además protege de infecciones de transmisión sexual: lo ideal es usarlo junto con otro método.",
     "Puede cambiar o retirar el método cuando quiera; si después desea un embarazo, vuelve a la consulta preconcepcional.",
     "Si tuvo relaciones sin protección en los últimos días, ofrecer anticoncepción de emergencia (mejor en las primeras 72 horas)."],
  r:"No desea embarazo: se brinda asesoría en anticoncepción (opciones disponibles, eficacia, doble protección con condón, derecho a elegir y cambiar de método, anticoncepción de emergencia)."},
 "Deseo de embarazo|Solo ella":{t:"Para responderle: si la pareja no ha decidido",
  p:["La decisión sobre su cuerpo es de ella; respetarla.",
     "Si ella quiere, invitar a la pareja a la próxima consulta para hablar del embarazo, de su salud (pruebas de infecciones, vacunas) y del apoyo que ella necesitará.",
     "Preguntar con tacto si se siente presionada para embarazarse o para no hacerlo, o si hay conflictos en casa por este tema."],
  r:"Se invita a vincular a la pareja en la próxima consulta, respetando la decisión de la usuaria; se indaga presión o conflicto relacionado con la reproducción."},
 "Deseo de embarazo|No sabe":{t:"Para responderle: si aún no ha decidido",
  p:["Es normal no estar segura; no tiene que decidir hoy.",
     "Mientras decide, seguir planificando con el método que prefiera.",
     "Si cree que lo querrá en el próximo año, puede empezar ya el ácido fólico: no le hace daño.",
     "Cuando decida, puede volver a esta consulta."],
  r:"Usuaria indecisa frente al embarazo: se orienta continuar anticoncepción hasta decidir y se ofrece retomar la consulta preconcepcional cuando lo desee."},
 "Método anticonceptivo actual|Ninguno":{t:"Para responderle: sin método",
  p:["Si quiere embarazarse: lo ideal es prepararse primero (ácido fólico 3 meses antes, vacunas, exámenes).",
     "Si no quiere embarazarse aún: ofrecer un método hoy mismo.",
     "Recordar el condón para prevenir infecciones de transmisión sexual."],
  r:"Sin método anticonceptivo: se orienta sobre preparación preconcepcional y se ofrece anticoncepción mientras decide."},
 "Método anticonceptivo actual|Inyectable mensual":{t:"Para responderle: inyección mensual",
  p:["Cuando decida buscar el embarazo, simplemente no se pone la siguiente inyección.",
     "La fertilidad vuelve en pocos meses (casi siempre de 1 a 3).",
     "Lo ideal es seguir con la inyección hasta completar 3 meses de ácido fólico."],
  r:"Se orienta sobre suspensión del inyectable mensual y retorno de la fertilidad en 1 a 3 meses."},
 "Método anticonceptivo actual|Inyectable trimestral":{t:"Para responderle: inyección de cada 3 meses",
  p:["Cuando decida buscar el embarazo, no se pone la siguiente inyección.",
     "Con este método la fertilidad tarda más en volver: en promedio unos 10 meses desde la última inyección, a veces hasta un año o más. Es esperado y no daña la fertilidad.",
     "Si quiere el embarazo pronto, puede suspenderla ya y usar condón mientras completa el ácido fólico."],
  r:"Se orienta sobre suspensión del inyectable trimestral y retorno tardío de la fertilidad (promedio de 10 meses desde la última aplicación)."},

function mostrarFaltan(falt){const mb=$("b-miss");if(!mb)return;if(!falt.length){mb.hidden=true;return}mb.hidden=false;
  mb.querySelector("h3").textContent=`No se puede enviar: ${falt.length===1?"falta 1 dato":"faltan "+falt.length+" datos"} de la tabla de variables`;
  mb.querySelector("ul").innerHTML=falt.map(f=>`<li>${esc(f.l)}${f.inc?" — <b>la fecha está incompleta</b> (día, mes y año)":""} <span class="note-src">(${esc(f.k)})</span></li>`).join("")}
function syncTxt(){const el=$("syncTxt");if(!el)return;const c=conf(),n=cola().length;
  el.textContent=!c.url?"Falta configurar la conexión con tu Google Sheets (botón Conexión). Mientras tanto los registros quedan guardados en el celular.":
   n?`${n} registro(s) pendientes por enviar. Se envían solos cuando hay señal.`:"Todo enviado. La hoja está al día."}
async function sync(manual){
  const c=conf(),q=cola();if(syncing||!q.length||!c.url){syncTxt();return}
  if(!navigator.onLine){if(manual&&$("syncTxt"))$("syncTxt").textContent=`Sin señal: ${q.length} pendiente(s) quedan guardados y se envían cuando vuelva.`;return}
  syncing=true;if($("syncTxt"))$("syncTxt").textContent="Enviando…";
  try{const r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({clave:c.key,registros:q})});
    const j=await r.json();
    if(j.ok){const ok=new Set(j.ids||[]);setCola(cola().filter(x=>!ok.has(x.id)));if(st.view==="base"&&!baseEdit)base({});const s=$("b-st");if(s)s.textContent=`Enviado a la hoja (${ok.size}).`}
    else if($("syncTxt"))$("syncTxt").textContent=j.error==="clave"?"La clave no coincide con la del script. Revísala en Conexión.":"La hoja respondió con error: "+(j.error||"");
  }catch(e){if($("syncTxt"))$("syncTxt").textContent=`No se pudo enviar (${cola().length} pendientes). Se reintenta al volver la señal.`+(location.hostname.endsWith("claude.ai")||!window.fetch?"":"")}
  finally{syncing=false;if(st.view==="base")syncTxt();if(st.view==="home"){const h=$("bq");if(h)h.textContent=cola().length?cola().length+" pendientes":"al día"}}
}
window.addEventListener("online",()=>sync(false));

/* ---------- arranque ---------- */
home();sync(false);
(async()=>{try{sample=window.claude?await window.claude.use("sample"):null}catch(e){sample=null}
  if(sample&&st.view==="mod"&&st.tab==="nota"){const g=$("go"),h=$("offHint");if(g)g.textContent="Organizar nota";if(h)h.hidden=true}})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
